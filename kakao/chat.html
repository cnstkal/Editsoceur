<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>채팅방</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>
<header class="head">
  <div class="pill back" id="back"></div>
  <div class="title" id="title"></div>
  <div class="pill tools" id="tools"></div>
</header>
<main id="chat"></main>
<footer class="comp">
  <button class="btn" id="plus" aria-label="추가"></button>
  <input placeholder="메시지 입력">
  <span class="smile" id="smile"></span>
  <button class="btn hash" id="hash" aria-label="해시태그"></button>
</footer>
<script src="chat.js"></script>
</body>
</html>
