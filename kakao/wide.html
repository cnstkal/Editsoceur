<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카카오톡 채팅 16:9</title>
<link rel="stylesheet" href="wide.css?v=1">
</head>
<body>
<a class="tback" href="index.html" data-html2canvas-ignore>‹ 선택화면</a>
<div class="stage" id="cap">
  <header class="head">
    <div class="back" id="back"></div>
    <div class="title" id="title"></div>
    <div class="tools" id="tools"></div>
  </header>
  <main id="chat"></main>
</div>
<p class="hint" data-html2canvas-ignore>가로 16 고정 · 세로는 대화가 길어지는 만큼 늘어나요 (최소 16:9). 저장 시 가로 1920px.</p>
<section class="editor">
  <h2>채팅방 편집</h2>
  <div class="r2"><label>상대 이름<input id="iRoom"></label><label>뒤로가기 숫자(비우면 숨김)<input id="iUn"></label></div>
  <label class="file">상대 프로필 사진<input id="iAv" type="file" accept="image/*"></label>
  <h2>대화</h2>
  <div id="list"></div>
  <div class="adds">
    <button type="button" class="ghost" data-add="f">+ 상대 말풍선</button>
    <button type="button" class="ghost" data-add="m">+ 내 말풍선</button>
    <button type="button" class="ghost" data-add="d">+ 날짜 구분선</button>
  </div>
</section>
<div class="bar" data-html2canvas-ignore><button id="save" class="primary">PNG로 저장</button><button id="reset" class="secondary">초기화</button></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="wide.js?v=1"></script>
</body>
</html>
