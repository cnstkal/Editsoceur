<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카카오톡 채팅 16:9</title>
<link rel="stylesheet" href="wide.css?v=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=3">
<link rel="stylesheet" href="../ps-editor.css?v=1"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>카카오톡 채팅 16:9</h2>
<div class="ps-stage"><div class="ps-frame">
<div class="stage" id="cap">
  <header class="head">
    <div class="back" id="back"></div>
    <div class="title" id="title"></div>
    <div class="tools" id="tools"></div>
  </header>
  <main id="chat"></main>
</div>
</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>카카오톡 채팅 16:9 내용 수정</h2><div class="ps-edwrap"><section class="editor">
<div class="ps-pn" data-t="기본">
  <h2>채팅방 편집</h2>
  <div class="r2"><label>상대 이름<input id="iRoom"></label><label>뒤로가기 숫자(비우면 숨김)<input id="iUn"></label></div>
  <label class="file">상대 프로필 사진<input id="iAv" type="file" accept="image/*"></label>
  </div>
<div class="ps-pn" data-t="채팅" hidden><h2>대화</h2>
  <div id="list"></div>
  <div class="adds">
    <button type="button" class="ghost" data-add="f">+ 상대 말풍선</button>
    <button type="button" class="ghost" data-add="m">+ 내 말풍선</button>
    <button type="button" class="ghost" data-add="d">+ 날짜 구분선</button>
  </div>
</div>
</section></div><div class="ps-acts"><button id="save" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="wide.js?v=1"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
</body>
</html>
