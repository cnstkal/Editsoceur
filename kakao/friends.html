<div class="ps-pn" data-t="기본">
  <h2>카카오톡 친구 편집</h2>
  <label>내 이름<input id="iName"></label>
  <div class="row"><label>채팅 배지(비우면 숨김)<input id="iB1"></label><label>채널 배지<input id="iB2"></label></div>
  <div class="musicbox"><div class="trow"><span>생일인 친구 표시</span><label class="sw"><input id="iBd" type="checkbox"><i></i></label></div>
  <div class="trow"><span>즐겨찾는 친구 표시</span><label class="sw"><input id="iFav" type="checkbox"><i></i></label></div>
  <div class="trow"><span>더보기 빨간 점</span><label class="sw"><input id="iDot" type="checkbox"><i></i></label></div><div class="trow"><span>하단 바 표시</span><label class="sw"><input id="iNav" type="checkbox"><i></i></label></div></div>
  <div class="row" style="margin-top:12px"><label>생일 친구 수<input id="iBdN"></label><label>친구 수(비우면 자동)<input id="iFrN"></label></div>
  <label class="file">내 프로필 사진<input id="iMe" type="file" accept="image/*"></label>
  <label class="file">생일 친구 사진<input id="iBdImg" type="file" accept="image/*"></label>
  </div>
<div class="ps-pn" data-t="친구" hidden><h2 style="margin-top:14px">즐겨찾는 친구</h2><div id="elFav"></div><button class="ghost" data-add="favs" type="button">+ 즐겨찾기 추가</button>
  <h2 style="margin-top:14px">친구</h2><div id="elFr"></div><button class="ghost" data-add="fr" type="button">+ 친구 추가</button>
</div>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
