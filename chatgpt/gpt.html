<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT 화면 편집기</title>
<link rel="stylesheet" href="gpt.css?v=2">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><style id="ed-back">.ed-back{position:fixed;top:10px;left:10px;z-index:99999;display:flex;align-items:center;gap:2px;height:34px;padding:0 13px 0 9px;border-radius:17px;background:rgba(20,20,24,.55);color:#fff;font-weight:600;font-size:14px;text-decoration:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 8px rgba(0,0,0,.25)}</style></head>
<body>
<main class="wrap">
  <section class="stage"><div id="capture" class="phone"></div></section>
  <section class="editor">
    <h2>대화</h2>
    <div id="list"></div>
    <button id="addUser" class="ghost" type="button">+ 내 말풍선</button>
    <button id="addBot" class="ghost" type="button" style="margin-top:10px">+ 답변</button>
    <h2>화면 옵션</h2>
    <div class="card">
      <label>입력창 글자<input id="placeholder" type="text"></label>
      <label>오른쪽 버튼<select id="sendMode"><option value="wave">음성(파형)</option><option value="send">전송(화살표)</option></select></label>
      <div class="switches">
        <label class="sw"><input id="showHeader" type="checkbox"><span class="knob"></span>상단 버튼</label>
        <label class="sw"><input id="showInput" type="checkbox"><span class="knob"></span>입력창</label>
      </div>
    </div>
  </section>
</main>
<div class="bar">
  <button id="save" class="primary" type="button">PNG로 저장</button>
  <button id="reset" class="ghost" type="button">초기화</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="gpt.js?v=2"></script>
<a class="ed-back" href="../index.html" onclick="if(history.length>1){history.back();return false}">&#8249; 뒤로</a></body>
</html>
