<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT 화면 편집기</title>
<link rel="stylesheet" href="gpt.css?v=2">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><style id="ed-back">.ed-back{position:fixed;top:0;left:0;right:0;z-index:99999;height:44px;display:flex;align-items:center;padding:0 16px;background:rgba(255,255,255,.92);border-bottom:1px solid #e5e5e5;color:#0095f6;font-weight:600;font-size:15px;text-decoration:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}</style><link rel="stylesheet" href="studio.css?v=2">
<link rel="stylesheet" href="../ps-editor.css?v=5"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>GPT 화면</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<main class="wrap">
  <section class="stage"><div id="capture" class="phone"></div></section>
  
</main>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>GPT 화면 내용 수정</h2><div class="ps-edwrap"><section class="editor">
<div class="ps-pn" data-t="기본">
    <h2>대화</h2>
    <div id="list"></div>
    <button id="addUser" class="ghost" type="button">+ 내 말풍선</button>
    <button id="addBot" class="ghost" type="button" style="margin-top:10px">+ 답변</button>
    <h2>화면 옵션</h2>
    <div class="card">
      <label>입력창 글자<input id="placeholder" type="text"></label>
      <label>오른쪽 버튼<select id="sendMode"><option value="wave">음성(파형)</option><option value="send">전송(화살표)</option></select></label>
      <div class="switches">
        <label class="sw"><input id="showHeader" type="checkbox"><span class="knob"></span>상단 버튼</label>
        <label class="sw"><input id="showInput" type="checkbox"><span class="knob"></span>입력창</label>
      </div>
    </div>
  
</div></section></div><div class="ps-acts">
  <button id="save" class="primary" type="button">PNG 저장</button>
  <button id="reset" class="ghost" type="button">초기화</button>
</div></section>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="gpt.js?v=2"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
