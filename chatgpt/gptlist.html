<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT 목록 편집기</title>
<link rel="stylesheet" href="gptlist.css">
</head>
<body>
<main class="wrap">
  <section class="stage"><div id="capture" class="phone"></div></section>
  <section class="editor">
    <h2>상단</h2>
    <div class="card">
      <label>제목<input id="title" type="text"></label>
      <div class="switches">
        <label class="sw"><input id="showSearch" type="checkbox"><span class="knob"></span>검색 버튼</label>
      </div>
    </div>

    <h2>메뉴</h2>
    <div id="menuList"></div>
    <button id="addMenu" class="ghost" type="button">+ 메뉴 추가</button>

    <h2>대화 목록</h2>
    <div id="chatList"></div>
    <button id="addChat" class="ghost" type="button">+ 대화 추가</button>

    <h2>하단 · 옆 화면</h2>
    <div class="card">
      <div class="grid2">
        <label>버튼 글자<input id="btn" type="text"></label>
        <label>프로필 글자<input id="initials" type="text"></label>
      </div>
      <label>프로필 색<input id="color" type="color" value="#e6c238"></label>
      <div class="switches">
        <label class="sw"><input id="showBottom" type="checkbox"><span class="knob"></span>하단 버튼·프로필</label>
        <label class="sw"><input id="showPeek" type="checkbox"><span class="knob"></span>오른쪽에 밀려난 화면</label>
      </div>
    </div>
  </section>
</main>
<div class="bar">
  <button id="save" class="primary" type="button">PNG로 저장</button>
  <button id="reset" class="ghost" type="button">초기화</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="gptlist.js"></script>
</body>
</html>
