<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>홈 화면</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#111;font-family:-apple-system,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select{font-size:16px!important;-webkit-user-select:auto;user-select:auto}
.phone{position:relative;max-width:430px;margin:0 auto;min-height:100dvh;overflow:hidden;color:#fff;
 background:radial-gradient(120% 60% at 15% 12%,#3f86d6 0,transparent 60%),radial-gradient(90% 50% at 90% 40%,#1d5fc4 0,transparent 65%),radial-gradient(110% 60% at 20% 62%,#5fb5a8 0,transparent 60%),radial-gradient(100% 55% at 85% 88%,#f0a35a 0,transparent 62%),radial-gradient(90% 50% at 25% 95%,#e8d36a 0,transparent 60%),linear-gradient(180deg,#2f78c8,#4aa0a6 55%,#c9b46a);background-size:cover;background-position:center}
/* ===== Liquid Glass ===== */
.glass{position:relative;isolation:isolate;
 background:radial-gradient(circle at var(--mx,28%) var(--my,0%),rgba(255,255,255,.42),rgba(255,255,255,0) 58%),linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.05) 55%,rgba(255,255,255,.14));
 -webkit-backdrop-filter:blur(14px) saturate(190%) brightness(1.1) contrast(.95);backdrop-filter:blur(14px) saturate(190%) brightness(1.1) contrast(.95);
 box-shadow:inset 0 1.5px 1px rgba(255,255,255,.75),inset 0 -1.5px 2px rgba(255,255,255,.3),inset 1.5px 0 2px rgba(255,255,255,.3),inset -1.5px 0 2px rgba(255,255,255,.2),inset 0 0 16px rgba(255,255,255,.14),0 10px 28px rgba(0,30,60,.22),0 2px 6px rgba(0,0,0,.12);
 transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:2;
 background:conic-gradient(from 200deg,rgba(255,255,255,.95),rgba(255,255,255,.05) 22%,rgba(255,255,255,.55) 48%,rgba(255,255,255,.05) 72%,rgba(255,255,255,.95));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass::after{content:"";position:absolute;left:8%;right:8%;top:2px;height:38%;border-radius:inherit;pointer-events:none;z-index:1;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0))}
.glass:active{transform:scale(.95)}
/* ===== 상태바 ===== */
.sb{position:absolute;top:0;left:0;right:0;height:60px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 40px;font-weight:600;font-size:17px;z-index:5}
.isl{position:absolute;left:50%;top:11px;width:122px;height:36px;margin-left:-61px;border-radius:20px;background:#000}
.sb .r{display:flex;gap:6px;align-items:center}
.bat{width:27px;height:13px;border-radius:4px;background:#5fd16b;position:relative;color:#000;font-size:10px;font-weight:700;text-align:center;line-height:13px}
.bat::after{content:"";position:absolute;right:-3px;top:4px;width:2px;height:5px;border-radius:0 2px 2px 0;background:rgba(255,255,255,.5)}
/* ===== 그리드 ===== */
.grid{padding:82px 27px 230px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px 27px}
.cell{display:flex;flex-direction:column;align-items:center;min-width:0}
.ico{position:relative;width:100%;aspect-ratio:1}
.ic{width:100%;height:100%;border-radius:22.5%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;position:relative;box-shadow:0 4px 10px rgba(0,30,60,.25),inset 0 0 0 .5px rgba(255,255,255,.45)}
.ic img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ic::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,0) 42%);pointer-events:none}
.fd{width:100%;height:100%;border-radius:22.5%;padding:12%;display:grid;grid-template-columns:repeat(3,1fr);gap:6%;align-content:start}
.fd .ic{border-radius:23%;font-size:0;box-shadow:none}
.bd{position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:#ff3b30;color:#fff;font-size:16px;font-weight:500;line-height:26px;text-align:center;z-index:4;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.lb{margin-top:6px;font-size:13px;line-height:16px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.35);letter-spacing:-.01em}
.search{position:absolute;left:50%;bottom:122px;transform:translateX(-50%);height:34px;padding:0 16px;border-radius:17px;display:flex;align-items:center;gap:6px;font-size:14px;color:rgba(255,255,255,.95);white-space:nowrap}
.search:active{transform:translateX(-50%) scale(.95)}
.dock{position:absolute;left:13px;right:13px;bottom:22px;height:92px;border-radius:46px;padding:14px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.dock .ico{width:100%}
.hi{position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#000;opacity:.9;z-index:5}
/* ===== 편집 패널 ===== */
.panel{max-width:430px;margin:0 auto;padding:20px 16px 60px;background:#f5f5f7;color:#111}
.panel h2{font-size:16px;margin:22px 0 10px}.panel h2:first-child{margin-top:0}
.panel label{display:block;font-size:13px;font-weight:600;margin-bottom:10px}
.panel input:not([type=file]),.panel select{display:block;width:100%;height:42px;margin-top:5px;padding:8px 10px;border:1px solid #d8d8dc;border-radius:10px;background:#fff}
.panel input[type=file]{display:block;margin-top:5px;font-size:13px;max-width:100%}
.panel button{height:42px;padding:0 16px;border:0;border-radius:10px;background:#222;color:#fff;font:inherit;font-weight:700}
.panel button.g{background:#e4e4e7;color:#222}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.it{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #e3e3e6;font-size:14px}
.it.k{padding-left:22px}.it b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it button{height:32px;padding:0 10px;font-size:12px}.it .f{position:relative;overflow:hidden}.it .f input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;padding:0}
.f{display:inline-flex;align-items:center;height:32px;padding:0 10px;border-radius:10px;background:#e4e4e7;font-size:12px;font-weight:700}
</style></head><body>
<div class="phone" id="phone">
 <div class="sb"><span id="clock"></span><div class="isl"></div><span class="r"><svg width="20" height="14" viewBox="0 0 20 14" fill="#fff"><path d="M10 3c2.6 0 5 1 6.800 2.700l1.400-1.500A12 12 0 0010 1 12 12 0 001.800 4.200l1.400 1.500A9.800 9.800 0 0110 3zm0 4c1.600 0 3 .6 4.100 1.600l1.400-1.500A8.200 8.200 0 0010 5a8.200 8.200 0 00-5.500 2.100l1.400 1.500C7 7.600 8.400 7 10 7zm0 4a3 3 0 012 .8L10 14l-2-2.200A3 3 0 0110 11z"/></svg><span class="bat">54</span></span></div>
 <div class="grid" id="grid"></div>
 <div class="search glass"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>검색</div>
 <div class="dock glass" id="dock"></div><div class="hi"></div>
</div>
<section class="panel">
 <h2>배경 / 시간</h2>
 <label>배경 사진<input id="wall" type="file" accept="image/*"></label>
 <div class="row"><label>시간 (비우면 현재 시간)<input id="timeIn" placeholder="5:01"></label><button class="g" id="wallReset" style="align-self:end;margin-bottom:10px">기본 배경</button></div>
 <h2>앱 추가</h2>
 <label>앱 이름<input id="aName"></label>
 <label>앱 아이콘 사진<input id="aIcon" type="file" accept="image/*"></label>
 <div class="row"><label>배지 숫자 (0=없음)<input id="aBadge" type="number" inputmode="numeric" value="0"></label><label>위치<select id="aWhere"></select></label></div>
 <button id="addApp">앱 추가</button>
 <h2>폴더 추가</h2>
 <div class="row"><label>폴더 이름<input id="fName"></label><label>배지<input id="fBadge" type="number" inputmode="numeric" value="0"></label></div>
 <button id="addFolder">폴더 추가</button>
 <h2>목록 (아이콘 변경 / 삭제)</h2><div id="list"></div>
</section>
<script>
(function(){
var $=function(s){return document.querySelector(s)},KEY='editsoceur-homescreen-v1';
var A=function(n,c,i,b){return{name:n,color:c,icon:i||'',badge:b||0}};
var F=function(n,b,cs){return{name:n,badge:b,kids:cs.map(function(c,i){return{name:'앱'+(i+1),color:c,icon:'',badge:0}})}};
var N='../notifications/images/';
var DEF={wall:'',time:'',home:[
F('소셜 미디어',653,['#34c759','#8e8e93','#ff5a5f','#111','#fff']),F('엔터테인먼트',1,['#2fb36b','#e60023','#fff','#10a37f','#111','#4285f4','#e8d9c5','#ddd','#d98a5a']),F('게임',0,['#111','#f1c40f','#3b82f6']),F('비디오 및 사진',7,['#ff0000','#e11','#6c5ce7','#000','#111','#000','#8a2be2']),
F('금융',73,['#ffe812','#ffcc00','#222','#14c36a','#0064ff']),F('교육',1,['#3aa0ff','#888','#5ac8fa','#78c850','#aaa']),F('라이프스타일',7,['#007aff','#ff375f','#34c759','#fff','#5ac8fa','#ff9f0a','#e5484d','#c7a2ff','#fff']),F('쇼핑',28,['#111','#a78bfa','#ff6b00','#4fd1c5','#111','#ff9f0a','#14c8c0','#ef4444','#6366f1']),
A('X','#000',N+'twitter/sl_z_072523_61700_01.jpg'),A('Instagram','#e1306c',N+'instagram/Instagram_logo_2016.svg',2),A('Safari','#fff'),A('사진','#fff'),
A('토스','#0064ff'),A('설정','#8e8e93','',2),A('메모','#fffbe6'),A('NAVER','#03c75a',N+'naver/IMG_0673.png',20),A('시계','#fff')],
dock:[A('카메라','#9a9aa0'),A('전화','#34c759',N+'call/phone.svg',6),A('음악','#fff'),A('카카오톡','#fee500',N+'kakao/KakaoTalk_logo.svg',347)]};
var S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.home)S=JSON.parse(JSON.stringify(DEF));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function light(h){h=h||'#fff';if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];var n=parseInt(h.slice(1),16);return((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000>150}
function tile(a){var d=document.createElement('div');d.className='ic';
 if(a.icon){var i=new Image();i.src=a.icon;i.draggable=false;d.appendChild(i)}else{d.style.background=a.color||'#999';d.style.color=light(a.color)?'#222':'#fff';d.textContent=(a.name||'?').charAt(0)}return d}
function badge(n){if(!n)return null;var b=document.createElement('span');b.className='bd';b.textContent=n;return b}
function cell(a,dock){var c=document.createElement('div');c.className='cell';var w=document.createElement('div');w.className='ico';
 if(a.kids){var f=document.createElement('div');f.className='fd glass';a.kids.slice(0,9).forEach(function(k){f.appendChild(tile(k))});w.appendChild(f)}else w.appendChild(tile(a));
 var b=badge(a.badge);if(b)w.appendChild(b);c.appendChild(w);
 if(!dock){var l=document.createElement('div');l.className='lb';l.textContent=a.name;c.appendChild(l)}return c}
function pickImg(file,max,type,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var cv=document.createElement('canvas'),x=cv.getContext('2d');
 if(type==='ic'){cv.width=cv.height=max;var s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,max,max);cb(cv.toDataURL('image/png'))}
 else{var k=Math.min(1,max/Math.max(im.width,im.height));cv.width=im.width*k;cv.height=im.height*k;x.drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.85))}};im.src=r.result};r.readAsDataURL(file)}
function render(){
 var g=$('#grid'),d=$('#dock');g.innerHTML='';d.innerHTML='';
 S.home.forEach(function(a){g.appendChild(cell(a))});S.dock.forEach(function(a){d.appendChild(cell(a,1))});
 $('#phone').style.backgroundImage=S.wall?'url('+S.wall+')':'';
 var t=S.time;if(!t){var n=new Date(),h=n.getHours()%12||12;t=h+':'+('0'+n.getMinutes()).slice(-2)}$('#clock').textContent=t;
 var w=$('#aWhere'),v=w.value;w.innerHTML='<option value="h">홈 화면</option><option value="d">독</option>';
 S.home.forEach(function(a,i){if(a.kids){var o=document.createElement('option');o.value='f'+i;o.textContent='폴더: '+a.name;w.appendChild(o)}});if(v)w.value=v;
 var L=$('#list');L.innerHTML='';
 function row(a,arr,i,k){var r=document.createElement('div');r.className='it'+(k?' k':'');var b=document.createElement('b');b.textContent=a.name;r.appendChild(b);
  if(!a.kids){var f=document.createElement('label');f.className='f';f.textContent='아이콘 변경';var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=function(){if(this.files[0])pickImg(this.files[0],160,'ic',function(u){a.icon=u;save();render()})};f.appendChild(inp);r.appendChild(f)}
  var x=document.createElement('button');x.textContent='삭제';x.onclick=function(){arr.splice(i,1);save();render()};r.appendChild(x);L.appendChild(r);
  if(a.kids)a.kids.forEach(function(kk,j){row(kk,a.kids,j,1)})}
 S.home.forEach(function(a,i){row(a,S.home,i)});S.dock.forEach(function(a,i){row(a,S.dock,i)})}
$('#wall').onchange=function(){if(this.files[0])pickImg(this.files[0],1200,'wall',function(u){S.wall=u;save();render()})};
$('#wallReset').onclick=function(){S.wall='';save();render()};
$('#timeIn').value=S.time||'';$('#timeIn').oninput=function(){S.time=this.value;save();render()};
$('#addApp').onclick=function(){var n=$('#aName').value.trim();if(!n){alert('앱 이름을 입력하세요');return}
 var f=$('#aIcon').files[0],b=+$('#aBadge').value||0,w=$('#aWhere').value;
 function done(u){var a={name:n,color:'#8e8e93',icon:u||'',badge:b};
  if(w==='d'){if(S.dock.length>=4){alert('독에는 4개까지 넣을 수 있어요');return}S.dock.push(a)}else if(w[0]==='f')S.home[+w.slice(1)].kids.push(a);else S.home.push(a);
  $('#aName').value='';$('#aIcon').value='';$('#aBadge').value=0;save();render()}
 f?pickImg(f,160,'ic',done):done('')};
$('#addFolder').onclick=function(){var n=$('#fName').value.trim();if(!n){alert('폴더 이름을 입력하세요');return}
 S.home.push({name:n,badge:+$('#fBadge').value||0,kids:[]});$('#fName').value='';save();render()};
function glow(e){var g=e.target.closest&&e.target.closest('.glass');if(!g)return;var r=g.getBoundingClientRect();g.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');g.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%')}
document.addEventListener('pointermove',glow);document.addEventListener('pointerdown',glow);
render();
})();
</script></body></html>
