<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;max-width:100%;overflow-x:hidden;margin:0;background:#f6f6f6;font-family:-apple-system,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select{font-size:16px!important;-webkit-user-select:auto;user-select:auto}
.phone{position:relative;width:100%;margin:0;aspect-ratio:9/16;overflow:hidden;color:#fff;
 background:radial-gradient(120% 60% at 15% 12%,#3f86d6 0,transparent 60%),radial-gradient(90% 50% at 90% 40%,#1d5fc4 0,transparent 65%),radial-gradient(110% 60% at 20% 62%,#5fb5a8 0,transparent 60%),radial-gradient(100% 55% at 85% 88%,#f0a35a 0,transparent 62%),radial-gradient(90% 50% at 25% 95%,#e8d36a 0,transparent 60%),linear-gradient(180deg,#2f78c8,#4aa0a6 55%,#c9b46a);background-size:cover;background-position:center}
@media(min-width:700px){.phone{max-width:430px;margin:0 auto}}
/* ===== Liquid Glass ===== */
.glass{position:relative;isolation:isolate;
 background:radial-gradient(circle at var(--mx,28%) var(--my,0%),rgba(255,255,255,.42),rgba(255,255,255,0) 58%),linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.05) 55%,rgba(255,255,255,.14));
 -webkit-backdrop-filter:blur(14px) saturate(190%) brightness(1.1) contrast(.95);backdrop-filter:blur(14px) saturate(190%) brightness(1.1) contrast(.95);
 box-shadow:inset 0 1.5px 1px rgba(255,255,255,.75),inset 0 -1.5px 2px rgba(255,255,255,.3),inset 1.5px 0 2px rgba(255,255,255,.3),inset -1.5px 0 2px rgba(255,255,255,.2),inset 0 0 16px rgba(255,255,255,.14),0 10px 28px rgba(0,30,60,.22),0 2px 6px rgba(0,0,0,.12);
 transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.fd.glass::before,.fd.glass::after{display:none}
.fd.glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.2)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:2;
 background:conic-gradient(from 200deg,rgba(255,255,255,.95),rgba(255,255,255,.05) 22%,rgba(255,255,255,.55) 48%,rgba(255,255,255,.05) 72%,rgba(255,255,255,.95));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass::after{content:"";position:absolute;left:8%;right:8%;top:2px;height:38%;border-radius:inherit;pointer-events:none;z-index:1;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0))}
.glass:active{transform:scale(.95)}
/* ===== 그리드 ===== */
.grid{padding:22px 27px 230px;display:grid;grid-template-columns:repeat(4,80px);justify-content:space-between;gap:12px 0}
.cell{display:flex;flex-direction:column;align-items:center;min-width:0}
.ico{position:relative;width:64px;height:64px;flex:none}
.ic{width:100%;height:100%;border-radius:22.5%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;position:relative;box-shadow:0 4px 10px rgba(0,30,60,.25),inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -8px 14px rgba(255,255,255,.12)}
.ic img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ic::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,.08) 40%,rgba(255,255,255,.04) 62%,rgba(255,255,255,.2));backdrop-filter:blur(1.5px) saturate(140%);-webkit-backdrop-filter:blur(1.5px) saturate(140%);pointer-events:none}
.fd{width:100%;height:100%;border-radius:22.5%;padding:12%;display:grid;grid-template-columns:repeat(3,1fr);gap:6%;align-content:start}
.fd .ic{border-radius:23%;font-size:0;box-shadow:none}
.bd{position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:#ff3b30;color:#fff;font-size:16px;font-weight:500;line-height:26px;text-align:center;z-index:4;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.lb{margin-top:6px;font-size:13px;line-height:16px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.35);letter-spacing:-.01em}
.bottom{position:absolute;left:0;right:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:18px}
.dock{width:calc(100% - 26px);border-radius:30px;padding:21px 14px;display:flex;justify-content:center;gap:23px;align-items:center;min-height:105px}
.dock .cell{width:64px;flex:none}
.dock .cell{min-width:0}
/* ===== 편집 패널 (인스타그램 편집창 스타일) ===== */
.editor{max-width:430px;margin:0 auto;padding:20px 16px 110px;background:#f6f6f6;color:#262626;font-size:14px}
.trow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;margin-bottom:12px;border-bottom:1px solid #e5e5e5;font-size:14px;font-weight:600}
.sw{position:relative;display:inline-block;width:51px;height:31px;margin:0}.sw input{position:absolute;inset:0;opacity:0;margin:0;z-index:2;cursor:pointer;width:100%;height:100%}.sw i{position:absolute;inset:0;border-radius:31px;background:#e9e9ea;transition:.2s}.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}.sw input:checked+i{background:#34c759}.sw input:checked+i::after{left:22px}
.editor h2{font-size:17px;margin:26px 0 14px}.editor h2:first-child{margin-top:0}
.editor label{display:block;font-weight:600;margin-bottom:12px;font-size:13px}
.editor input:not([type=checkbox]),.editor select{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid #dbdbdb;border-radius:10px;background:#fff;font:inherit;font-weight:400;height:auto}
.editor input[type=file]{padding:8px;font-size:12px}
.editor .row{display:flex;gap:10px}.editor .row label{flex:1;min-width:0}
.hint{font-size:12px;color:#8e8e8e;margin:-6px 0 12px}
.mini{height:36px;padding:0 14px;border:0;border-radius:10px;background:#efefef;font:inherit;font-weight:600;font-size:13px;color:#262626}
.add{width:100%;height:46px;border:0;border-radius:12px;background:#0095f6;color:#fff;font:inherit;font-weight:700;font-size:15px}
.it{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:8px;background:#fff;border:1px solid #dbdbdb;border-radius:12px;font-size:14px}
.it.k{margin-left:26px;background:#fafafa}.it b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .th{width:36px;height:36px;flex:none}.it .th .ic{font-size:15px;box-shadow:none}
.it input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:#0095f6;margin:0}
.it .mini{height:32px;padding:0 10px;font-size:12px}.it .f{position:relative;overflow:hidden;display:inline-flex;align-items:center;height:32px;padding:0 10px;margin:0;border-radius:10px;background:#efefef;font-size:12px;font-weight:600}
.it .f input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;padding:0}
.gbox{padding:14px;background:#fff;border:1px solid #dbdbdb;border-radius:12px;margin-top:14px}.gbox label{margin-bottom:10px}
.add:disabled{background:#b2dffc}
.bar{position:fixed;left:0;right:0;margin:0 auto;bottom:0;width:100%;max-width:430px;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #dbdbdb;z-index:10}
.bar button{flex:1;height:48px;border:0;border-radius:12px;font:inherit;font-weight:700;font-size:16px}
.bar .primary{background:#0095f6;color:#fff;flex:2}.bar .secondary{background:#efefef;color:#262626}
.dock.glass{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03));-webkit-backdrop-filter:blur(6px) saturate(160%);backdrop-filter:blur(6px) saturate(160%)}
.dock.glass::after{opacity:.35}
.divd{width:100%;max-width:430px;margin:0 auto;height:14px;background:#e3e3e8;border-top:1px solid #cfcfd4;border-bottom:1px solid #cfcfd4;box-shadow:inset 0 3px 4px -2px rgba(0,0,0,.12)}
.edf{margin:-4px 0 10px;padding:14px;background:#fff;border:1px solid #dbdbdb;border-radius:12px}
.edf .row{display:flex;gap:10px;align-items:flex-end}.edf .row>*{flex:1;min-width:0}
.edf .mini{height:42px}.edf .add{height:42px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
var sel=[],editing=null;var $=function(s){return document.querySelector(s)},KEY='editsoceur-homescreen-v2';
var A=function(n,c,i,b){return{name:n,color:c,icon:i||'',badge:b||0}};
var F=function(n,b,cs){return{name:n,badge:b,kids:cs.map(function(c,i){return{name:'앱'+(i+1),color:c,icon:'',badge:0}})}};
var N='../notifications/images/';
var DEF={wall:'',time:'',home:[A('Instagram','#e1306c',N+'instagram/Instagram_logo_2016.svg',2),A('X','#000',N+'twitter/sl_z_072523_61700_01.jpg'),A('NAVER','#03c75a',N+'naver/IMG_0673.png',20)],
dock:[A('전화','#34c759',N+'call/phone.svg',6),A('카카오톡','#fee500',N+'kakao/KakaoTalk_logo.svg',347)]};
var S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.home)S=JSON.parse(JSON.stringify(DEF));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function light(h){h=h||'#fff';if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];var n=parseInt(h.slice(1),16);return((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000>150}
function tile(a){var d=document.createElement('div');d.className='ic';
 if(a.icon){var i=new Image();i.src=a.icon;i.draggable=false;d.appendChild(i)}else{d.style.background=a.color||'#999';d.style.color=light(a.color)?'#222':'#fff';d.textContent=(a.name||'?').charAt(0)}return d}
function badge(n){if(!n)return null;var b=document.createElement('span');b.className='bd';b.textContent=n;return b}
function cell(a,dock){var c=document.createElement('div');c.className='cell';var w=document.createElement('div');w.className='ico';
 if(a.kids){var f=document.createElement('div');f.className='fd glass';a.kids.slice(0,9).forEach(function(k){f.appendChild(tile(k))});w.appendChild(f)}else w.appendChild(tile(a));
 var b=badge(a.badge);if(b)w.appendChild(b);c.appendChild(w);

function pickImg(file,max,type,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var cv=document.createElement('canvas'),x=cv.getContext('2d');
 if(type==='ic'){cv.width=cv.height=max;var s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,max,max);cb(cv.toDataURL('image/png'))}
 else{var k=Math.min(1,max/Math.max(im.width,im.height));cv.width=im.width*k;cv.height=im.height*k;x.drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.95))}};im.src=r.result};r.readAsDataURL(file)}
function setWall(){var ph=$('#phone');if(ph.dataset.w===S.wall)return;ph.dataset.w=S.wall;ph.style.backgroundImage=S.wall?'url('+S.wall+')':''}
function render(){
 var g=$('#grid'),d=$('#dock');g.innerHTML='';d.innerHTML='';
 S.home.forEach(function(a){g.appendChild(cell(a))});S.dock.forEach(function(a){d.appendChild(cell(a,1))});

 var w=$('#aWhere'),v=w.value;w.innerHTML='<option value="h">홈 화면</option><option value="d">독</option>';

 var L=$('#list');L.innerHTML='';
 sel=sel.filter(function(a){return S.home.indexOf(a)>-1||S.dock.indexOf(a)>-1});

  var th=document.createElement('span');th.className='th';th.appendChild(tile(a.kids?{name:'폴더',color:'#6aa9e8'}:a));r.appendChild(th);

  var ed=document.createElement('button');ed.className='mini';ed.textContent='수정';ed.onclick=function(){editing=editing===a?null:a;render()};r.appendChild(ed);
  var x=document.createElement('button');x.className='mini';x.textContent='삭제';x.onclick=function(){if(arr===S.dock&&S.dock.length<=1){alert('독에는 최소 1개가 필요해요');return}arr.splice(arr.indexOf(a),1);save();render()};r.appendChild(x);L.appendChild(r);if(editing===a)L.appendChild(editForm(a));
  if(a.kids)a.kids.forEach(function(kk,j){row(kk,a.kids,j,1)})}
 S.home.forEach(function(a,i){row(a,S.home,i)});S.dock.forEach(function(a,i){row(a,S.dock,i)});gbtn()}
function locate(a){var zs=['home','dock'];for(var z=0;z<2;z++){var arr=S[zs[z]];if(arr.indexOf(a)>-1)return{z:zs[z],f:null};for(var i=0;i<arr.length;i++)if(arr[i].kids&&arr[i].kids.indexOf(a)>-1)return{z:zs[z],f:arr[i]}}return{z:'home',f:null}}
function editForm(a){var f=document.createElement('div');f.className='edf';
 var L=locate(a),cur=L.f?'f'+S[L.z].indexOf(L.f):(L.z==='dock'?'d':'h');
 f.innerHTML='<label>이름<input id="eN"></label><div class="row"><label>배지 숫자 (0=없음)<input id="eB" type="number" inputmode="numeric"></label>'+(a.kids?'':'<div class="upl"><div class="upl-th"><img alt=""><span>없음</span></div><div class="upl-body"><span class="upl-label">아이콘 사진</span><b class="upl-name">선택된 파일 없음</b><label class="upl-btn">변경<input id="eI" type="file" accept="image/*"></label></div></div>')+'</div>'+(a.kids?'':'<label>위치<select id="eW"></select></label>')+'<div class="row"><button class="mini" id="eC" type="button">닫기</button><button class="add" id="eS" type="button">저장</button></div>';
 f.querySelector('#eN').value=a.name;f.querySelector('#eB').value=a.badge||0;
 var fi=f.querySelector('#eI');if(fi)fi.onchange=function(){if(this.files[0])pickImg(this.files[0],160,'ic',function(u){a.icon=u;save();render()})};

   var tz=nw==='d'?'dock':nw==='h'?'home':L.z,tf=nw[0]==='f'?S[L.z][+nw.slice(1)]:null;
