<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>알림</title>
<link rel="stylesheet" href="notify.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><style id="ed-back">.ed-back{position:fixed;top:10px;left:10px;z-index:99999;display:flex;align-items:center;gap:2px;height:34px;padding:0 13px 0 9px;border-radius:17px;background:rgba(20,20,24,.55);color:#fff;font-weight:600;font-size:14px;text-decoration:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 8px rgba(0,0,0,.25)}</style></head>
<body>
<main class="wrap">
  <section class="preview"><div class="stage" id="stage"></div></section>
  <nav class="picker" id="picker"></nav>
  <section class="editor">
    <h2>아이콘</h2>
    <label>아이콘 종류<select id="iconStyle"><option value="normal">기본 (앱 아이콘만)</option><option value="small">작은 아이콘 (프사 + 앱 아이콘)</option></select></label>
    <label>앱 아이콘 직접 넣기<input id="appImgFile" type="file" accept="image/*"></label>
    <button id="appImgClear" type="button" class="sub">기본 앱 아이콘으로 되돌리기</button>
    <label id="avatarRow" style="display:none">프사 넣기<input id="avatarFile" type="file" accept="image/*"></label>
    <h2>알림 편집</h2>
    <label>앱 이름<input id="appName"></label>
    <label>보낸 사람 / 제목<input id="title"></label>
    <label>알림 내용<input id="bodyText"></label>
    <label>시간<input id="timeText"></label>
    <h2>알림 카드 배경</h2>
    <div class="row"><label>배경 색상<input id="bgColor" type="color" value="#efefef"></label><label>투명도 <output id="opacityValue">96%</output><input id="opacity" type="range" min="0" max="100" value="96"></label></div>
    <div class="actions"><button id="savePng" type="button">PNG로 저장</button><button id="reset" type="button">초기화</button></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="notify.js"></script>
<a class="ed-back" href="../index.html" onclick="if(history.length>1){history.back();return false}">&#8249; 뒤로</a></body>
</html>
