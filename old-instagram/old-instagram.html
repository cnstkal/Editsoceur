<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고전 인스타</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="old-instagram.css?v=3">
<link rel="stylesheet" href="../ps-editor.css?v=10"><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html" style="color:#0095f6;font-weight:600;text-decoration:none">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">

<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>고전 인스타 뉴스바</h2>
<p class="ps-sub">9:16 투명 PNG · 오른쪽에서 바로 수정해요</p>
<div class="ps-stage" id="stage"><div class="fit" id="fit"><div class="fr">

<div id="cap"><div class="card" id="card">
  <div class="nb"><span class="tag" id="vTag"></span><span class="lv" id="vLive"><i></i>LIVE</span></div>
  <div class="hd"><b id="vUser"></b><span class="gear"><svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M19.400 13a7.500 7.500 0 0 0 0-2l2.100-1.600-2-3.500-2.500 1a7.600 7.600 0 0 0-1.700-1L15 3.200h-4L10.700 5.900a7.600 7.600 0 0 0-1.700 1l-2.500-1-2 3.500L6.600 11a7.500 7.500 0 0 0 0 2l-2.100 1.600 2 3.500 2.500-1c.5.400 1.100.7 1.700 1l.3 2.700h4l.3-2.700c.6-.3 1.200-.6 1.700-1l2.500 1 2-3.500zM12 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"/></svg></span></div>
  <div class="pf">
    <div class="pt">
      <div class="pa"><i class="ph" id="vAv"></i></div>
      <div class="pr">
        <div class="st"><div><b id="vPh"></b><small>photos</small></div><div><b id="vFo"></b><small>followers</small></div><div><b id="vFg"></b><small>following</small></div></div>
        <div class="ep">Edit Your Profile<svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="#999" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="m1.500 1 5 5-5 5"/></svg></div>
      </div>
    </div>
    <div class="bio"><b id="vName"></b><span id="vBio"></span><a id="vLink"></a></div>
  </div>
  <div class="tbs">
    <div><svg width="16" height="16" viewBox="0 0 16 16" fill="#3d6fa0"><rect x="1" y="1" width="4" height="4"/><rect x="6" y="1" width="4" height="4"/><rect x="11" y="1" width="4" height="4"/><rect x="1" y="6" width="4" height="4"/><rect x="6" y="6" width="4" height="4"/><rect x="11" y="6" width="4" height="4"/><rect x="1" y="11" width="4" height="4"/><rect x="6" y="11" width="4" height="4"/><rect x="11" y="11" width="4" height="4"/></svg></div>
    <div><svg width="16" height="16" viewBox="0 0 16 16" fill="#a5a5a9"><rect x="1" y="2" width="14" height="3"/><rect x="1" y="6.500" width="14" height="3"/><rect x="1" y="11" width="14" height="3"/></svg></div>
    <div><svg width="14" height="16" viewBox="0 0 24 28" fill="#8e8e93"><path d="M12 0a9 9 0 0 0-9 9c0 7 9 19 9 19s9-12 9-19a9 9 0 0 0-9-9zm0 12.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"/></svg><span>Photo Map</span><svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="#999" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="m1.500 1 5 5-5 5"/></svg></div>
  </div>
  <div class="gd" id="vGrid"></div>
  <div class="nv">
    <div><svg width="16" height="16" viewBox="0 0 24 24" fill="#e6e6e8"><path d="M12 3 2 12h3v9h5v-6h4v6h5v-9h3z"/></svg></div>
    <div><svg width="16" height="16" viewBox="0 0 24 24" fill="#e6e6e8"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></svg></div>
    <div class="on"><svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm8 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg></div>
    <div><svg width="16" height="16" viewBox="0 0 24 24" fill="#e6e6e8"><path d="M12 3C6.500 3 2 6.600 2 11c0 2.300 1.200 4.300 3.200 5.800L4 21l4.600-2.200c1 .3 2.200.4 3.400.4 5.500 0 10-3.600 10-8.100S17.500 3 12 3z"/></svg></div>
    <div><svg width="16" height="16" viewBox="0 0 24 24" fill="#e6e6e8"><path d="M3 4h18v16H3zm3 3v4h5V7zm7 0v2h5V7zm0 4v2h5v-2zM6 15v2h12v-2z"/></svg></div>
  </div>
  <div class="tk"><span class="key" id="vKey"></span><p id="vTick"></p></div>
</div></div>

</div></div></div>
</section>

<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>고전 인스타 수정</h2>
<div class="ps-seg" id="seg"><button class="on" type="button">기본</button><button type="button">사진</button><button type="button">뉴스바</button></div>
<div class="editor">
  <div class="pn">
    <label>사용자 아이디<input id="iUser"></label>
    <label>게시물 수<input id="iPh"></label>
    <label>팔로워 수<input id="iFo"></label>
    <label>팔로잉 수<input id="iFg"></label>
    <label>이름<input id="iName"></label>
    <label>소개<input id="iBio"></label>
    <label>링크<input id="iLink"></label>
    <label>프로필 사진<input id="iAv" type="file" accept="image/*"></label>
  </div>
  <div class="pn" hidden>
    <label>게시물 사진 (여러 장)<input id="iPics" type="file" accept="image/*" multiple></label>
    <button class="ghost" id="clrPics" type="button">게시물 사진 비우기</button>
  </div>
  <div class="pn" hidden>
    <div class="tg"><span>뉴스바 표시</span><label class="sw"><input id="iBar" type="checkbox"><i></i></label></div>
    <label>상단 태그<input id="iTag"></label>
    <label>하단 라벨<input id="iKey"></label>
    <label>하단 자막<input id="iTick"></label>
    <div class="tg"><span>LIVE 표시</span><label class="sw"><input id="iLive" type="checkbox"><i></i></label></div>
  </div>
</div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div>
</section>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="old-instagram.js"></script>
</body>
</html>
