<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인스타 게시글</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="old-post.css?v=1">
<link rel="stylesheet" href="../ps-editor.css?v=10"><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>인스타 게시글</h2>
<p class="ps-sub">9:16 화면 · 오른쪽에서 바로 수정해요</p>
<div class="ps-stage" id="stage"><div class="fit" id="fit"><div class="oi" id="shot">
 <div class="hd"><div class="bk" id="vBack"></div><div class="hr"><span><svg viewBox="0 0 24 24"><path d="M3 13l3-8h12l3 8v7H3zm4 0v2h10v-2zM9 5v4h6V5z" fill-rule="evenodd"/></svg></span><span><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 7.500 10.500h-3A5.500 5.500 0 1 1 12 6.500c1.500 0 2.800.6 3.700 1.600L13 11h8V3l-2.800 2.800A8 8 0 0 0 12 4z"/></svg></span></div></div>
 <div class="us"><div class="av e" id="vAv"></div><span class="un" id="vUser"></span><span class="tm"><svg viewBox="0 0 24 24" fill="#9a9a9a"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v5l4 2-1 1.800-5-2.800V7z"/></svg><span id="vTime"></span></span></div>
 <div class="pic" id="vPic"></div>
 <div class="lk"><svg viewBox="0 0 24 24"><path d="M12 3C6.500 3 2 6.600 2 11c0 2.300 1.200 4.300 3.200 5.800L4 21l4.600-2.200c1 .3 2.200.4 3.400.4 5.500 0 10-3.600 10-8.100S17.500 3 12 3z"/></svg><svg viewBox="0 0 24 24"><path d="M12 21s-9-5.500-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.500-9 12-9 12z"/></svg><b id="vLike"></b></div>
 <div class="sq"><i></i><i></i></div>
 <div class="cm" id="vCm"></div>
 <div class="nv">
    <div><svg viewBox="0 0 24 24" fill="#e6e6e8"><path d="M12 3 2 12h3v9h5v-6h4v6h5v-9h3z"/></svg></div>
    <div><svg viewBox="0 0 24 24" fill="#e6e6e8"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></svg></div>
    <div><i></i></div>
    <div><svg viewBox="0 0 24 24" fill="#e6e6e8"><path d="M12 3C6.500 3 2 6.600 2 11c0 2.300 1.200 4.300 3.200 5.800L4 21l4.600-2.200c1 .3 2.200.4 3.400.4 5.500 0 10-3.600 10-8.100S17.500 3 12 3z"/></svg></div>
    <div><svg viewBox="0 0 24 24" fill="#e6e6e8"><path d="M3 4h18v16H3zm3 3v4h5V7zm7 0v2h5V7zm0 4v2h5v-2zM6 15v2h12v-2z"/></svg></div>
  </div>
</div></div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>인스타 게시글 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>왼쪽 상단 문구<input id="iBack"></label>
<label>사용자 아이디<input id="iUser"></label>
<label>게시 시간<input id="iTime"></label>
<label>좋아요 문구<input id="iLike"></label>
<label>댓글 (줄마다 아이디: 내용)<textarea id="iCm" rows="4"></textarea></label>
</div>
<div class="ps-pn" data-t="사진" hidden>
<label class="ps-addp">+ 프로필 사진<input class="ps-sr" id="iAv" type="file" accept="image/*"></label>
<label class="ps-addp">+ 게시물 사진<input class="ps-sr" id="iPic" type="file" accept="image/*"></label>
<button class="ps-ghost" id="clr" type="button">사진 비우기</button>
</div>
</div></div>
<div class="ps-acts"><button id="savePng" type="button">PNG 저장</button><button id="reset" type="button">초기화</button></div>
</section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="old-post.js?v=1"></script>
</body>
</html>
