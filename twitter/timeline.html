<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>X 타임라인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="timeline.css?v=3">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><link rel="stylesheet" href="back.css?v=1">
</head>
<body>
<div class="phone">
<div class="navbar" data-html2canvas-ignore><a href="index.html">‹ 선택화면</a></div>
<div id="xf">
  <div class="xh"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M18.244 2.250h3.308l-7.227 8.260 8.502 11.240H16.170l-5.214-6.817L4.990 21.750H1.680l7.730-8.835L1.254 2.250H8.080l4.713 6.231zm-1.161 17.520h1.833L7.084 4.126H5.117z"/></svg></div>
  <div class="xtb"><span class="xs"></span><span class="xtab" id="xT0"></span><span class="xtab" id="xT1"></span><span class="xplus"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f1419" stroke-width="2.200" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></span></div>
  <div class="xl" id="xL"></div>
  <div class="xfab"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></div>
  <div class="xnav">
    <div><span class="xi"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 2.500 2.500 10v10a1.500 1.500 0 0 0 1.500 1.500h5v-6.500h6v6.500h5a1.500 1.500 0 0 0 1.500-1.500V10z"/></svg></span></div>
    <div><span class="xi"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0f1419" stroke-width="2.400" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="7"/><path d="m21 21-5.500-5.500"/></svg></span></div>
    <div><span class="xi"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0f1419" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-5L16.500 3.500a2.500 2.500 0 0 1 3.500 3.500L8.500 18.500zM14 6l3.500 3.500M3 21l4-1"/></svg><u class="xbg" id="xBg"></u></span></div>
    <div><span class="xi"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0f1419" stroke-width="2.200" stroke-linejoin="round"><path d="M18 9a6 6 0 0 0-12 0c0 6-2.500 7.500-2.500 7.500h17S18 15 18 9zM10 20a2 2 0 0 0 4 0"/></svg></span></div>
    <div><span class="xi"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0f1419" stroke-width="2.200" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 4.500 16.800L21 21l-1.200-4.500A9 9 0 0 0 12 3z"/></svg></span></div>
  </div>
</div>
<section class="editor">
  <h2>타임라인 편집</h2>
  <div class="row"><label>왼쪽 탭 이름<input id="iT0"></label><label>오른쪽 탭 이름<input id="iT1"></label></div>
  <div class="row"><label>선택된 탭<select id="iAct"><option value="0">왼쪽 탭</option><option value="1">오른쪽 탭</option></select></label></div>
  <div class="musicbox"><div class="trow"><span>하단 메뉴 표시</span><label class="sw"><input id="iNav" type="checkbox"><i></i></label></div></div>
  <h2 style="margin-top:14px">트윗</h2>
  <div id="xlist"></div>
  <button class="ghost" id="addT" type="button">+ 트윗 추가</button>
</section>
</div>
<div class="bar"><button id="savePng" class="primary">PNG로 저장</button><button id="reset" class="secondary">초기화</button></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="timeline.js?v=3"></script>
<script src="back.js?v=1"></script>
<script src="common.js"></script>
</body>
</html>
