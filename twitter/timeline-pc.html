<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><script src="../nozoom.js?v=1"></script>
<title>X 타임라인 PC</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="timeline-pc.css?v=2">
<link rel="stylesheet" href="back.css?v=1">
<style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=4">
<style id="pc-mobile-lock">html,body{overflow-x:hidden;max-width:100vw}</style>
<link rel="stylesheet" href="../ps-editor.css?v=10"><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>X 타임라인 PC</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="pw" id="pw"><div id="pf">
  <div class="pl" id="pl"></div>
  <div class="pc">
    <div class="pt"><div id="pT0"></div><div id="pT1"></div><div class="pp" id="pPlus"></div></div>
    <div class="cp"><i class="pa" id="cpA" style="width:55px;height:55px"></i><span class="tx0" id="cpQ">무슨 일이 일어나고 있나요?</span><div class="ic" id="cpI"></div><span class="bt">게시하기</span></div>
    <div id="pL"></div>
  </div>
  <div class="pr">
    <div class="sb" id="pS"></div>
    <div class="bx" id="pTr"></div>
    <div class="bx"><h2>팔로우 추천</h2></div>
  </div>
  <div class="fl" style="top:686px" id="fl0"></div><div class="fl" style="top:778px" id="fl1"></div>
</div></div>


</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>X 타임라인 PC 내용 수정</h2><div class="ps-edwrap"><section class="editor">
  <div class="ps-pn" data-t="기본">
    <div class="row"><label>내 이름<input id="iMn"></label><label>내 아이디<input id="iMh"></label></div>
    <label class="file">프로필 사진<input type="file" accept="image/*" id="iMav"></label>
    <div class="musicbox"><div class="trow"><span>트윗 쓰기 버튼 표시 (모든 X 화면 공통)</span><label class="sw"><input id="iCompose" type="checkbox"><i></i></label></div><div class="trow"><span>선택된 탭</span><select id="iAct"><option value="0">추천</option><option value="1">팔로잉</option></select></div></div>
  </div>
  <div class="ps-pn" data-t="트윗" hidden>
    <button class="addc" id="addT" type="button">+ 트윗 추가</button>
    <div id="xlist"></div>
  </div>
  <div class="ps-pn" data-t="검색어" hidden>
    <label>작성창 안내 문구<input id="iQ"></label>
  </div>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="timeline-pc.js?v=1"></script>
<script src="back.js?v=1"></script>
<script src="common.js"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
