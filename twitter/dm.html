<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쪽지 편집기</title>
<link rel="stylesheet" href="dm.css">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style></head>
<body>
<main class="wrap">
  <section class="stage"><div id="capture" class="phone"></div></section>

  <section class="editor">
    <h2>상단</h2>
    <div class="card">
      <div class="grid2">
        <label>상대 이름<input id="name" type="text"></label>
        <label>프로필 사진<input id="avatarFile" type="file" accept="image/*"></label>
      </div>
      <div class="switches">
        <label class="sw"><input id="showCall" type="checkbox"><span class="knob"></span>전화·영상통화 아이콘</label>
      </div>
    </div>

    <h2>대화</h2>
    <div id="msgList"></div>
    <button id="addMe" class="ghost" type="button">+ 내 말풍선 (파랑)</button>
    <button id="addThem" class="ghost" type="button" style="margin-top:10px">+ 상대 말풍선 (회색)</button>
    <button id="addTime" class="ghost" type="button" style="margin-top:10px">+ 날짜·시간 줄</button>

    <h2>화면 옵션</h2>
    <div class="card">
      <div class="switches">
        <label class="sw"><input id="showRead" type="checkbox"><span class="knob"></span>읽음 표시</label>
      </div>
      <div class="grid2" style="margin-top:12px">
        <label>읽음 글자<input id="readText" type="text"></label>
        <label>입력창 글자<input id="placeholder" type="text"></label>
      </div>
      <div class="switches">
        <label class="sw"><input id="showInput" type="checkbox"><span class="knob"></span>입력창</label>
        <label class="sw"><input id="showNav" type="checkbox"><span class="knob"></span>하단 메뉴</label>
      </div>
    </div>
  </section>
</main>

<div class="bar">
  <button id="save" class="primary" type="button">PNG로 저장</button>
  <button id="reset" class="ghost" type="button">초기화</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="dm.js"></script>
</body>
</html>
