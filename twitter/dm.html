<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쪽지 편집기</title>
<link rel="stylesheet" href="dm.css">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><link rel="stylesheet" href="back.css?v=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=1">
</head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>X 쪽지</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<main class="wrap">
  <section class="stage"><div id="capture" class="phone"></div></section>

  
</main>



</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>쪽지 내용 수정</h2><div class="ps-edwrap"><section class="editor">
    <h2>상단</h2>
    <div class="card">
      <div class="grid2">
        <label>상대 이름<input id="name" type="text"></label>
        <label>프로필 사진<input id="avatarFile" type="file" accept="image/*"></label>
      </div>
      <div class="switches">
        <label class="sw"><input id="showCall" type="checkbox"><span class="knob"></span>전화·영상통화 아이콘</label>
      </div>
    </div>

    <h2>대화</h2>
    <div id="msgList"></div>
    <button id="addMe" class="ghost" type="button">+ 내 말풍선 (파랑)</button>
    <button id="addThem" class="ghost" type="button" style="margin-top:10px">+ 상대 말풍선 (회색)</button>
    <button id="addTime" class="ghost" type="button" style="margin-top:10px">+ 날짜·시간 줄</button>

    <h2>화면 옵션</h2>
    <div class="card">
      <div class="switches">
        <label class="sw"><input id="showRead" type="checkbox"><span class="knob"></span>읽음 표시</label>
      </div>
      <div class="grid2" style="margin-top:12px">
        <label>읽음 글자<input id="readText" type="text"></label>
        <label>입력창 글자<input id="placeholder" type="text"></label>
      </div>
      <div class="switches">
        <label class="sw"><input id="showInput" type="checkbox"><span class="knob"></span>입력창</label>
        
      </div>
    </div>
  </section></div><div class="ps-acts">
  <button id="save" class="primary" type="button">PNG로 저장</button>
  <button id="reset" class="ghost" type="button">초기화</button>
</div></section>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="dm.js"></script>
<script src="common.js"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
</body>
</html>
