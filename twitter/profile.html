<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로필 편집기</title>
<link rel="stylesheet" href="profile.css">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><link rel="stylesheet" href="back.css?v=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style></head>
<body>
<main class="wrap">
  <section class="stage"><div id="capture" class="phone"></div></section>

  <section class="editor">
    <h2>프로필 편집</h2>
    <div class="grid2">
      <label>이름<input id="name" type="text"></label>
      <label>아이디<input id="handle" type="text"></label>
    </div>
    <label>소개글<input id="bio" type="text"></label>
    <div class="grid2">
      <label>직업<input id="job" type="text"></label>
      <label>생일<input id="birth" type="text"></label>
    </div>
    <div class="grid3">
      <label>가입일<input id="joined" type="text"></label>
      <label>팔로잉<input id="following" type="text"></label>
      <label>팔로워<input id="followers" type="text"></label>
    </div>
    <div class="grid2">
      <label>프로필 사진<input id="avatarFile" type="file" accept="image/*"></label>
      <label>배너 사진<input id="bannerFile" type="file" accept="image/*"></label>
    </div>
    <div class="grid2">
    </div>
    <div class="switches">
      <label class="sw"><input id="lock" type="checkbox"><span class="knob"></span>자물쇠</label>
      <label class="sw"><input id="jobOn" type="checkbox"><span class="knob"></span>직업 표시</label>
      <label class="sw"><input id="birthOn" type="checkbox"><span class="knob"></span>생일 표시</label>
      
      
    </div>

    <h2>트윗</h2>
    <div id="tweetList"></div>
    <button id="addTweet" class="ghost" type="button">+ 트윗 추가</button>
  </section>
</main>

<div class="bar">
  <button id="save" class="primary" type="button">PNG로 저장</button>
  <button id="reset" class="ghost" type="button">초기화</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="profile.js"></script>
<a class="tback" href="index.html" aria-label="선택 화면으로">‹</a>
<script src="back.js?v=1"></script>
<script src="common.js"></script>
</body>
</html>
