<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no"><script src="../nozoom.js?v=1"></script>
<title>트윗 편집기</title>
<link rel="stylesheet" href="tweet.css">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><link rel="stylesheet" href="back.css?v=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=3">
<link rel="stylesheet" href="../ps-editor.css?v=12"><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script><script src="../chat-capture.js"></script><script src="../instagram/img.js?v=1"></script></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>X 트윗</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<main class="wrap">
  <section class="stage"><div id="capture" class="phone"></div></section>

  
</main>



</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>트윗 내용 수정</h2><div class="ps-edwrap"><section class="editor">
<div class="ps-pn" data-t="기본">
    <h2>상단 제목</h2>
    <label>제목<input id="title" type="text"></label>

    <h2>본문 트윗</h2>
    <div class="card">
      <div class="grid2">
        <label>이름<input id="name" type="text"></label>
        <label>아이디<input id="handle" type="text"></label>
      </div>
      <label>내용<input id="text" type="text"></label>
      <div class="grid3">
        <label>시간<input id="time" type="text"></label>
        <label>날짜<input id="date" type="text"></label>
        <label>조회수<input id="views" type="text"></label>
      </div>
      <div class="grid3">
        <label>멘션<input id="reply" type="text"></label>
        <label>리트윗<input id="rt" type="text"></label>
        <label>마음<input id="like" type="text"></label>
      </div>
      <div class="grid2">
        <div class="upl"><div class="upl-th"><img alt=""><span>없음</span></div><div class="upl-body"><span class="upl-label">프로필 사진</span><b class="upl-name">선택된 파일 없음</b><label class="upl-btn">변경<input id="avatarFile" type="file" accept="image/*"></label></div></div>
      </div>
      <div class="switches">
        <label class="sw"><input id="showBtn" type="checkbox"><span class="knob"></span>쪽지 버튼 표시</label>
        <label class="sw"><input id="lockT" type="checkbox"><span class="knob"></span>이름 옆 자물쇠</label>
      </div>
    </div>

    <h2>인용 트윗</h2>
    <div class="card">
      <div class="switches" style="margin-bottom:12px">
        <label class="sw"><input id="showQuote" type="checkbox"><span class="knob"></span>인용 트윗 표시</label>
      </div>
      <div class="grid3">
        <label>이름<input id="qname" type="text"></label>
        <label>아이디<input id="qhandle" type="text"></label>
        <label>시간<input id="qtime" type="text"></label>
      </div>
      <label>내용<input id="qtext" type="text"></label>
      <div class="upl"><div class="upl-th"><img alt=""><span>없음</span></div><div class="upl-body"><span class="upl-label">프로필 사진</span><b class="upl-name">선택된 파일 없음</b><label class="upl-btn">변경<input id="qavatarFile" type="file" accept="image/*"></label><button class="upl-del" id="qavatarFile_del" type="button">삭제</button></div></div>
    </div>

    <h2>화면 옵션</h2>
    <div class="card">
      
      
      
    </div>

</div>
<div class="ps-pn" data-t="답글" hidden>
    <h2>답글</h2>
    <div id="replyList"></div>
    <button id="addReply" class="ghost" type="button">+ 답글 추가</button>
    <button id="addChain" class="ghost" type="button" style="margin-top:10px">+ 답멘션 추가 (앞 답글에 이어짐)</button>
  
</div></section></div><div class="ps-acts">
  <button id="save" class="primary" type="button">PNG 저장</button>
  <button id="reset" class="ghost" type="button">초기화</button>
</div></section>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="tweet.js"></script>
<script src="common.js"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script><script src="../upl.js?v=4" defer></script></body>
</html>
