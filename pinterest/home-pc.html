<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../nozoom.js?v=1"></script>
<title>Pinterest 홈 PC</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="home.css?v=1"><link rel="stylesheet" href="home-pc.css?v=2">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=3">
<link rel="stylesheet" href="../ps-editor.css?v=10"><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>Pinterest 홈</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame"><div class="pw" id="pw"><div id="pf">
<div class="sr"><svg width="30" height="30" viewBox="0 0 24 24"><circle cx="10.500" cy="10.500" r="6.500"/><path d="m15.500 15.500 5 5"/></svg><span id="vSr"></span><svg class="cam" width="40" height="40" viewBox="0 0 24 24"><rect x="3" y="6.500" width="18" height="13" rx="3"/><circle cx="12" cy="13" r="3.500"/><path d="M8.500 6.500 10 4h4l1.500 2.500"/></svg></div>
<div class="av" id="vAv"></div><svg class="chv" width="26" height="26" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg>
<div id="mas"></div>
</div></div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>Pinterest 홈 내용 수정</h2><div class="ps-edwrap"><section class="editor">
<div class="ps-pn" data-t="기본">
  <h2>홈 편집</h2>
  <label>검색창 문구<input id="iSr"></label><label class="file">프로필 사진<input id="iAv" type="file" accept="image/*"></label>
  <h2 style="margin-top:14px">사진 일괄 추가</h2><label class="file">사진 여러 장 선택<input id="batchPins" type="file" accept="image/*" multiple></label><h2 style="margin-top:14px">핀 목록</h2>
  <div id="plist"></div>
  <button class="ghost" id="addP" type="button">+ 핀 추가</button>

</div></section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="home-pc.js?v=2"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
