<main id="home">
  <h1>Editsoceur</h1>
  <p id="homeSubtitle">Choose a category to explore</p>
  <nav id="categoryNav" aria-label="카테고리">
    <button class="folder-btn" type="button" data-category="social"><span class="folder-icon">💬</span><strong>소셜</strong><small>7 APPS</small></button>
    <button class="folder-btn" type="button" data-category="communication"><span class="folder-icon">✉️</span><strong>커뮤니케이션</strong><small>8 APPS</small></button>
    <button class="folder-btn" type="button" data-category="web"><span class="folder-icon">🌐</span><strong>인터넷·검색</strong><small>5 APPS</small></button>
    <button class="folder-btn" type="button" data-category="entertainment"><span class="folder-icon">🎬</span><strong>엔터테인먼트</strong><small>6 APPS</small></button>
    <button class="folder-btn" type="button" data-category="photo"><span class="folder-icon">📷</span><strong>사진·편집</strong><small>4 APPS</small></button>
    <button class="folder-btn" type="button" data-category="life"><span class="folder-icon">🧸</span><strong>라이프·유틸</strong><small>8 APPS</small></button>
  </nav>
</main>
<main id="appsView" hidden>
  <button id="backHome" type="button" class="back-home">‹ 카테고리</button>
  <h1 id="categoryTitle">소셜</h1>
  <p id="categorySubtitle">Choose an app to explore</p>
  <nav id="appNav" aria-label="앱 목록"></nav>
</main>
<script>
(function(){
  const groups={
    social:{title:'소셜',apps:[
      ['Instagram','instagram/index.html'],['Twitter(X)','twitter/index.html'],['Facebook','facebook/facebook.html'],['Pinterest','pinterest/index.html'],['Tinder','tinder/tinder.html'],['TikTok','tiktok/index.html'],['SumOne','sumone/index.html']
    ]},
    communication:{title:'커뮤니케이션',apps:[
      ['Discord','discord/discord.html'],['iMessage','imessage/index.html'],['KakaoTalk','kakao/index.html'],['Phone','call/index.html'],['Notifications','notifications/notify.html'],['Telegram','telegram/index.html'],['Mail','mail/index.html'],['Zoom','zoom/index.html']
    ]},
    web:{title:'인터넷·검색',apps:[
      ['Google','google/index.html'],['Naver','naver/index.html'],['Namuwiki','namuwiki/index.html'],['News (Fake)','news/index.html'],['News Table','news-table/index.html']
    ]},
    entertainment:{title:'엔터테인먼트',apps:[
      ['YouTube','youtube/index.html'],['Netflix','netflix/index.html'],['Music','music/index.html'],['Webtoon','webtoon/index.html'],['Manga','manhwa/index.html'],['Animal Crossing','animalcrossing/index.html']
    ]},
    photo:{title:'사진·편집',apps:[
      ['Gallery','gallery/index.html'],['Camera','camera/index.html'],['Punching','punching/index.html'],['Feature Phone','featurephone/index.html']
    ]},
    life:{title:'라이프·유틸',apps:[
      ['Apple','apple/index.html'],['ChatGPT','chatgpt/index.html'],['Daangn','daangn/index.html'],['Everytime','everytime/index.html'],['Community','community/index.html'],['Setlog','setlog/index.html'],['Memo','memo/index.html'],['Etc','etc/index.html']
    ]}
  };
  const home=document.getElementById('home'),view=document.getElementById('appsView'),nav=document.getElementById('appNav');
  const title=document.getElementById('categoryTitle'),subtitle=document.getElementById('categorySubtitle');
  function openCategory(key,updateHistory){
    const group=groups[key];if(!group)return;
    title.textContent=group.title;
    subtitle.textContent=group.apps.length+' APPS';
    nav.innerHTML=group.apps.map(([name,url])=>'<a class="btn" href="'+url+'">'+name+'</a>').join('');
    home.hidden=true;view.hidden=false;window.scrollTo(0,0);
    if(updateHistory)history.pushState({category:key},'', '#'+key);
  }
  function showHome(updateHistory){
    view.hidden=true;home.hidden=false;window.scrollTo(0,0);
    if(updateHistory&&location.hash)history.pushState({},'',location.pathname);
  }
  document.getElementById('categoryNav').addEventListener('click',e=>{
    const btn=e.target.closest('[data-category]');if(btn)openCategory(btn.dataset.category,true);
  });
  document.getElementById('backHome').addEventListener('click',()=>showHome(true));
  window.addEventListener('popstate',()=>{
    const key=location.hash.slice(1);
    if(groups[key])openCategory(key,false);else showHome(false);
  });
  const initial=location.hash.slice(1);
  if(groups[initial])openCategory(initial,false);
})();
</script>
