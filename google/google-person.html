<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>구글 인물</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="google-person.css">
<link rel="stylesheet" href="../ps-editor.css?v=10"><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html" style="color:#0095f6;font-weight:600;font-size:15px;text-decoration:none">‹ 뒤로</a><span class="ps-brand">Google 인물 스튜디오</span><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">

<section class="ps-card ps-main">
<div class="ps-lbl">실시간 미리보기</div>
<h2>구글 인물 뉴스바</h2>
<p class="ps-sub">4:3 프리뷰 · 투명 PNG 저장 · 오른쪽에서 바로 수정해요</p>
<div class="ps-stage" id="stage"><div class="fit" id="fit"><div class="fr">

<div id="cap"><div class="card">
  <div class="gh"><div class="logo"><b style="color:#4285f4">G</b><b style="color:#ea4335">o</b><b style="color:#fbbc05">o</b><b style="color:#4285f4">g</b><b style="color:#34a853">l</b><b style="color:#ea4335">e</b></div><div class="av ph" id="vAv"></div></div>
  <div class="sb"><b class="g">G</b><span id="vQ"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ea4335" stroke-width="2.600"><circle cx="12" cy="12" r="4"/><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5" stroke="#4285f4"/></svg><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4285f4" stroke-width="2.600" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3" fill="#4285f4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></div>
  <div class="tb"><span>AI 모드</span><span class="on">전체</span><span>이미지</span><span>동영상</span><span>쇼핑</span></div>
  <div class="nm"><b id="vName"></b><span id="vDesc"></span></div>
  <div class="ph-row" id="vPh"></div>
  <div class="two">
    <div class="box"><small>나이</small><b id="vAge"></b><span id="vBirth"></span></div>
    <div class="box"><small>노래</small><div class="sg"><i class="ph"></i><i class="ph"></i><i class="ph"></i></div></div>
  </div>
  <div class="box ov"><b>개요</b><p id="vOv"></p></div>
</div></div>

</div></div></div>
</section>

<section class="ps-card ps-side">
<div class="ps-lbl">편집 패널</div>
<h2>구글 인물 수정</h2>
<div class="ps-seg" id="seg"><button class="on" type="button">기본</button><button type="button">사진</button><button type="button">정보</button></div>
<div class="editor">
  <div class="pn">
    <label>검색어<input id="iQ"></label>
    <label>이름<input id="iName"></label>
    <label>설명<input id="iDesc"></label>
    <div class="upl"><div class="upl-th"><img alt=""><span>없음</span></div><div class="upl-body"><span class="upl-label">프로필 사진</span><b class="upl-name">선택된 파일 없음</b><label class="upl-btn">변경<input id="iAv" type="file" accept="image/*"></label></div></div>
  </div>
  <div class="pn" hidden>
    <label>인물 사진 (여러 장)<input id="iPh" type="file" accept="image/*" multiple></label>
    <button class="ghost" id="clrPh" type="button">인물 사진 비우기</button>
  </div>
  <div class="pn" hidden>
    <label>나이<input id="iAge"></label>
    <label>생일<input id="iBirth"></label>
    <label>노래 커버 1<input class="sgf" type="file" accept="image/*"></label>
    <label>노래 커버 2<input class="sgf" type="file" accept="image/*"></label>
    <label>노래 커버 3<input class="sgf" type="file" accept="image/*"></label>
    <label class="tx">소개글<textarea id="iOv" rows="4"></textarea></label>
  </div>
  </div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div>
</section>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="google-person.js"></script>
<script src="../upl.js?v=1" defer></script></body>
</html>
