<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>버디버디</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="buddybuddy.css?v=1">
<link rel="stylesheet" href="../ps-editor.css?v=10"><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="../index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>버디버디</h2>
<p class="ps-sub">실제 메신저 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="bb" id="bb">
 <div class="tb"><svg class="lg" viewBox="0 0 24 24"><path d="M3 17c4-1 6-5 8-9l3 2c-2 4-4 7-9 9z" fill="#7fb52e"/><path d="M12 6l5-3 2 3-5 3z" fill="#4e8a14"/></svg><b>BUDDYBADDY</b><span class="wb"><i>–</i><i>□</i><i>×</i></span></div>
 <div class="mn"><span>파일(<u>F</u>)</span><span>친구(<u>B</u>)</span><span>기능(<u>A</u>)</span><span>도구(<u>T</u>)</span><span>도움말(<u>H</u>)</span></div>
 <div class="me"><span class="sm"></span><i class="ar"></i><b id="vNick">버디바디</b><em id="vStat">(접속)</em></div>
 <div class="pn">
  <div class="nt"><span id="vNote">★ 버디버디 7.0 서비스 자</span><span class="mj">📱<small>문자<sup>+</sup></small></span><span class="ni"><s>🛴</s><s>🏠</s><s>📇</s></span></div>
  <div class="bd">
   <div class="lt">
    <div class="t on"><span class="g2"></span></div>
    <div class="t"><svg viewBox="0 0 30 30"><path d="M13 5v14a4 4 0 1 1-3-4V8l11-3v10a4 4 0 1 1-3-4V6z" fill="#6aa81f" stroke="#3f7a0c" stroke-width="1.5"/></svg></div>
    <div class="t"><span class="em">✉️</span></div>
    <div class="t"><svg viewBox="0 0 30 30"><path d="M4 14 15 4l11 10v11H4z" fill="#8fc43e" stroke="#4a8212" stroke-width="1.6"/><rect x="11" y="16" width="8" height="9" rx="2" fill="#fff" stroke="#4a8212"/></svg></div>
    <div class="ud"><i></i><i class="dn"></i></div>
   </div>
   <div class="ct">
    <div class="sr"><div class="sb"><svg viewBox="0 0 20 20"><circle cx="8" cy="8" r="5.500" fill="#dff" stroke="#667" stroke-width="2"/><path d="m12 12 6 6" stroke="#667" stroke-width="3" stroke-linecap="round"/></svg><span id="vSearch">친구 검색하기</span></div><span class="si">👤</span><span class="si">😊</span><span class="si">📁</span></div>
    <div class="ph" id="ph">
     <div class="gl" id="gl"><i></i><i></i><i></i><i></i><i></i></div>
     <div class="pi" id="pi"></div>
     <div class="fg"></div>
     <div class="dash"></div>
     <div class="dc t" id="vTop">♡ LOVE ♡ 히히 ♡~★≋♡</div>
     <div class="dc b" id="vBot">바보 ♡≋★ 반짝 ♪♪♡</div>
    </div>
    <div class="tl"><span>💬</span><span>📷</span><span>📲</span><span>🎁</span><span>🎲</span><em>…</em></div>
   </div>
  </div>
  <div class="bs"><div class="sel"><svg viewBox="0 0 22 22"><circle cx="9" cy="9" r="6" fill="#eaf6c8" stroke="#4a8212" stroke-width="2"/><path d="m13.500 13.500 7 7" stroke="#d99a1e" stroke-width="3.500" stroke-linecap="round"/></svg>통합검색<small>|</small><i class="ar"></i></div><div class="inp"></div><button class="go" type="button">GO</button></div>
 </div>
</div>
</div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>버디버디 내용 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>닉네임<input id="iNick"></label>
<label>접속 상태<input id="iStat"></label>
<label>공지 문구<input id="iNote"></label>
<label>검색창 문구<input id="iSearch"></label>
</div>
<div class="ps-pn" data-t="사진" hidden>
<label>사진 위 문구<input id="iTop"></label>
<label>사진 아래 문구<input id="iBot"></label>
<label class="ps-addp">+ 사진 추가<input class="ps-sr" id="iPhoto" type="file" accept="image/*"></label>
<button class="ps-ghost" id="clearPhoto" type="button">기본 사진으로</button>
</div>
<div class="ps-pn" data-t="기타" hidden>
<div class="ps-tg"><span>반짝이 효과</span><label class="sw"><input id="iGlit" type="checkbox" checked><i></i></label></div>
<label>테두리·글자 색<input id="iColor" type="color" value="#3fd9cf"></label>
</div>
</div></div>
<div class="ps-acts"><button id="savePng" type="button">PNG 저장</button><button id="reset" type="button">초기화</button></div>
</section>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="buddybuddy.js?v=1"></script>
</body>
</html>
