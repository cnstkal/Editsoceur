<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>나무위키 문서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">

</head>
<body>
<div class="phone">
<div class="navbar" data-html2canvas-ignore><a href="index.html">‹ 선택화면</a></div>
<div id="wf">
  <div class="wc" id="wC">
    <div class="wh"><b class="wl">나무위키</b><i style="flex:1"></i>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="10"/></svg>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M3 5h12v9H8l-4 3.500V14H3zM17 9h4v9h-1v2l-3-2h-5v-3h5z"/></svg>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V5h8v3" stroke="#fff" fill="none" stroke-width="2"/></svg>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M12 22a2.500 2.500 0 0 0 2.500-2.500h-5A2.500 2.500 0 0 0 12 22zM18 16V11a6 6 0 0 0-12 0v5l-2 2v1h16v-1z"/></svg>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="7" r="4.500"/><path d="M3 21c0-5 4-7 9-7s9 2 9 7z"/></svg></div>
    <div class="wsr"><span>⤮</span><em>여기에서 검색</em><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.400" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="7"/><path d="m21 21-5.500-5.500"/></svg><span>→</span></div>
    <h1 id="wT"></h1>
    <div class="wm" id="wM"></div>
    <div class="wbt"><span class="st">☆<u id="wS"></u></span><span>편집 요청</span><span>토론</span><span>역사</span><span class="dots">⋮</span></div>
    <div class="wcat" id="wCat"></div>
    <div class="wlock" id="wLock"><svg width="22" height="26" viewBox="0 0 24 24" fill="#777"><path d="M6 10V7a6 6 0 0 1 12 0v3h1.500v12h-15V10zm3 0h6V7a3 3 0 0 0-6 0z"/></svg>편집 보호된 문서입니다. 문서의 <i class="acl">⛓</i><a>ACL 탭</a>을 확인하세요.</div>
    <div class="nb" id="wNb1"></div>
    <div class="nb" id="wNb2"></div>
    <div class="ib" id="wIb"></div>
  </div>
  <div class="wtop"><span class="du">namu.wiki</span><span class="dx">✕</span></div>
  <div class="wup"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M6 11l6-6 6 6"/></svg></div>
  <div class="wbr">
    <svg width="34" height="34" viewBox="0 0 24 24"><rect x="2.500" y="2.500" width="19" height="19" rx="5" fill="none" stroke="#111" stroke-width="2"/><text x="12" y="17" font-size="13" font-weight="900" text-anchor="middle" fill="#111">N</text></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="7"/><path d="m21 21-5.500-5.500"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.500-5.800M20 4v5h-5"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M4 15h16"/></svg>
  </div>
</div>
<section class="editor">
  <h2>나무위키 편집</h2>
  <label>스크롤 위치 (0이면 맨 위)<input id="iSc" type="range" min="0" max="1800" step="10" style="padding:0"></label>
  <div class="row"><label>상단 색<input id="iTop" type="color" style="padding:2px;height:44px"></label><label>테마 색(주황 부분)<input id="iTh" type="color" style="padding:2px;height:44px"></label></div>
  <label>문서 제목<input id="iT"></label>
  <label>최근 수정 시각<input id="iM"></label>
  <div class="row"><label>즐겨찾기 수<input id="iS"></label><label style="display:flex;align-items:center;gap:6px;margin-top:22px"><input id="iLock" type="checkbox" style="width:auto;margin:0">보호 문구 표시</label></div>
  <label>분류 (쉼표 구분)<input id="iCat"></label>
  <h2 style="margin-top:14px">틀(네비박스)</h2>
  <div class="row"><label>그룹 영문<input id="iG1"></label><label>그룹 한글<input id="iG2"></label></div>
  <label>멤버 (쉼표 구분)<input id="iMem"></label>
  <label>굵게 표시할 멤버 번호<input id="iAct" type="number" min="1"></label>
  <h2 style="margin-top:14px">인물 정보 상자</h2>
  <div class="row"><label>한글 이름<input id="iN1"></label><label>영문 이름<input id="iN2"></label></div>
  <label class="file">인물 사진<input id="iPh" type="file" accept="image/*"></label>
  <p style="font-size:12px;color:#888;margin:4px 0 10px">내용 표기: [[파란 링크]] , **굵게** , ^[1] 위첨자 , 줄바꿈 가능</p>
  <div id="el"></div><button class="ghost" id="addR" type="button">+ 항목 추가</button>
</section>
</div>
<div class="bar"><button id="savePng" class="primary">PNG로 저장</button><button id="reset" class="secondary">초기화</button></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="wiki.js?v=1"></script>
</body>
</html>
