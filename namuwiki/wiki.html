<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../nozoom.js?v=1"></script>
<title>나무위키 문서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="wiki.css?v=2">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=2">
<link rel="stylesheet" href="../ps-editor.css?v=10"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>나무위키 문서</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div id="wf">
  <div class="wc" id="wC">
    <div class="wh"><b class="wl">나무위키</b><i style="flex:1"></i>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="10"/></svg>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M3 5h12v9H8l-4 3.500V14H3zM17 9h4v9h-1v2l-3-2h-5v-3h5z"/></svg>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V5h8v3" stroke="#fff" fill="none" stroke-width="2"/></svg>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M12 22a2.500 2.500 0 0 0 2.500-2.500h-5A2.500 2.500 0 0 0 12 22zM18 16V11a6 6 0 0 0-12 0v5l-2 2v1h16v-1z"/></svg>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="7" r="4.500"/><path d="M3 21c0-5 4-7 9-7s9 2 9 7z"/></svg></div>
    <div class="wsr"><span>⤮</span><em>여기에서 검색</em><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.400" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="7"/><path d="m21 21-5.500-5.500"/></svg><span>→</span></div>
    <h1 id="wT"></h1>
    <div class="wm" id="wM"></div>
    <div class="wbt"><span class="st">☆</span><span>편집 요청</span><span>토론</span><span>역사</span><span class="dots">⋮</span></div>
    <div class="wcat" id="wCat"></div>
    <div class="nb" id="wNb1"></div>
    <div class="nb" id="wNb2"></div>
    <div class="ib" id="wIb"></div>
  </div>
  <div class="wtop"><span class="du">namu.wiki</span><span class="dx">✕</span></div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>나무위키 문서 내용 수정</h2><div class="ps-edwrap"><section class="editor">
  <h2>나무위키 편집</h2>
  <div class="row"><label>상단 색<input id="iTop" type="color" style="padding:2px;height:44px"></label><label>테마 색(주황 부분)<input id="iTh" type="color" style="padding:2px;height:44px"></label></div>
  <label>문서 제목<input id="iT"></label>
  <label>최근 수정 시각<input id="iM"></label>
  <h2 style="margin-top:14px">분류</h2>
  <div id="elCat"></div>
  <button class="ghost" id="addCat" type="button">+ 분류 추가</button>
  <h2 style="margin-top:14px">틀(네비박스)</h2>
  <div class="row"><label>그룹 영문<input id="iG1"></label><label>그룹 한글<input id="iG2"></label></div>
  <h2 style="margin-top:14px">멤버</h2>
  <div id="elMem"></div>
  <button class="ghost" id="addMem" type="button">+ 멤버 추가</button>
  <label>굵게 표시할 멤버 번호<input id="iAct" type="number" min="1"></label>
  <h2 style="margin-top:14px">인물 정보 상자</h2>
  <div class="row"><label>한글 이름<input id="iN1"></label><label>영문 이름<input id="iN2"></label></div>
  <label class="file">인물 사진<input id="iPh" type="file" accept="image/*"></label>
  <p style="font-size:12px;color:#888;margin:4px 0 10px">내용 표기: [[파란 링크]] , **굵게** , ^[1] 위첨자 , 줄바꿈 가능</p>
  <div id="el"></div><button class="ghost" id="addR" type="button">+ 항목 추가</button>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="wiki.js?v=2"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
