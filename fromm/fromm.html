<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fromm</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="fromm.css?v=2">
<link rel="stylesheet" href="../ps-editor.css?v=10"><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="../index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>fromm</h2>
<p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="fm" id="fm">
 <div class="hd">
  <button class="rb" type="button"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M11 5l-7 7 7 7"/></svg></button>
  <div class="ti" id="vTitle"></div>
  <div class="rp"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.700" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.500-4.500" stroke-width="0"/></svg><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.700" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></div>
 </div>
 <div class="ch" id="ch"><div id="msgs"></div></div>
 <div class="ib"><span id="vHint"></span><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.700" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8 14.500c1.200 1.800 6.800 1.800 8 0"/><circle cx="8.700" cy="9.500" r=".6" fill="#333"/><circle cx="15.300" cy="9.500" r=".6" fill="#333"/></svg></div>
</div>
</div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>fromm 내용 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>상대 이름<input id="iName"></label>
<label>입력창 문구<input id="iHint"></label>
<label>상단 제목<input id="iTitle"></label>
<label>프로필 사진<input id="iAvatar" type="file" accept="image/*"></label>
<button class="ps-ghost" id="clearAv" type="button">기본 프로필로</button>
<div class="ps-tg"><span>채팅만 저장 (배경 투명)</span><label class="sw"><input id="tChat" type="checkbox"><i></i></label></div>
<div class="ps-tg"><span>하단 메시지 입력창 표시</span><label class="sw"><input id="tInput" type="checkbox" checked><i></i></label></div>
</div>
<div class="ps-pn" data-t="채팅" hidden>
<div id="ed"></div>
<button class="addc" id="add" type="button">+ 메시지 추가</button>
<p class="hint">종류: 텍스트 / 사진 / 날짜 (날짜는 가운데 구분선으로 표시돼요)</p>
</div>
</div></div>
<div class="ps-acts"><button id="savePng" type="button">PNG 저장</button><button id="reset" type="button">초기화</button></div>
</section>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="fromm.js?v=4"></script>
</body>
</html>
