<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>에브리타임 게시판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="board.css?v=1">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=1">
</head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>에브리타임 게시판</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div id="ef">
<span class="etm" id="eTm"></span>
<svg class="ewf" width="18" height="13" viewBox="0 0 18 13"><path d="M9 2.500c2.300 0 4.400.9 6 2.400l1.200-1.300A10.500 10.500 0 0 0 9 .8 10.500 10.500 0 0 0 1.800 3.600L3 4.900a8.600 8.600 0 0 1 6-2.400zm0 3.700c1.300 0 2.500.5 3.400 1.300l1.200-1.300A7 7 0 0 0 9 4.400a7 7 0 0 0-4.600 1.800l1.200 1.300c.9-.8 2.100-1.300 3.400-1.300zm0 3.600c-.6 0-1.200.2-1.600.6L9 12.200l1.600-1.800c-.4-.4-1-.6-1.600-.6z"/></svg>
<div class="ebt"><u id="eBu"></u><em id="eBn"></em><svg width="8" height="10" viewBox="0 0 8 10"><path d="M5 0 0 6h3.200L2.500 10 8 3.800H4.800z" fill="#fff"/></svg></div>
<svg class="ebk" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M15.500 4 7.500 12l8 8"/></svg>
<div class="eti"><b id="eBd"></b><span id="eSc"></span></div>
<svg class="esr" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="7.500"/><path d="m16 16 5 5"/></svg>
<div class="ekb"><u></u><u></u><u></u></div>
<div class="elst" id="eL"></div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>에브리타임 게시판 내용 수정</h2><div class="ps-edwrap"><section class="editor">
<h2>게시판 편집</h2>
<div class="row"><label>시간<input id="iTm"></label><label>배터리<input id="iBt"></label></div>
<div class="row"><label>게시판 이름<input id="iBd"></label><label>학교<input id="iSc"></label></div>
<h2 style="margin-top:14px">글</h2>
<div id="elist"></div>
<div class="row"><button class="ghost" id="addP" type="button">+ 글 추가</button><button class="ghost" id="addB" type="button">+ 빈 칸(광고 자리)</button></div>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG로 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="board.js?v=2"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
</body>
</html>
