<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../nozoom.js?v=1"></script>
<title>MEME</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../ps-base.css?v=4">
<link rel="stylesheet" href="../ps-editor.css?v=10">
<link rel="stylesheet" href="../ps-shell.css?v=2">
<link rel="stylesheet" href="meme.css?v=1">
</head><body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="../index.html" style="color:#0095f6;font-weight:600;font-size:15px;text-decoration:none">‹ 뒤로</a><a href="../index.html">‹ 처음으로</a><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>MEME</h2>
<p class="ps-sub">1:1 · 사진을 넣고 위아래 문구를 적어요</p>
<div class="ps-stage"><div class="vp" id="vp"><div id="cv">
 <div id="mImgWrap"><img id="mImg" alt="" hidden></div>
 <div id="mTop" class="mtxt"></div>
 <div id="mBot" class="mtxt"></div>
</div></div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>MEME 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>사진<input id="iImg" type="file" accept="image/*"></label>
<label>위 문구<textarea id="iTop" rows="2"></textarea></label>
<label>아래 문구<textarea id="iBot" rows="2"></textarea></label>
<label>글자 크기<input id="iSize" type="range" min="40" max="200" value="110"></label>
</div>
</div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div>
</section>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="meme.js?v=1"></script>
</body></html>
