<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>맥북 폴더</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="mac-folder.css">
</head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><span class="ps-brand">Mac Folder Studio</span><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">

<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>맥북 폴더 뉴스바</h2>
<p class="ps-sub">9:16 투명 PNG · 오른쪽에서 바로 수정해요</p>
<div class="ps-stage" id="stage"><div class="fit" id="fit"><div class="fr">

<div id="cap"><div class="card" id="card">
  <div class="nb"><span class="tag" id="vTag"></span><span class="lv" id="vLive"><i></i>LIVE</span></div>
  <div class="win">
    <div class="sd"><div class="dots"><i></i><i></i><i></i></div><div id="sdA" class="lst"></div></div>
    <div class="mn">
      <div class="tb">
        <svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="#444" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M6.500 1 1.500 6l5 5"/></svg>
        <svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="#b5b5b5" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="m1.500 1 5 5-5 5"/></svg>
        <b id="vTitle"></b>
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#555" stroke-width="1.200"><rect x="1" y="1" width="4" height="4"/><rect x="7" y="1" width="4" height="4"/><rect x="1" y="7" width="4" height="4"/><rect x="7" y="7" width="4" height="4"/></svg>
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#555" stroke-width="1.200"><rect x="1" y="1" width="10" height="4"/><rect x="1" y="7" width="10" height="4"/></svg>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M5 11v10h14V11"/></svg>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" stroke-linejoin="round"><path d="M3 12V3h9l9 9-9 9z"/></svg>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5" stroke-linecap="round"/></svg>
      </div>
      <div class="fl" id="vFolders"></div>
      <div class="pb"><svg width="9" height="7" viewBox="0 0 24 18" fill="#5bb6ee"><path d="M19 8a7 7 0 0 0-13-2 5 5 0 0 0 1 10h12a4 4 0 0 0 0-8z"/></svg><span>iCloud Drive</span><span>›</span><span id="vPath"></span></div>
      <div class="sb"><span id="vStat"></span><u></u></div>
    </div>
  </div>
  <div class="tk"><span class="key" id="vKey"></span><p id="vTick"></p></div>
</div></div>

</div></div></div>
</section>

<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>맥북 폴더 수정</h2>
<div class="ps-seg" id="seg"><button class="on" type="button">기본</button><button type="button">폴더</button><button type="button">뉴스바</button></div>
<div class="editor">
  <div class="pn">
    <label>창 제목<input id="iTitle"></label>
    <label>즐겨찾기 (쉼표)<input id="iFav"></label>
    <label>iCloud (쉼표)<input id="iIc"></label>
    <label>하단 상태 문구<input id="iStat"></label>
    <label>폴더 색상<input id="iColor" type="color"></label>
  </div>
  <div class="pn" hidden>
    <div id="iList"></div>
    <button class="addc" id="addF" type="button">+ 폴더 추가 (최대 8개)</button>
  </div>
  <div class="pn" hidden>
    <div class="tg"><span>뉴스바 표시</span><label class="sw"><input id="iBar" type="checkbox"><i></i></label></div>
    <label>상단 태그<input id="iTag"></label>
    <label>하단 라벨<input id="iKey"></label>
    <label>하단 자막<input id="iTick"></label>
    <div class="tg"><span>LIVE 표시</span><label class="sw"><input id="iLive" type="checkbox"><i></i></label></div>
  </div>
</div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div>
</section>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="mac-folder.js"></script>
</body>
</html>
