<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../nozoom.js?v=1"></script>
<title>아이폰 잠금화면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../ps-base.css?v=4"><link rel="stylesheet" href="../ps-editor.css?v=12"><link rel="stylesheet" href="../ps-shell.css?v=2"><link rel="stylesheet" href="lockscreen.css?v=2"></head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>아이폰 잠금화면</h2>
<p class="ps-sub">9:16 화면을 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-pv9"><canvas id="cv" width="1080" height="1920"></canvas></div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>잠금화면 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="배경">
<label>배경 이미지<input id="iBg" type="file" accept="image/*"></label>
<button class="ps-ghost" id="clearBg" type="button">배경 이미지 지우기</button>
<label>확대<input id="iZoom" type="range" min="100" max="300"></label>
<label>좌우 위치<input id="iX" type="range" min="0" max="100"></label>
<label>상하 위치<input id="iY" type="range" min="0" max="100"></label>
<label>어둡게<input id="iDim" type="range" min="0" max="70"></label>
<label>배경 색상<input id="iCol" type="color"></label>
</div>
<div class="ps-pn" data-t="시간·날짜">
<label>시간<input id="iTime"></label>
<label>날짜 선택<input id="iPick" type="date"></label>
<label>날짜 언어<select id="iLang"><option value="ko">한국어</option><option value="en">영어</option></select></label>
<label>날짜 문구<input id="iDate"></label>
<label>위치 (위·아래)<input id="iTop" type="range" min="-120" max="400"></label>
<label>글자 색상<input id="iInk" type="color"></label>
</div>
<div class="ps-pn" data-t="상단바">
<label>신호 세기<select id="iSig"><option value="4">4칸</option><option value="3">3칸</option><option value="2">2칸</option><option value="1">1칸</option><option value="0">없음</option></select></label>
<label>와이파이<select id="iWifi"><option value="3">강함</option><option value="2">보통</option><option value="1">약함</option><option value="0">숨기기</option></select></label>
<label>배터리 <span id="vBat"></span><input id="iBat" type="range" min="0" max="100"></label>
<label>상단바 좌·우<input id="iSbX" type="range" min="-150" max="150"></label>
<label>상단바 위·아래<input id="iSbY" type="range" min="-60" max="200"></label>
<div class="ps-tg"><span>충전 중</span><label class="sw"><input id="iChg" type="checkbox"><i></i></label></div>
</div>
<div class="ps-pn" data-t="하단">
<div class="ps-tg"><span>손전등·카메라 버튼</span><label class="sw"><input id="iBtn" type="checkbox"><i></i></label></div>
<div class="ps-tg"><span>홈 바 표시</span><label class="sw"><input id="iHome" type="checkbox"><i></i></label></div>
<label>안내 문구<input id="iSwipe" placeholder="비우면 숨겨져요"></label>
</div>
</div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div>
</section>
</div>
</div>
<script src="lockscreen.js?v=2"></script>
<script src="../ps-tabs.js?v=2"></script><script src="../upl.js?v=4" defer></script><script src="../back-anim.js?v=1" defer></script></body></html>
