<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>airdrop</title>
<link rel="stylesheet" href="airdrop.css">
</head><body>
<main class="wrap">
<section class="card"><div class="lbl">Live Preview · 투명 PNG</div>
<div class="view"><div class="chk"><div id="box">
<div class="hd" id="vTitle"></div>
<div class="pic" id="pic"><img id="vImg" alt=""></div>
<div class="ft"><div id="vNo"></div><div id="vYes"></div></div>
</div></div></div></section>
<section class="card"><div class="lbl">Edit Panel</div><h2>에어드랍 수정</h2>
<label>제목<input id="iTitle"></label>
<label>가운데 사진<input id="iPhoto" type="file" accept="image/*"></label>
<div class="row"><label>왼쪽 버튼<input id="iNo"></label><label>오른쪽 버튼<input id="iYes"></label></div>
<label>버튼 색<input id="iCol" type="color"></label>
<div class="acts"><button id="clr" class="g">사진 비우기</button></div>
<div class="acts"><button id="save">PNG 저장</button><button id="reset" class="g">초기화</button></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="airdrop.js"></script>
</body></html>
