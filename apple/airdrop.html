<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../nozoom.js?v=1"></script>
<title>airdrop</title>
<link rel="stylesheet" href="airdrop.css">
<link rel="stylesheet" href="../ps-base.css?v=4"><link rel="stylesheet" href="../ps-editor.css?v=10"><link rel="stylesheet" href="../ps-shell.css?v=2"><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head><body class="studio">
<div class="ps-wrap"><header class="ps-top"><a href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header><div class="ps-grid">
<section class="card ps-card ps-main"><div class="lbl ps-lbl">Live Preview · 투명 PNG</div>
<div class="view ps-stage"><div class="chk"><div id="box">
<div class="hd" id="vTitle"></div>
<div class="pic" id="pic"><img id="vImg" alt=""></div>
<div class="ft"><div id="vNo"></div><div id="vYes"></div></div>
</div></div></div></section>
<section class="card ps-card ps-side"><div class="lbl ps-lbl">Edit Panel</div><h2>에어드랍 수정</h2><div class="ps-edwrap"><div class="editor"><div class="ps-pn" data-t="기본">
<label>제목<input id="iTitle"></label>
<div class="upl"><div class="upl-th"><img alt=""><span>없음</span></div><div class="upl-body"><span class="upl-label">가운데 사진</span><b class="upl-name">선택된 파일 없음</b><label class="upl-btn">변경<input id="iPhoto" type="file" accept="image/*"></label></div></div>
<div class="row"><label>왼쪽 버튼<input id="iNo"></label><label>오른쪽 버튼<input id="iYes"></label></div>
<label>버튼 색<input id="iCol" type="color"></label>
</div></div></div><div class="acts ps-acts"><button id="clr" class="g">사진 비우기</button></div>
<div class="acts ps-acts"><button id="save">PNG 저장</button><button id="reset" class="g">초기화</button></div>
</section></div></div>
