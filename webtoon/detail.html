<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>작품 상세</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="webtoon.css?v=1">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=2">
<link rel="stylesheet" href="../ps-editor.css?v=10"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>작품 상세</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div id="df" class="wt d">
  <div class="top"></div>
  <div class="sb"><b id="dTime"></b></div>
  <svg class="ic" style="left:calc(46*var(--u))" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4-8 8 8 8"/></svg>
  <svg class="ic" style="left:calc(687*var(--u))" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#fff"/><path d="m7 12.500 3.500 3.500L17 9" fill="none" stroke="var(--ac)" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="ic" style="left:calc(820*var(--u))" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 0 0-12 0c0 6-2.500 7.500-2.500 7.500h17S18 15 18 9zM10 20a2 2 0 0 0 4 0M3 3l18 18"/></svg>
  <svg class="ic" style="left:calc(950*var(--u))" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M5 11v9h14v-9"/></svg>
  <svg class="ic" style="left:calc(1082*var(--u))" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="5" r="1.800"/><circle cx="12" cy="12" r="1.800"/><circle cx="12" cy="19" r="1.800"/></svg>
  <div class="hero"><i class="cv" id="dHero"></i><div class="fan"><small id="dFl"></small><b id="dFan"></b></div><div class="int" id="dInt"></div></div>
  <div class="tt" id="dT"></div>
  <div class="au"><u id="dAu"></u><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#34c759"/><path d="m6 12.500 4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="dDay"></span></div>
  <div class="ds"><span id="dDs"></span></div>
  <svg class="chv" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="top:calc(1022*var(--u))"><path d="m5 9 7 7 7-7"/></svg>
  <div class="dt"><span class="on"><em>전체 회차</em></span><span><em>관련 작품</em></span></div>
  <div class="so"><b>선택소장 ›</b><i></i><span>소장회차보기</span><span>↑↓ 최신순</span></div>
  <div class="pv"><div><s id="dPv"></s><span id="dPt"></span></div><i class="av a1"></i><i class="av a2"></i><i class="av a3"></i><svg class="chv" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="top:calc(1402*var(--u))"><path d="m5 9 7 7 7-7"/></svg></div>
  <div class="el" id="dEl"></div>
  <div id="dNav"></div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>작품 상세 내용 수정</h2><div class="ps-edwrap"><section class="editor">
  <h2>작품 상세 편집</h2>
  <div class="row"><label>시간<input id="iTime"></label><label>상단 색<input id="iAc" type="color" style="padding:2px;height:44px"></label></div>
  <label>대표 이미지<input id="iHero" type="file" accept="image/*"></label>
  <div class="row"><label>제목<input id="iT"></label><label>작가<input id="iAu"></label></div>
  <div class="row"><label>연재 요일<input id="iDay"></label><label>관심 수<input id="iInt"></label></div>
  <label>작품 소개<input id="iDs"></label>
  <div class="row"><label>팬스코어 라벨<input id="iFl"></label><label>팬스코어<input id="iFan"></label></div>
  <div class="row"><label>미리보기 개수<input id="iPv"></label></div>
  <div class="musicbox"><label class="sw"><input id="iNav" type="checkbox"><span class="knob"></span>하단 바 표시</label></div><h2 style="margin-top:14px">회차</h2><div id="el"></div>
  <button class="ghost" id="addE" type="button">+ 회차 추가</button>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="common.js?v=1"></script>
<script src="detail.js?v=1"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
