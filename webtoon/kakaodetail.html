<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../nozoom.js?v=1"></script><title>카카오페이지 상세</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><link rel="stylesheet" href="kakaopage.css"><link rel="stylesheet" href="kakaodetail.css"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>카카오페이지 작품 상세</h2><p class="ps-sub">위쪽 대표 사진을 넣고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame" id="frame"><div class="kw" id="kw" style="background:#000"><div class="ks d" id="ks"></div></div></div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>작품 상세 내용 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>대표 사진<input id="iCov" type="file" accept="image/*"></label>
<button class="ps-ghost" id="clearCov" type="button">대표 사진 지우기</button>
<label>작품 제목<input id="iT"></label>
<label>작가<input id="iA"></label>
<label>장르/연재<input id="iG"></label>
<label>조회수<input id="iV"></label>
<label>평점<input id="iR"></label>
<label>전체 개수<input id="iAll"></label>
<label>탭 (쉼표 구분)<input id="iTabs"></label>
<label>활성 탭 번호<input id="iOn" type="number" min="1"></label>
</div>
<div class="ps-pn" data-t="회차" hidden><div id="eps"></div></div>
<div class="ps-pn" data-t="기타" hidden>
<label>썸네일 기본 색<input id="iCol" type="color" style="width:56px;height:40px;padding:2px"></label>
<button class="ps-ghost" id="clearPics" type="button">회차 이미지 모두 지우기</button>
</div></div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div>
</section></div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="kakaodetail.js"></script>
</body></html>
