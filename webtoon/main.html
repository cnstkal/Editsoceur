<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>웹툰 메인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="webtoon.css?v=1">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=2">
<link rel="stylesheet" href="../ps-editor.css?v=9"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>웹툰 메인</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div id="wf" class="wt">
  <div class="sb"><b id="wTime"></b></div>
  <div class="hd"><b>웹툰</b><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="7"/><path d="m16 16 5 5"/></svg></div>
  <div class="st"><b id="wSb"></b><span id="wSn"></span><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></div>
  <div class="rk" id="wRk"></div>
  <div class="tabs" id="wTabs"></div>
  <div class="gr" id="wGr"></div>
  <div id="wNav"></div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>웹툰 메인 내용 수정</h2><div class="ps-edwrap"><section class="editor">
  <h2>웹툰 메인 편집</h2>
  <div class="row"><label>시간<input id="iTime"></label></div>
  <div class="row"><label>섹션 제목(굵게)<input id="iSb"></label><label>섹션 제목(보통)<input id="iSn"></label></div>
  <label>요일 탭 (쉼표 구분, 뱃지는 이름|뱃지)<input id="iTabs"></label>
  <label>선택된 탭 번호(1부터)<input id="iAct" type="number" min="1"></label>
  <h2 style="margin-top:14px">인기 급상승 카드</h2><div id="el1"></div>
  <button class="ghost" id="add1" type="button">+ 카드 추가</button>
  <h2 style="margin-top:14px">작품 목록</h2><div id="el2"></div>
  <button class="ghost" id="add2" type="button">+ 작품 추가</button>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="common.js?v=1"></script>
<script src="main.js?v=1"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
