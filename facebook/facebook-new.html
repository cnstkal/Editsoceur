<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><script src="../nozoom.js?v=1"></script>
<title>신 페이스북</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="fb2.css?v=1">
<link rel="stylesheet" href="../ps-editor.css?v=10"><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>신 페이스북</h2>
<p class="ps-sub">9:16 화면으로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="fb" id="shot">
 <div class="hd"><svg viewBox="0 0 24 24"><path d="M16 3 7 12l9 9"/></svg><b id="vTitle"></b><svg viewBox="0 0 24 24"><circle cx="10.500" cy="10.500" r="7"/><path d="m16 16 6 6"/></svg></div>
 <div class="rule"></div>
 <div class="sc"><div class="in" id="in">
  <div class="au"><div class="av" id="vAv"></div><div><div class="l1"><span id="vName"></span><i></i><em id="vFol"></em></div><div class="l2"><span id="vTime"></span><span>·</span><span class="mu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.500" cy="18" r="2.500" fill="currentColor"/><circle cx="16.500" cy="16" r="2.500" fill="currentColor"/></svg><span id="vMusic"></span></span><span>·</span><svg viewBox="0 0 24 24" fill="none" stroke="#65676b" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c4 4 4 14 0 18M12 3c-4 4-4 14 0 18"/></svg></div></div><svg class="dots" viewBox="0 0 24 24"><circle cx="4" cy="12" r="2.200"/><circle cx="12" cy="12" r="2.200"/><circle cx="20" cy="12" r="2.200"/></svg></div>
  <p class="tx" id="vText"></p>
  <div class="ph" id="vPhoto"><div class="mute"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h4l5-4v14l-5-4H3z" stroke="none"/><path d="m16 9 5 6m0-6-5 6" fill="none"/></svg></div></div>
  <div class="lk"><span class="lb"><svg viewBox="0 0 24 24"><path d="M2 10h4v11H2zM8 10l4-8c2 0 3 1 3 3l-1 4h6c1.5 0 2.5 1.3 2 2.7l-2 7c-.3 1-1.2 1.8-2.3 1.8H8z"/></svg></span><span id="vLike"></span></div>
  <div class="bt"><span><svg viewBox="0 0 24 24"><path d="M2 10h4v11H2zM8 10l4-8c2 0 3 1 3 3l-1 4h6c1.5 0 2.5 1.3 2 2.7l-2 7c-.3 1-1.2 1.8-2.3 1.8H8z"/></svg><i id="vL2" style="font-style:normal"></i></span><span><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 4 17l5 1-1.500-4.500A9 9 0 0 0 12 3z"/></svg><i id="vCmt" style="font-style:normal"></i></span><span><svg viewBox="0 0 24 24"><path d="M14 4l8 8-8 8v-5C7 15 4 17 2 21c1-8 5-12 12-12z"/></svg><i id="vShr" style="font-style:normal"></i></span></div>
  <div class="cms" id="cms" hidden><div class="rule2"></div><div class="so">관련성 높은 댓글<svg viewBox="0 0 24 24"><path d="m4 8 8 8 8-8"/></svg></div><div id="cmv"></div></div>
 </div></div>
 <div class="ib"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="17" height="17" rx="3" transform="rotate(-6 12 12)"/><path d="m5 17 5-5 3 3 3-3 3 4"/><circle cx="9" cy="8" r="1.500"/></svg><div class="fi"><span id="vPh"></span><svg viewBox="0 0 28 28"><rect x="2" y="5" width="24" height="18" rx="5"/><text x="14" y="18" font-size="9.500" font-weight="700" text-anchor="middle" fill="#65676b" stroke="none">GIF</text></svg><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11"/><circle cx="14" cy="14" r="4"/><path d="M18 10v6c0 3 5 3 5-2"/></svg><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11"/><circle cx="10.500" cy="12" r=".8" fill="#65676b"/><circle cx="17.500" cy="12" r=".8" fill="#65676b"/><path d="M9 17c3 4 7 4 10 0"/></svg></div></div>
</div>
</div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>신 페이스북 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="게시물">
<label>상단 제목<input id="iTitle"></label>
<div class="row"><label>작성자<input id="iName"></label><label>팔로우 문구<input id="iFol"></label></div>
<div class="row"><label>시간<input id="iTime"></label><label>음악 문구<input id="iMusic"></label></div>
<label>본문<textarea id="iText" rows="6"></textarea></label>
<label class="ps-addp">+ 프로필 사진<input class="ps-sr" id="iAv" type="file" accept="image/*"></label>
<label class="ps-addp">+ 게시물 사진<input class="ps-sr" id="iPhoto" type="file" accept="image/*"></label>
<div class="ps-tg"><span>게시물 사진 표시</span><label class="sw"><input id="iPhOn" type="checkbox"><i></i></label></div>
</div>
<div class="ps-pn" data-t="반응" hidden>
<label>좋아요 문구<input id="iLike"></label>
<div class="row"><label>좋아요<input id="iL2"></label><label>댓글 수<input id="iCmt"></label></div>
<div class="row"><label>공유 수<input id="iShr"></label><label>입력창 문구<input id="iPh"></label></div>
</div>
<div class="ps-pn" data-t="댓글" hidden>
<div id="cmList"></div>
<button class="ps-ghost" id="addCm" type="button">+ 댓글 추가</button>
</div>
<div class="ps-pn" data-t="기타" hidden>
<div class="ps-tg"><span>댓글 켜기</span><label class="sw"><input id="iCmOn" type="checkbox"><i></i></label></div>
<label>스크롤 위치<input id="iOff" type="range" min="0" max="1200" value="0"></label>
</div>
</div></div>
<div class="ps-acts"><button id="savePng" type="button">PNG 저장</button><button id="reset" type="button">초기화</button></div>
</section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="fb2.js?v=1"></script>
</body>
</html>
