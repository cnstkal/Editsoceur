<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>페이스북 게시물</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="facebook.css">
<link rel="stylesheet" href="../ps-editor.css?v=5"></head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><span></span><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>페이스북 게시물</h2>
<p class="ps-sub">9:16 화면으로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone" id="shot">
  <div class="hd"><div class="pav" id="vAv"></div><div><div class="nm" id="vName"></div><div class="tm" id="vTime"></div></div></div>
  <p class="tx" id="vText"></p>
  <div class="ph" id="vPhoto"></div>
  <div class="rx"><div><span class="ic">
    <i style="background:#2d6bdc"><svg viewBox="0 0 24 24" fill="#fff"><path d="M2 10h4v11H2zM8 10l4-8c2 0 3 1 3 3l-1 4h6c1.500 0 2.500 1.300 2 2.700l-2 7c-.3 1-1.200 1.800-2.300 1.800H8z"/></svg></i>
    <i style="background:#fbc535"><svg viewBox="0 0 24 24"><path d="M3 8l6 2-6 2M21 8l-6 2 6 2" stroke="#333" stroke-width="2" fill="none"/><path d="M5 14h14c0 4-3 7-7 7s-7-3-7-7z" fill="#7a2a1a"/></svg></i>
    <i style="background:#e8294d"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-9-5.500-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.500-9 12-9 12z"/></svg></i>
  </span><span id="vLike"></span></div>
  <span>댓글 <span id="vCmt"></span>개 공유 <span id="vShr"></span>회</span></div>
  <div class="bar">
    <span><svg viewBox="0 0 24 24"><path d="M2 10h4v11H2zM8 10l4-8c2 0 3 1 3 3l-1 4h6c1.500 0 2.500 1.300 2 2.700l-2 7c-.3 1-1.200 1.800-2.300 1.800H8z"/></svg>좋아요</span>
    <span><svg viewBox="0 0 24 24"><path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H11l-5 4v-4H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>댓글 달기</span>
    <span><svg viewBox="0 0 24 24"><path d="M14 4l8 8-8 8v-5C7 15 4 17 2 21c1-8 5-12 12-12z"/></svg>공유하기</span>
  </div>
  <div class="cm"><div class="cav d" id="vC1av"></div><div><div class="cn" id="vC1n"></div><div class="ct" id="vC1t"></div><div class="cs" id="vC1s"></div></div></div>
  <div class="cm"><div class="cav d" id="vC2av"></div><div><div class="cn" id="vC2n"></div><div class="ct" id="vC2t"></div><div class="cs" id="vC2s"></div></div></div>
</div>
</div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>게시물 내용 수정</h2>
<div class="ps-seg" id="seg"></div>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>작성자 이름<input id="iName"></label>
<label>작성 시간<input id="iTime"></label>
<label>게시물 본문<textarea id="iText" rows="4"></textarea></label>
</div>
<div class="ps-pn" data-t="이미지" hidden>
<label class="ps-addp">+ 프로필 사진<input class="ps-sr" id="iAv" type="file" accept="image/*"></label>
<label class="ps-addp">+ 게시물 사진<input class="ps-sr" id="iPhoto" type="file" accept="image/*"></label>
<button class="ps-ghost" id="clearImg" type="button">사진 모두 비우기</button>
</div>
<div class="ps-pn" data-t="반응" hidden>
<label>좋아요 문구<input id="iLike"></label>
<div class="row"><label>댓글 수<input id="iCmt"></label><label>공유 수<input id="iShr"></label></div>
</div>
<div class="ps-pn" data-t="댓글" hidden>
<div class="row"><label>댓글1 이름<input id="iC1n"></label><label>댓글1 시간 문구<input id="iC1s"></label></div>
<label>댓글1 내용<input id="iC1t"></label>
<label class="ps-addp">+ 댓글1 프로필<input class="ps-sr" id="iC1av" type="file" accept="image/*"></label>
<div class="row"><label>댓글2 이름<input id="iC2n"></label><label>댓글2 시간 문구<input id="iC2s"></label></div>
<label>댓글2 내용<input id="iC2t"></label>
<label class="ps-addp">+ 댓글2 프로필<input class="ps-sr" id="iC2av" type="file" accept="image/*"></label>
</div>
</div></div>
<div class="ps-acts"><button id="savePng" type="button">PNG 저장</button><button id="reset" type="button">초기화</button></div>
</section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="facebook.js"></script>
</body>
</html>
