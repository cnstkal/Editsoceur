<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>photo-booth</title>
<link rel="stylesheet" href="photo-booth.css">
</head><body>
<main class="wrap">
<section class="card"><div class="lbl">Live Preview · 투명 PNG</div>
<div class="view"><div class="chk"><div id="pad"><div id="win">
<div class="tb"><span class="d r"></span><span class="d y"></span><span class="d g"></span><b id="vTitle"></b></div>
<div class="vp" id="vp"><img id="vImg" alt=""></div>
<div class="bt">
<div class="seg" id="seg">
<i><svg viewBox="0 0 16 16"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z" fill="none" stroke="currentColor"/></svg></i>
<i><svg viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="9" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></i>
<i><svg viewBox="0 0 16 16"><path d="M2.5 2.5h11v11h-11zM2.5 8h11" fill="none" stroke="currentColor"/></svg></i></div>
<div class="cam"><svg viewBox="0 0 24 24"><path fill="#fff" d="M9 4 7.6 6H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2.600L15 4zm3 4a4.500 4.500 0 1 1 0 9 4.500 4.500 0 0 1 0-9zm0 1.800a2.700 2.700 0 1 0 0 5.400 2.700 2.700 0 0 0 0-5.400z"/></svg></div>
<div class="fx" id="vFx"></div></div>
</div></div></div></div></section>
<section class="card"><div class="lbl">Edit Panel</div><h2>맥북 카메라 수정</h2>
<label>창 제목<input id="iTitle"></label>
<label>카메라 화면 사진<input id="iPhoto" type="file" accept="image/*"></label>
<label>버튼 문구<input id="iFx"></label>
<label>보기 모드 (1~3)<input id="iView" type="number" min="1" max="3"></label>
<label class="tg"><input id="iMir" type="checkbox"> 좌우 반전</label>
<label class="tg"><input id="iSh" type="checkbox"> 창 그림자</label>
<div class="acts"><button id="clr" class="g">사진 비우기</button></div>
<div class="acts"><button id="save">PNG 저장</button><button id="reset" class="g">초기화</button></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="photo-booth.js"></script>
</body></html>
