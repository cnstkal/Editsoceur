<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><script src="../nozoom.js?v=1"></script>
<title>지도 화면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="map.css">
<link rel="stylesheet" href="../ps-editor.css?v=10">
<style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script>
</head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="../index.html" style="color:#0095f6;font-weight:600;font-size:15px;text-decoration:none">‹ 뒤로</a><span></span><span></span></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>지도 화면</h2>
<p class="ps-sub">화면을 보면서 오른쪽에서 구역을 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame" id="frame"><div class="pw" id="pw"><div class="phone" id="app">
  <div id="map"></div>
  <div class="top">
    <div class="search"><span class="menu">☰</span><input id="q" placeholder="구역 검색" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
  </div>
  <button class="fab" id="add" title="구역 추가">＋</button>
  <div class="toast" id="toast"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="row"><i class="dot" id="s-dot"></i><span id="s-name"></span></div>
    <div class="row sub"><span id="s-type"></span></div>
    <button class="bm" id="bm"></button>
  </div>
</div></div></div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>지도 내용 수정</h2>
<div class="ps-edwrap"><div class="editor">
  <div class="ps-pn" data-t="구역">
    <label>구역 선택<select id="sel"></select></label>
    <label>구역 이름<input id="zName"></label>
    <label>종류<select id="zType"><option>주거</option><option>상업</option><option>공원</option><option>산업</option></select></label>
    <label>색상<input id="zColor" type="color"></label>
    <button class="ps-ghost" id="zDel" type="button">이 구역 삭제</button>
  </div>
  <div class="ps-pn" data-t="새 구역">
    <label>이름<input id="nName" placeholder="새 구역"></label>
    <label>종류<select id="nType"><option>주거</option><option>상업</option><option>공원</option><option>산업</option></select></label>
    <p class="hint">＋ 버튼을 누른 뒤 지도에서 두 점을 찍으면 구역이 생겨요</p>
  </div>
  <div class="ps-pn" data-t="기타">
    <label>북마크 버튼 문구<input id="iBm"></label>
    <label>검색창 안내 문구<input id="iPh"></label>
  </div>
</div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button></div>
</section>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script>
</body>
</html>
