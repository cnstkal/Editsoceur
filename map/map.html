 var t=document.getElementById(x[0]),el=document.querySelector(x[1]);
 t.onchange=function(){el.style.display=t.checked?'':'none';if(x[0]==='tSheet')document.getElementById('app').classList.toggle('ns',!t.checked)};
 t.checked=true;
});

</script>
<script>
[['sName','shT'],['sSub','shS'],['sTime','shM'],['sInfo','shI']].forEach(function(x){var i=document.getElementById(x[0]);i.oninput=function(){document.getElementById(x[1]).textContent=i.value}});
document.getElementById('shX').onclick=function(){var t=document.getElementById('tSheet');t.checked=false;t.dispatchEvent(new Event('change'))};
</script>
<script>
/* 탭 (zoom 패널과 동일 구성) */
(function(){
 var ed=document.querySelector('.editor'),g=[].slice.call(ed.querySelectorAll('.ps-pn'));
 var bar=document.createElement('div');bar.className='ps-seg';
 g.forEach(function(p,i){var b=document.createElement('button');b.type='button';b.textContent=p.getAttribute('data-t');
  if(!i)b.className='on';else p.hidden=true;
  b.onclick=function(){g.forEach(function(x,j){x.hidden=j!==i});[].forEach.call(bar.children,function(c,j){c.classList.toggle('on',j===i)})};
  bar.appendChild(b)});
 ed.parentNode.insertBefore(bar,ed);
})();
</script>
