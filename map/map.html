<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>지도 내용 수정</h2>
<div class="ps-edwrap"><div class="editor">
  <div class="ps-pn" data-t="핀">
    <label>핀 선택<select id="sel"></select></label>
    <label>이름<input id="zName"></label>
    <label>종류<select id="zType"></select></label>
    <button class="ps-ghost" id="zDel" type="button">이 핀 삭제</button>
  </div>
  <div class="ps-pn" data-t="새 핀">
    <label>종류<select id="nType"></select></label>
    <button class="ps-ghost" id="add" type="button">지도에서 위치 찍기</button>
    <p class="hint">버튼을 누른 뒤 지도를 한 번 탭하면 핀이 생겨요</p>
  </div>
  <div class="ps-pn" data-t="문구">
    <label>검색창 안내 문구<input id="iPh"></label>
    <div id="iTabs"></div>
  </div>
  <div class="ps-pn" data-t="화면">
    <div class="ps-tg"><span>검색창</span><label class="sw"><input id="tSearch" type="checkbox" checked><i></i></label></div>
    <div class="ps-tg"><span>카테고리 칩</span><label class="sw"><input id="tChips" type="checkbox" checked><i></i></label></div>
    <div class="ps-tg"><span>지도 버튼 (레이어·내 위치)</span><label class="sw"><input id="tFabs" type="checkbox" checked><i></i></label></div>
    <div class="ps-tg"><span>하단 탭바</span><label class="sw"><input id="tTabs" type="checkbox" checked><i></i></label></div>
  </div>
</div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button></div>
</section>
</div>
</div>
<script src="map.js"></script>
<script>
/* 화면 요소 on/off */
var rs=document.getElementById('reset');
[['tSearch','.search'],['tChips','#chips'],['tFabs','.fabs'],['tTabs','.tabs']].forEach(function(x){
 var t=document.getElementById(x[0]),el=document.querySelector(x[1]);
 t.onchange=function(){el.style.display=t.checked?'':'none'};
 t.checked=true;
});
document.getElementById('reset').addEventListener('click',function(){['tSearch','tChips','tFabs','tTabs'].forEach(function(id){var t=document.getElementById(id);t.checked=true;t.dispatchEvent(new Event('change'))})});
</script>
<script>
/* 탭 (zoom 패널과 동일 구성) */
(function(){
 var ed=document.querySelector('.editor'),g=[].slice.call(ed.querySelectorAll('.ps-pn'));
 var bar=document.createElement('div');bar.className='ps-seg';
 g.forEach(function(p,i){var b=document.createElement('button');b.type='button';b.textContent=p.getAttribute('data-t');
  if(!i)b.className='on';else p.hidden=true;
  b.onclick=function(){g.forEach(function(x,j){x.hidden=j!==i});[].forEach.call(bar.children,function(c,j){c.classList.toggle('on',j===i)})};
  bar.appendChild(b)});
 ed.parentNode.insertBefore(bar,ed);
})();
</script>
