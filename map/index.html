<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="map.css">
</head><body>
<div id="map"></div>

<div class="top">
  <div class="search"><span class="menu">☰</span><input id="q" placeholder="구역 검색" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
</div>

<button class="fab" id="add" title="구역 추가">＋</button>
<div class="toast" id="toast"></div>

<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="row"><i class="dot" id="s-dot"></i><span id="s-name">구역을 선택하세요</span></div>
  <div class="row sub"><span id="s-type">지도의 색칠된 구역을 눌러보세요</span></div>
  <button class="bm" id="bm">북마크하기</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script>
</body></html>
