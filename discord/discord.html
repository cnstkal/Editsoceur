<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><script src="../nozoom.js?v=1"></script><title>디스코드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="discord.css"><link rel="stylesheet" href="../ps-editor.css?v=10"><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html" style="color:#0095f6;font-weight:600;text-decoration:none">‹ 뒤로</a><b>디스코드</b><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>디스코드 채팅</h2><p class="ps-sub">16:9 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-fit" id="fit"><div class="canvas" id="post">
<aside class="sb">
<div class="srv" id="vSrv"></div>
<div class="it"><svg width="38" height="38" viewBox="0 0 24 24" fill="#949ba4"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3zM6 9v11h12V9z"/><rect x="7" y="13" width="4" height="4"/></svg>이벤트</div>
<div class="it"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#949ba4" stroke-width="2"><path d="M12 2 20 7v10l-8 5-8-5V7z"/><path d="M12 7v10" /></svg>서버 부스트</div>
<hr>
<div class="cat">채팅 채널</div>
<div class="ch on"><span class="hs">#</span><span id="vTxt"></span><span class="ic">👤＋ ⚙</span></div>
<div class="cat c2">음성 채널</div>
<div class="it"><svg width="38" height="38" viewBox="0 0 24 24" fill="#949ba4"><path d="M3 9v6h4l5 4V5L7 9z"/><path d="M15 8a5 5 0 0 1 0 8" stroke="#949ba4" stroke-width="2" fill="none"/></svg><span id="vVc"></span></div>
</aside>
<main class="mn"><div class="hd"><span class="hs">#</span><span id="vHead"></span></div>
<div class="msgs" id="vMsgs"></div>
<div class="inp"><span class="pl">+</span><span class="tl"><i>🎁</i><i class="gif">GIF</i><i>🗒</i><i>☺</i><i>✦</i></span></div></main>
</div></div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>채팅 수정</h2>

<div class="editor">
<div class="ps-pn"><label>서버 이름<input id="iSrv"></label><label>채팅 채널(사이드)<input id="iTxt"></label><label>상단 채널명<input id="iHead"></label><label>음성 채널<input id="iVc"></label></div>

</div>

</div></div>
