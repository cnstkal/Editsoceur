<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../nozoom.js?v=1"></script><title>썸원</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@400&display=swap"><link rel="stylesheet" href="../webtoon/kakaopage.css"><link rel="stylesheet" href="sumone.css"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>썸원 오늘의 질문</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame" id="frame"><div class="kw" id="kw"><div class="ks s" id="ks"></div></div></div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>썸원 내용 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>로고 글씨<input id="iLg"></label>
<label>부제목<input id="iSb"></label>
<label>질문<input id="iQ"></label>
<label>번호·날짜<input id="iD"></label>
</div>
<div class="ps-pn" data-t="답변" hidden><div id="ans"></div><button class="ps-ghost" id="add" type="button">+ 답변 추가</button></div>
<div class="ps-pn" data-t="기타" hidden>
<div class="ps-tg"><span>하트 일러스트 표시</span><label class="sw"><input id="iIll" type="checkbox"><i></i></label></div>
<label>일러스트 이미지<input id="iImg" type="file" accept="image/*"></label>
<button class="ps-ghost" id="clearImg" type="button">기본 하트로 되돌리기</button>
</div></div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div>
</section></div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="sumone.js"></script>
</body></html>
