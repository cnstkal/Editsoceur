<style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head><body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="../index.html" style="color:#0095f6;font-weight:600;font-size:15px;text-decoration:none">‹ 뒤로</a><a href="../index.html">‹ 메인</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>

<h2>동물의 숲 말풍선</h2>
<p class="ps-sub">9:16 투명 PNG · 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="view" id="view"><div class="chk" id="chk"><div id="stage">
<div id="grp"><div class="tag" id="vName"></div>
<div class="bub"><p id="vTxt"></p><i class="arr" id="vArr"></i></div></div>
</div></div></div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>동물의 숲 말풍선 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>이름<input id="iName"></label>
<label>대사 (줄바꿈 반영)<textarea id="iTxt" rows="4"></textarea></label>

</div>

</div>
</div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div>

</div>
