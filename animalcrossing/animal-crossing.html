<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>animal-crossing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="animal-crossing.css">
</head><body>
<main class="wrap">
<section class="card"><div class="lbl">Live Preview · 9:16 투명 PNG</div>
<div class="view" id="view"><div class="chk"><div id="stage">
<div id="grp"><div class="tag" id="vName"></div>
<div class="bub"><p id="vTxt"></p><i class="arr" id="vArr"></i></div></div>
</div></div></div></section>
<section class="card ed"><div class="lbl">Edit Panel</div><h2>동물의 숲 말풍선 수정</h2>
<label>이름<input id="iName"></label>
<label>대사 (줄바꿈 반영)<textarea id="iTxt" rows="4"></textarea></label>
<div class="row"><label>말풍선<input id="iBub" type="color"></label><label>이름표<input id="iAc" type="color"></label><label>글자<input id="iCol" type="color"></label></div>
<label>세로 위치 <span id="pY"></span><input id="iY" type="range" min="10" max="85"></label>
<label>글자 크기 <span id="pS"></span><input id="iS" type="range" min="40" max="90"></label>
<label class="tg"><input id="iA" type="checkbox"> ▼ 표시</label>
<div class="acts"><button id="save">PNG 저장</button><button id="reset" class="g">초기화</button></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="animal-crossing.js"></script>
</body></html>
