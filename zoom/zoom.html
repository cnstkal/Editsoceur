<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoom 화면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="zoom.css">
<style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style>
<link rel="stylesheet" href="../ps-editor.css?v=9"></head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><span></span><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>Zoom 화면</h2>
<p class="ps-sub">16:9 화면을 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame" id="frame"><div class="zw" id="zw">
<div class="zs" id="zoom">
  <div class="top">
    <div class="logo"><small>zoom</small><b>Workplace</b></div>
    <span class="login" id="vLogin">로그인</span>
    <svg class="shield" viewBox="0 0 24 24"><path d="M12 1.500 3 5v6c0 5.500 3.800 10 9 11.500 5.200-1.500 9-6 9-11.500V5z" fill="#1fd35f"/><path d="m7.500 12 3.200 3.200L16.800 9" fill="none" stroke="#000" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="view">보기</span>
    <svg class="grid" viewBox="0 0 16 12" fill="#fff"><rect x="0" y="0" width="4.500" height="5" rx="1"/><rect x="5.800" y="0" width="4.500" height="5" rx="1"/><rect x="11.500" y="0" width="4.500" height="5" rx="1"/><rect x="0" y="6.500" width="4.500" height="5" rx="1"/><rect x="5.800" y="6.500" width="4.500" height="5" rx="1"/><rect x="11.500" y="6.500" width="4.500" height="5" rx="1"/></svg>
    <svg class="wc" style="left:2393px" viewBox="0 0 20 20" stroke="#fff" stroke-width="1.600" fill="none"><path d="M3 10h14"/></svg>
    <svg class="wc" style="left:2462px" viewBox="0 0 20 20" stroke="#fff" stroke-width="1.600" fill="none"><rect x="3" y="6" width="10" height="10" rx="1.500"/><path d="M7 6V4.500A1.500 1.500 0 0 1 8.500 3H15.500A1.500 1.500 0 0 1 17 4.500V11.500A1.500 1.500 0 0 1 15.500 13H13"/></svg>
    <svg class="wc" style="left:2531px" viewBox="0 0 20 20" stroke="#fff" stroke-width="1.600" fill="none"><path d="m4 4 12 12M16 4 4 16"/></svg>
  </div>
  <div class="vid" id="v0" style="left:82px"><div class="tag"><svg viewBox="0 0 24 24" class="mi"><use href="#mic"/></svg><span id="vN0"></span></div></div>
  <div class="vid" id="v1" style="left:1294px"><div class="tag"><svg viewBox="0 0 24 24" class="mi"><use href="#mic"/></svg><span id="vN1"></span></div></div>
  <div class="bar"></div>
  <svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="mic" viewBox="0 0 24 24"><g fill="none" stroke="#ff3366" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" stroke="#ff7f9f"/><path d="M5.500 11.500a6.500 6.500 0 0 0 13 0M12 18v3" stroke="#ff7f9f"/><path d="M4 21 20 3"/></g></symbol>
  </defs></svg>
  <div class="tb" style="left:91px" id="tbA"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="6" width="12" height="22" rx="6"/><path d="M11 22a13 13 0 0 0 26 0M24 35v8M17 43h14"/><path class="sl" d="M8 44 40 4" stroke="#ff2d6a" stroke-width="3.400"/></svg><span>오디오</span></div>
  <i class="car" style="left:139px"></i>
  <div class="tb" style="left:231px" id="tbV"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.600" stroke-linejoin="round"><rect x="5" y="13" width="26" height="22" rx="4"/><path d="m31 21 11-6v18l-11-6"/><path class="sl" d="M8 44 40 4" stroke="#ff2d6a" stroke-width="3.400" stroke-linecap="round"/></svg><span>비디오</span></div>
  <i class="car" style="left:287px"></i>
  <div class="tb" style="left:993px"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round"><circle cx="17" cy="14" r="6"/><circle cx="33" cy="17" r="5"/><path d="M5 37v-3a8 8 0 0 1 8-8h8a8 8 0 0 1 8 8v3zM33 26h3a8 8 0 0 1 8 8v3h-8"/></svg><em id="vCnt">2</em><span>참가자</span></div>
  <i class="car" style="left:1074px"></i>
  <div class="tb" style="left:1159px"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.600" stroke-linejoin="round"><path d="M8 24C8 14 15 7 24 7s16 7 16 16-7 16-16 16H9l4-6A15 15 0 0 1 8 24z"/><circle cx="17" cy="24" r="1.600" fill="#fff"/><circle cx="24" cy="24" r="1.600" fill="#fff"/><circle cx="31" cy="24" r="1.600" fill="#fff"/></svg><span>채팅</span></div>
  <i class="car" style="left:1210px"></i>
  <div class="tb" style="left:1288px"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.600" stroke-linejoin="round"><path d="M24 40S6 30 6 18a10 10 0 0 1 18-6 10 10 0 0 1 18 6c0 12-18 22-18 22z"/></svg><span>반응</span></div>
  <div class="tb" style="left:1422px"><svg viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="5" fill="#00e589"/><path d="M24 36V16M15 24l9-9 9 9" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>공유</span></div>
  <i class="car" style="left:1479px"></i>
  <div class="tb" style="left:1557px"><svg viewBox="0 0 48 48"><path d="M24 5 8 11v12c0 10 7 17 16 21 9-4 16-11 16-21V11z" fill="none" stroke="#fff" stroke-width="2.600" stroke-linejoin="round"/><path d="M24 11 14 15v8c0 6 4 11 10 14z" fill="#fff"/><circle cx="29" cy="19" r="3" fill="#fff"/></svg><span>호스트 도구</span></div>
  <div class="tb" style="left:1678px"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.600"><path d="M8 17V12a4 4 0 0 1 4-4h5M31 8h5a4 4 0 0 1 4 4v5M8 31v5"/><circle cx="35" cy="14" r="5.500"/><circle cx="12" cy="38" r="5.500"/><path d="M26 40h10a4 4 0 0 0 4-4v-9"/></svg><span>앱</span></div>
  <i class="car" style="left:1720px"></i>
  <div class="tb" style="left:1803px"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="none" stroke="#fff" stroke-width="2.600"/><circle cx="16" cy="24" r="2.200" fill="#fff"/><circle cx="24" cy="24" r="2.200" fill="#fff"/><circle cx="32" cy="24" r="2.200" fill="#fff"/></svg><span>더 보기</span></div>
  <div class="tb" style="left:2518px"><svg viewBox="0 0 48 48"><path d="M16 6h16l11 18-11 18H16L5 24z" fill="#000" stroke="#ff2d55" stroke-width="3" stroke-linejoin="round"/><path d="m18 18 12 12M30 18 18 30" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg><span>종료</span></div>
</div>
</div></div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>Zoom 내용 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>참가자 1 이름<input id="iN0"></label>
<label>참가자 2 이름<input id="iN1"></label>
<label>참가자 수<input id="iCnt"></label>
<label>상단 텍스트<input id="iLogin"></label>
</div>
<div class="ps-pn" data-t="이미지" hidden>
<label>참가자 1 영상<input id="iP0" type="file" accept="image/*"></label>
<label>참가자 2 영상<input id="iP1" type="file" accept="image/*"></label>
<button class="ps-ghost" id="clearPics" type="button">그린스크린으로 되돌리기</button>
<label>배경 색상<input id="iGs" type="color"></label>
</div>
<div class="ps-pn" data-t="기타" hidden>
<div class="ps-tg"><span>참가자 1 음소거</span><label class="sw"><input id="iM0" type="checkbox"><i></i></label></div>
<div class="ps-tg"><span>참가자 2 음소거</span><label class="sw"><input id="iM1" type="checkbox"><i></i></label></div>
<div class="ps-tg"><span>내 오디오 꺼짐</span><label class="sw"><input id="iA" type="checkbox"><i></i></label></div>
<div class="ps-tg"><span>내 비디오 꺼짐</span><label class="sw"><input id="iV" type="checkbox"><i></i></label></div>
</div>
</div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div>
</section>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="zoom.js"></script>
</body>
</html>
