<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../nozoom.js?v=1"></script>
<title>음악 가사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="lyrics.css?v=1">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=2">
<link rel="stylesheet" href="../ps-editor.css?v=10"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>음악 가사</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div id="mf">
  <i class="mh"></i>
  <div class="mt">
    <i class="art" id="mArt"></i>
    <div class="mi"><b id="mT"></b><span id="mA"></span></div>
    <span class="mb"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.800" stroke-linejoin="round"><path d="m12 3.500 2.600 5.400 5.900.8-4.300 4.100 1 5.800L12 16.800l-5.200 2.800 1-5.800L3.500 9.700l5.900-.8z"/></svg></span>
    <span class="mb"><svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><circle cx="5.500" cy="12" r="1.700"/><circle cx="12" cy="12" r="1.700"/><circle cx="18.500" cy="12" r="1.700"/></svg></span>
  </div>
  <div class="ml" id="mL"></div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>음악 가사 내용 수정</h2><div class="ps-edwrap"><section class="editor">
  <h2>가사 화면 편집</h2>
  <div class="row"><label>곡 제목<input id="iT"></label><label>아티스트<input id="iA"></label></div>
  <label class="file">앨범 이미지<input id="iArt" type="file" accept="image/*"></label>
  <div class="musicbox"><div class="trow"><span>앨범 이미지에서 색 자동 추출</span><label class="sw"><input id="iAuto" type="checkbox"><i></i></label></div></div>
  <div class="row"><label>위쪽 색<input id="iC1" type="color" style="padding:2px;height:44px"></label><label>아래쪽 색<input id="iC2" type="color" style="padding:2px;height:44px"></label><label>포인트 색<input id="iC3" type="color" style="padding:2px;height:44px"></label></div>
  <label>현재 재생 중인 줄 번호(1부터)<input id="iAct" type="number" min="1"></label>
  <div class="musicbox"><div class="trow"><span>점점 흐려지는 효과</span><label class="sw"><input id="iFd" type="checkbox"><i></i></label></div></div>
  <h2 style="margin-top:14px">가사</h2><div id="el"></div>
  <button class="ghost" id="addR" type="button">+ 줄 추가</button>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="lyrics.js?v=2"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
