<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>플레이리스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="playlist.css?v=2">
<link rel="stylesheet" href="../ps-editor.css?v=12">
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html" style="color:#0095f6;font-weight:600;font-size:15px;text-decoration:none">‹ 뒤로</a><span class="ps-brand">플레이리스트 스튜디오</span><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">

<section class="ps-card ps-main">
<div class="ps-lbl">라이브 미리보기</div>
<h2>플레이리스트</h2>
<p class="ps-sub">9:16 투명 PNG · 오른쪽에서 바로 수정해요</p>
<div class="ps-stage" id="stage"><div class="fit" id="fit"><div class="fr">

<div id="cap"><div class="card">
  <div class="nav"><span class="bk"><svg width="9" height="15" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 1 2 10l8 9"/></svg>플레이리스트</span><span>편집</span></div>
  <div class="hd">
    <div class="cv ph" id="vCv"></div>
    <div class="inf">
      <div><b id="vTitle"></b><em id="vOwner"></em><span id="vUp"></span></div>
      <div class="dl"><small>다운로드됨</small><u><svg width="12" height="12" viewBox="0 0 12 12" fill="#fff"><circle cx="2" cy="6" r="1.1"/><circle cx="6" cy="6" r="1.1"/><circle cx="10" cy="6" r="1.1"/></svg></u></div>
    </div>
  </div>
  <div class="bt">
    <div><svg width="10" height="11" viewBox="0 0 10 11" fill="currentColor"><path d="M0 0v11l10-5.500z"/></svg>재생</div>
    <div><svg width="14" height="12" viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h5c5 0 6 10 11 10h4M2 15h5c1.500 0 2.600-.8 3.500-2M14 7c1-1.200 2.200-2 4-2h4M19 1l3 4-3 4M19 11l3 4-3 4"/></svg>셔플</div>
  </div>
  <ul id="vList"></ul>
</div></div>

</div></div></div>
</section>

<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>플레이리스트 수정</h2>
<div class="ps-seg" id="seg"><button class="on" type="button">기본</button><button type="button">곡</button></div>
<div class="editor">
  <div class="pn">
    <label>플레이리스트 이름<input id="iTitle"></label>
    <label>만든 사람<input id="iOwner"></label>
    <label>업데이트 문구<input id="iUp"></label>
    <label>대표 커버<input id="iCover" type="file" accept="image/*"></label>
    <button class="ghost" id="clrCover" type="button">대표 커버 기본으로</button>
  </div>
  <div class="pn" hidden>
    <label>공통 앨범 커버<input id="iScov" type="file" accept="image/*"></label>
    <button class="ghost" id="clrScov" type="button">공통 커버 기본으로</button>
    <div id="sList"></div>
    <button class="addc" id="addSong" type="button">+ 곡 추가 (최대 9곡)</button>
  </div>
</div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div>
</section>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="playlist.js?v=2"></script>
<script src="../upl.js?v=4" defer></script></body>
</html>
