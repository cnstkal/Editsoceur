<style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head><body class="studio">
<div class="ps-wrap">

<div class="ps-grid">

<h2>Camera</h2>
<p class="ps-sub">오른쪽에서 바로 수정해요</p>

 <svg id="tm" viewBox="0 0 70 70"><circle cx="35" cy="35" r="31" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="2 7" stroke-linecap="round"/><circle cx="35" cy="35" r="17" fill="none" stroke="#fff" stroke-width="5"/><path d="M12 12 58 58" stroke="#000" stroke-width="12"/><path d="M12 12 58 58" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>
 <div id="zm"></div>

 <div class="btn" id="thumb"></div>

 <div id="cap"><div id="modes"></div></div>
</div></div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>Camera 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>줌<select id="iZoom"><option value="0">.5</option><option value="1" selected>1×</option><option value="2">2</option><option value="3">3</option></select></label>
<label>모드<select id="iMode"><option value="0">비디오</option><option value="1" selected>사진</option><option value="2">인물 사진</option></select></label>
<label>그리드<input id="iGrid" type="checkbox" checked></label>

<div class="upl"><div class="upl-th"><img alt=""><span>없음</span></div><div class="upl-body"><span class="upl-label">갤러리 썸네일</span><b class="upl-name">선택된 파일 없음</b><label class="upl-btn">변경<input id="iTh" type="file" accept="image/*"></label><button class="upl-del" id="iTh_del" type="button">삭제</button></div></div>
</div>
</div></div>

</section>
</div>
</div>
