<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>갤러리 공유</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="gallery.css?v=2">
<link rel="stylesheet" href="../ps-editor.css?v=10">
<style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html" style="color:#0095f6;font-weight:600;font-size:15px;text-decoration:none">‹ 뒤로</a><span></span><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">미리보기</div>
<h2>갤러리 공유 시트</h2><p class="ps-sub">실제 화면을 확인하고 오른쪽에서 수정해요</p>
<div class="stage"><div id="snap">
<div class="hd">
<img class="th" id="vTh">
<div class="tt"><b id="vCnt"></b><span><i>▼</i> <em id="vLoc"></em></span><u>옵션 <svg width="6" height="9" viewBox="0 0 6 9" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 3.500 3.500L1 8"/></svg></u></div>
<div class="x"><svg width="12" height="12" viewBox="0 0 12 12" stroke="#ddd" stroke-width="1.8" stroke-linecap="round"><path d="m1 1 10 10M11 1 1 11"/></svg></div>
</div>
<div class="car" id="car"></div>
<div class="ppl" id="ppl"></div>
<hr>
<div class="apps">
<div><svg viewBox="0 0 48 48"><defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ac8fa"/><stop offset="1" stop-color="#0a6cf0"/></linearGradient></defs><rect width="48" height="48" rx="11" fill="url(#gA)"/><g fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round"><path d="M14 30a13 13 0 0 1 20 0"/><path d="M18 26a7.500 7.500 0 0 1 12 0"/></g><circle cx="24" cy="23" r="3" fill="#fff"/></svg><span>에어드롭</span></div>
<div><img src="../notifications/images/imessage/ios-message.svg" alt=""><span>메시지</span></div>
<div><svg viewBox="0 0 48 48"><defs><linearGradient id="gM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6cc4ff"/><stop offset="1" stop-color="#1a73e8"/></linearGradient></defs><rect width="48" height="48" rx="11" fill="url(#gM)"/><rect x="11" y="14" width="26" height="20" rx="3.500" fill="#fff"/><path d="m12 16 12 9 12-9" fill="none" stroke="#1a73e8" stroke-width="2.400" stroke-linejoin="round"/></svg><span>메일</span></div>
<div><svg viewBox="0 0 48 48"><defs><linearGradient id="gN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff9c4"/><stop offset="1" stop-color="#fff3a0"/></linearGradient></defs><rect width="48" height="48" rx="11" fill="url(#gN)"/><path d="M0 11a11 11 0 0 1 11-11h26a11 11 0 0 1 11 11v3H0z" fill="#f2b600"/><g stroke="#c9b458" stroke-width="1.200"><path d="M10 22h28M10 29h28M10 36h20"/></g></svg><span>메모</span></div>
</div>
</div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">편집 패널</div><h2>공유 시트 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<div class="row"><label>선택 장수<input id="iCnt" type="number" min="1" max="99"></label><label>인원 수 (0~5)<input id="iNp" type="number" min="0" max="5"></label></div>
<label>위치 문구<input id="iLoc"></label>
<label class="tg">메시지 배지<input id="iBd" type="checkbox"></label>
</div>
<div class="ps-pn" data-t="이미지" hidden>
<label class="f">썸네일<input id="iTh" type="file" accept="image/*"></label><button class="upl-del" id="iTh_del" type="button">삭제</button>
<label class="f">사진 왼쪽<input data-p="0" class="iPh" type="file" accept="image/*"></label>
<label class="f">사진 가운데<input data-p="1" class="iPh" type="file" accept="image/*"></label>
<label class="f">사진 오른쪽<input data-p="2" class="iPh" type="file" accept="image/*"></label>
<div id="pEd"></div>
</div>
</div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="save" type="button">PNG 저장</button></div>
</section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="gallery.js?v=2"></script>
</body>
</html>
