<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>사진</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="photos.css?v=1">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=3">
<link rel="stylesheet" href="../ps-editor.css?v=5"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>사진</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div id="pf">
<div class="pt" id="pT"></div>
<div class="pn" id="pN"></div>
<i class="pbt pf1"><svg viewBox="0 0 36 24" style="width:6.1cqw"><path d="M2 3h32M8 12h20M14 21h8" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/></svg></i>
<i class="pbt pf2">선택</i>
<div class="pg"><div class="pgi" id="pG"></div></div>
<div class="ptb" id="bottomTabs">
<div class="pti on" id="pA"><svg viewBox="0 0 46 38" style="width:7.3cqw"><rect x="1" y="1" width="33" height="25" rx="6" fill="currentColor"/><rect x="11" y="10" width="34" height="26" rx="6" fill="currentColor" stroke="#eeeef0" stroke-width="2.400"/><circle cx="21" cy="19" r="3" fill="#fff"/><path d="M13 34l9-8.500 6 5 5-5 9 8.500z" fill="#fff"/></svg><em>보관함</em></div>
<div class="pti" id="pB"><svg viewBox="0 0 30 32" style="width:6.2cqw"><path d="M7 2h16M4 7h22" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"/><rect x="1" y="11" width="28" height="20" rx="5" fill="currentColor"/></svg><em>모음</em></div><div class="pti" id="pC"><svg viewBox="0 0 26 26" style="width:5.8cqw"><circle cx="10.500" cy="10.500" r="8" fill="none" stroke="currentColor" stroke-width="3"/><path d="m16.500 16.500 7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><em>검색</em></div>
</div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>사진 내용 수정</h2><div class="ps-edwrap"><section class="editor">
<div class="ps-pn" data-t="기본">
<h2>사진 앱 편집</h2>
<div class="row"><label>항목 수 문구<input id="iN"></label></div>
<div class="musicbox"><div class="trow"><span>하단 바 표시</span><label class="sw"><input id="iNav" type="checkbox"><i></i></label></div></div><div class="row"><label>선택된 하단 탭<select id="iTab"><option value="0">보관함</option><option value="1">모음</option></select></label><label class="xk"><input type="checkbox" id="iCut"> 첫 줄 위쪽 잘림(스크롤)</label></div>
</div>
<div class="ps-pn" data-t="이미지" hidden><div class="row"><label class="file">사진 추가(여러 장)<input type="file" accept="image/*" multiple id="iP"></label></div>
<div id="plist"></div>
</div>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="photos.js?v=1"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
</body>
</html>
