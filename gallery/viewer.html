<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진 보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>body{margin:0;padding:20px;background:#f2f3f5;font-family:Pretendard,sans-serif}main{max-width:390px;margin:auto}#sc{width:100%;height:auto;display:block;box-shadow:0 2px 12px #0002}label{display:block;margin-top:14px;font-weight:600}input{display:block;width:100%;box-sizing:border-box;margin-top:6px;font-size:16px}button{margin-top:16px;width:100%;height:46px;border:0;border-radius:12px;background:#111;color:#fff;font-size:15px}a{color:#0095f6;text-decoration:none}</style></head>
<body><main><p><a href="index.html">‹ 뒤로</a></p>

34 2247v32"/></g><circle cx="589" cy="2243" r="5"/></svg>
<label>사진<input id="iP" type="file" accept="image/*"></label><button id="del" type="button">사진 비우기</button>
<label>날짜<input id="iD" value="오늘"></label><label>시간<input id="iT" value="오후 2:42"></label>
<button id="save" type="button">PNG 저장</button></main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
$('iP').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('ph').setAttribute('href',r.result)};r.readAsDataURL(f)};
$('del').onclick=function(){$('ph').removeAttribute('href');$('iP').value=''};
$('iD').oninput=function(){$('vD').textContent=this.value};
$('iT').oninput=function(){$('vT').textContent=this.value};
$('save').onclick=function(){
var im=new Image();
im.onload=function(){setTimeout(function(){var c=document.createElement('canvas');c.width=1179;c.height=2556;c.getContext('2d').drawImage(im,0,0);var a=document.createElement('a');a.download='photo-viewer.png';a.href=c.toDataURL('image/png');a.click()},200)};
im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString($('sc')));
};
})();
</script></body></html>
