<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사진 상세</title>
<link rel="stylesheet" href="detail.css?v=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=2">
</head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>사진 상세</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<a class="tback" href="index.html" data-html2canvas-ignore>‹ 선택화면</a>
<div class="phone" id="cap">
  <div class="stage" id="stage"></div>
  <header class="top">
    <div class="c" id="bBack"></div>
    <div class="dp"><b id="vDate"></b><span id="vTime"></span></div>
    <div class="c" id="bMore"></div>
  </header>
  <footer class="bot">
    <div class="c" id="bShare"></div>
    <div class="mid" id="bMid"></div>
    <div class="c" id="bTrash"></div>
  </footer>
</div>


</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>사진 상세 내용 수정</h2><div class="ps-edwrap"><section class="editor">
  <h2>사진 상세 편집</h2>
  <div class="r2"><label>날짜<input id="iDate"></label><label>시간<input id="iTime"></label></div>
  <label>흰 영역 모드
    <select id="iMode"><option value="photo">사진 넣기</option><option value="green">그린스크린</option><option value="white">흰색(비움)</option></select>
  </label>
  <div class="r2"><label>사진 맞춤<select id="iFit"><option value="contain">전체 보이게</option><option value="cover">꽉 채우기</option></select></label>
  <label>그린스크린 색<input id="iGreen" type="color" value="#00ff00"></label></div>
  <label class="file">사진 올리기<input id="iImg" type="file" accept="image/*"></label>
  <button type="button" class="ghost" id="rmImg">사진 빼기</button>
</section></div><div class="ps-acts"><button id="save" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="detail.js?v=1"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
</body>
</html>
