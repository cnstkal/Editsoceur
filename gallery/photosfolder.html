<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>갤러리 폴더</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="photosfolder.css?v=2">
<link rel="stylesheet" href="../ps-editor.css?v=10">
<style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body>
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html" style="color:#0095f6;font-weight:600;font-size:15px;text-decoration:none">‹ 뒤로</a><span></span><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>갤러리 폴더</h2><p class="ps-sub">실제 앱 화면을 확인하고 오른쪽에서 수정해요</p>
<div class="stage"><div id="snap">
<h1 id="vT"></h1>
<div class="st"><svg width="11" height="8" viewBox="0 0 22 15"><path d="M5 15a5 5 0 0 1-.6-10A7 7 0 0 1 18 6a4.500 4.500 0 0 1-.5 9z" fill="#8a8f98"/></svg><span id="vS"></span></div>
<div class="fb"><svg width="13" height="11" viewBox="0 0 13 11" stroke="#111" stroke-width="1.800" stroke-linecap="round"><path d="M1 1.500h11M2.500 5.500h8M4.500 9.500h4"/></svg></div>
<img class="av" id="vA">
<div class="sec" style="top:71px">추억<svg viewBox="0 0 7 11"><path d="m1.500 1.500 4 4-4 4"/></svg></div>
<div class="row mem" id="rM"></div>
<div class="sec" style="top:261px">고정<svg viewBox="0 0 7 11"><path d="m1.500 1.500 4 4-4 4"/></svg></div>
<div class="row til" id="rP" style="top:284px"></div>
<div class="sec" style="top:373px">앨범<svg viewBox="0 0 7 11"><path d="m1.500 1.500 4 4-4 4"/></svg></div>
<div class="row til" id="rA" style="top:396px"></div>
</div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div><h2>폴더 화면 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>제목<input id="iT"></label>
<label>저장 공간 문구<input id="iS"></label>
<div class="musicbox"><div class="trow"><span>저장 공간 정보 표시</span><label class="sw"><input id="iSOn" type="checkbox"><i></i></label></div></div>
</div>
<div class="ps-pn" data-t="이미지" hidden>
<label class="f">프로필 사진<input id="iA" type="file" accept="image/*"></label>
<div id="ed"></div>
</div>
</div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="save" type="button">PNG 저장</button></div>
</section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="photosfolder.js?v=2"></script>
</body>
</html>
