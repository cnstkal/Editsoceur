<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>갤러리 폴더</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="photosfolder.css?v=1">
</head>
<body>
<div class="wrap">
<section class="card main">
<div class="lbl">Live Preview</div>
<h2>갤러리 폴더</h2>
<div class="stage"><div id="snap">
<h1 id="vT"></h1>
<div class="st"><svg width="11" height="8" viewBox="0 0 22 15"><path d="M5 15a5 5 0 0 1-.6-10A7 7 0 0 1 18 6a4.500 4.500 0 0 1-.5 9z" fill="#fff"/></svg><span id="vS"></span></div>
<div class="fb"><svg width="13" height="11" viewBox="0 0 13 11" stroke="#fff" stroke-width="1.800" stroke-linecap="round"><path d="M1 1.500h11M2.500 5.500h8M4.500 9.500h4"/></svg></div>
<img class="av" id="vA">
<div class="sec" style="top:71px">Memories<svg viewBox="0 0 7 11"><path d="m1.500 1.500 4 4-4 4"/></svg></div>
<div class="row mem" id="rM"></div>
<div class="sec" style="top:261px">Pinned<svg viewBox="0 0 7 11"><path d="m1.500 1.500 4 4-4 4"/></svg></div>
<div class="row til" id="rP" style="top:284px"></div>
<div class="sec" style="top:373px">Albums<svg viewBox="0 0 7 11"><path d="m1.500 1.500 4 4-4 4"/></svg></div>
<div class="row til" id="rA" style="top:396px"></div>
</div></div>
</section>
<section class="card side">
<div class="lbl">Edit Panel</div>
<h2>폴더 화면 수정</h2>
<label>제목<input id="iT"></label>
<label>스토리지 문구<input id="iS"></label>
<label class="f">프로필 사진<input id="iA" type="file" accept="image/*"></label>
<div id="ed"></div>
<div class="acts"><button id="reset" type="button">초기화</button><button id="save" type="button">PNG 저장</button></div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="photosfolder.js?v=1"></script>
</body>
</html>
