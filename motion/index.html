<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>알림 모션</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:#e9eaee;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.02em}
.phone{position:relative;width:min(92vw,390px);aspect-ratio:9/19.5;border-radius:54px;background:#000;padding:10px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.scr{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:linear-gradient(160deg,#6a8cff,#b06ad8 55%,#ff9a8b)}
.isl{position:absolute;top:11px;left:50%;width:34%;height:30px;margin-left:-17%;border-radius:20px;background:#000;z-index:9}
.clock{position:absolute;top:70px;width:100%;text-align:center;color:#fff}
.clock b{display:block;font-size:76px;font-weight:600;line-height:1}.clock span{font-size:18px;opacity:.85}
/* 알림 배너 */
.ban{position:absolute;z-index:8;left:10px;right:10px;top:10px;display:flex;gap:11px;align-items:center;padding:12px 14px;border-radius:30px;background:rgba(245,245,247,.82);backdrop-filter:blur(24px);box-shadow:0 8px 30px rgba(0,0,0,.25);transform:translateY(-140%) scale(.9);opacity:0;animation:ban 7s infinite}
.ic{flex:none;width:40px;height:40px;border-radius:10px;background:#fee500;display:grid;place-items:center;font-size:22px}
.tx{min-width:0;font-size:14px;line-height:1.3}.tx b{display:block;font-size:14px}.tx i{font-style:normal;color:#333;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx em{margin-left:auto;font-style:normal;font-size:12px;color:#666;align-self:flex-start;flex:none;padding-left:6px}
/* 탭 터치 표시 */
.tap{position:absolute;z-index:10;left:50%;top:56px;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 0 2px rgba(0,0,0,.08);opacity:0;animation:tap 7s infinite}
/* 앱 화면 */
.app{position:absolute;inset:0;z-index:7;background:#9dbfd5;border-radius:44px;clip-path:inset(10px 10px calc(100% - 82px) 10px round 30px);opacity:0;animation:app 7s infinite;display:flex;flex-direction:column}
.ah{margin-top:54px;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:17px;font-weight:600;border-bottom:1px solid rgba(0,0,0,.08)}
.ah u{text-decoration:none;font-weight:400;font-size:22px}
.ch{padding:16px 16px;display:flex;flex-direction:column;gap:7px;font-size:15px}
.ch .b{width:fit-content;max-width:75%;padding:9px 13px;border-radius:16px;background:#fff;opacity:0;transform:translateY(8px);animation:pop 7s infinite}
.ch .b:nth-child(2){animation-delay:.15s}
.ch .m{align-self:flex-end;background:#fee500;animation-delay:.5s}
@keyframes ban{0%,8%{transform:translateY(-140%) scale(.9);opacity:0}
 14%{transform:translateY(0) scale(1.03);opacity:1}17%,50%{transform:translateY(0) scale(1);opacity:1}
 53%{transform:translateY(0) scale(.96);opacity:1}57%,100%{transform:translateY(0) scale(1);opacity:0}}
@keyframes tap{0%,49%{opacity:0;transform:scale(1.4)}51%{opacity:1;transform:scale(1)}56%{opacity:0;transform:scale(.8)}100%{opacity:0}}
@keyframes app{0%,52%{opacity:0;clip-path:inset(10px 10px calc(100% - 82px) 10px round 30px)}
 53%{opacity:1}66%,92%{opacity:1;clip-path:inset(0 0 0 0 round 44px)}97%,100%{opacity:0;clip-path:inset(0 0 0 0 round 44px)}}
@keyframes pop{0%,66%{opacity:0;transform:translateY(8px)}72%,92%{opacity:1;transform:none}97%,100%{opacity:0}}
.hint{position:fixed;bottom:12px;font-size:12px;color:#888}
</style></head><body>
<div class="phone"><div class="scr">
 <div class="isl"></div>
 <div class="clock"><span>11월 25일 수요일</span><b>8:16</b></div>
 <div class="ban"><div class="ic">💬</div><div class="tx"><b>홍중이형</b><i>윤호야 안바쁘면 이따 사거리포차로 올래?</i></div><em>지금</em></div>
 <div class="tap"></div>
 <div class="app">
  <div class="ah"><u>‹</u><span>홍중이형</span><span>☰</span></div>
  <div class="ch"><div class="b">윤호야</div><div class="b">안바쁘면 이따 사거리포차로 올래?</div><div class="b m">저야 좋죠</div></div>
 </div>
</div></div>
<div class="hint">7초 반복 · 알림 → 탭 → 채팅방 열림</div>
</body></html>
