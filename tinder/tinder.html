<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>틴더</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="tinder.css"><link rel="stylesheet" href="../ps-editor.css?v=5"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><b>틴더</b><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>틴더 프로필 카드</h2><p class="ps-sub">실제 앱 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-fit" id="fit"><div class="canvas" id="post">
<div class="photo" id="vPhoto"></div><div class="shade"></div>
<div class="info">
<div class="recent" id="vRecent"><i></i>최근 접속</div>
<div class="nm"><span id="vName"></span> <span id="vAge"></span></div>
<div class="look"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span id="vLook"></span></div>
<div class="goal"><span class="ge" id="vEmoji"></span><span id="vGoal"></span></div>
</div>
<div class="btns">
<b class="s"><svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6"/><path d="M5 14a8 8 0 1 0 2-8L4 10"/></svg></b>
<b class="l"><svg viewBox="0 0 24 24" width="84" height="84" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg></b>
<b class="s"><svg viewBox="0 0 24 24" width="64" height="64" fill="#9db9ea" stroke="#9db9ea" stroke-width="1.6" stroke-linejoin="round"><path d="m12 2.5 2.9 6.2 6.6.7-5 4.5 1.5 6.6L12 17.100l-6 3.400 1.500-6.600-5-4.500 6.600-.7z"/></svg></b>
<b class="l"><svg viewBox="0 0 24 24" width="88" height="88" fill="#e8130f"><path d="M12 21s-9-5.600-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.400-9 12-9 12z"/></svg></b>
<b class="s"><svg viewBox="0 0 24 24" width="56" height="56" fill="#9db9ea"><path d="M21 3 3 9.500l7 2.500 2.500 7z"/></svg></b>
</div></div></div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>프로필 수정</h2>
<div class="editor">
<label>사진<input type="file" id="iPhoto" accept="image/*"></label>
<div class="row"><label>이름<input id="iName"></label><label>나이<input id="iAge"></label></div>
<label class="tg">최근 접속 표시<input type="checkbox" id="iRecent"></label>
<label>찾는 관계 문구<input id="iLook"></label>
<div class="row"><label>이모지<input id="iEmoji"></label><label>관계 목표<input id="iGoal"></label></div>
<label>사진 위치 (세로 %)<input type="range" id="iPos" min="0" max="100"></label>
</div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="tinder.js"></script></body></html>
