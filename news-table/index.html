<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../nozoom.js?v=1"></script>
<title>뉴스 표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../ps-base.css?v=4">
<style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style>
<link rel="stylesheet" href="../ps-editor.css?v=10">
<link rel="stylesheet" href="../ps-shell.css?v=2">
<link rel="stylesheet" href="news-table.css?v=13">
<style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head><body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="../index.html" style="color:#0095f6;font-weight:600;font-size:15px;text-decoration:none">‹ 뒤로</a><a href="../index.html">‹ 메인</a><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>뉴스 표</h2>
<p class="ps-sub">9:16 투명 PNG · 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="view" id="view"><div class="chk"><div id="stage">
<div id="grp"><div class="tag"><i id="vChip"></i><b id="vName"></b><span id="vSub"></span></div>
<div class="bar"><p id="vTxt"></p></div><div class="tick" id="tick"><div id="vTick"></div></div></div>

</div></div></div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>뉴스 표 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>이름<input id="iName"></label>
<label>부제(직함)<input id="iSub"></label>
<label>속보 칩 (비우면 숨김)<input id="iChip"></label>
<label>본문 ([[강조]])<textarea id="iTxt" rows="4"></textarea></label>
<label>하단 티커 (※ 구분)<textarea id="iTick" rows="3"></textarea></label>
<div class="ps-tg"><span>하단 티커 표시</span><label class="sw"><input id="iT" type="checkbox"><i></i></label></div>
</div>
<div class="ps-pn" data-t="스타일">
<label>바 색<input id="iBar" type="color"></label>
<label>강조색<input id="iHi" type="color"></label>
<label>포인트색<input id="iAc" type="color"></label>
<div class="ps-tg"><span>포인트색 표시</span><label class="sw"><input id="iAcOn" type="checkbox"><i></i></label></div>

<label>글자 크기 <span id="pS"></span><input id="iS" type="range" min="36" max="80"></label>
<label>티커 글자 크기 <span id="pTs"></span><input id="iTS" type="range" min="16" max="60"></label>
<label>이름표 크기 <span id="pTg"></span><input id="iTG" type="range" min="50" max="150"></label>
</div>
</div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div>
</section>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="news-table.js?v=13"></script>
<script src="../ps-tabs.js?v=2"></script>
</body></html>
