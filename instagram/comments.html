<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Instagram 댓글</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="comments.css?v=3">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=3">
<link rel="stylesheet" href="../ps-editor.css?v=7"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>인스타그램 댓글</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="wrap">
<div id="cap" class="dim"><div class="sheet">
  <div class="top"><i class="grab"></i><strong>댓글</strong>
    <span class="send"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9" stroke-linejoin="round"><path d="M22 3 2.500 10.300l7.300 3 3 7.200z"/><path d="m9.800 13.300 12.200-10.300"/></svg></span></div>
  <div id="list"></div>
  <div class="emojis"><span>❤️</span><span>🙌</span><span>🔥</span><span>👏</span><span>😢</span><span>😍</span><span>😮</span><span>😂</span></div>
  <div class="inputrow"><div class="me" id="vMe"></div>
    <div class="pill"><span id="vPh"></span>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.800"/><path d="m3 17 5-5 4 4 3-3 6 5"/></svg>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="2.500" y="4.500" width="19" height="15" rx="3.500" stroke="#000" stroke-width="1.8"/><text x="12" y="15.500" font-size="8.500" font-weight="800" text-anchor="middle" fill="#000" font-family="Arial">GIF</text></svg>
    </div></div>
</div></div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>댓글 내용 수정</h2><div class="ps-edwrap"><section class="editor">
  <div class="ps-pn" data-t="기본">
    <label>입력창 아이디<input id="iTarget"></label>
    <label class="file">내 프로필 사진<input id="iMe" type="file" accept="image/*"></label>
  </div>
  <div class="ps-pn" data-t="댓글" hidden>
    <button class="addc" id="add" type="button">+ 새 댓글 추가</button>
    <div id="eList"></div>
  </div>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="comments.js?v=3"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
