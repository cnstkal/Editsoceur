<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><script src="../nozoom.js?v=1"></script>
<title>Instagram 게시물</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css?v=9">
<link rel="stylesheet" href="studio.css?v=9">
<style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style>
<link rel="stylesheet" href="../ps-editor.css?v=10"><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">
  <section class="ps-card ps-main">
    <div class="ps-lbl">Live Preview</div>
    <h2>인스타그램 게시물</h2>
    <p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
    <div class="ps-stage">
      <div class="ps-frame"><div class="phone">
<div id="post">
  <header class="nav">
    <button class="back" aria-label="뒤로"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 1 2 10l8 9"/></svg></button>
    <div class="title"><strong>게시물</strong><span id="vHead"></span></div>
  </header>
  <div class="author">
    <div class="avatar" id="vAvatar"></div>
    <div class="who">
      <div class="name"><span id="vName"></span>
        <svg class="verified" id="vBadge" width="16" height="16" viewBox="0 0 40 40"><path fill="#0095f6" d="M19.998 3.094 14.638 0l-2.972 5.15H5.432v6.354L0 14.64 3.094 20 0 25.359l5.432 3.137v5.905h5.975L14.638 40l5.36-3.094L25.359 40l3.232-5.6h6.162v-6.01L40 25.359 36.905 20 40 14.641l-5.248-3.03v-6.46h-6.419L25.359 0l-5.36 3.094Z"/><path d="M11.5 20.600l6 6 11-12.600" fill="none" stroke="#fff" stroke-width="3.200" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="sub" id="vMusic"><span class="arrow">↗</span> <span id="vMusicTxt"></span></div>
    </div>
    <button class="more" aria-label="더보기"><i></i><i></i></button>
  </div>
  <div class="media" id="media">
    <div class="slides" id="slides"></div>
    <div class="counter" id="counter"></div>
    
  </div>
  <div class="dots" id="dots"></div>
  <div class="actions">
    <button class="act like" id="like"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9" stroke-linejoin="round"><path d="M12 21s-8.500-5.200-8.500-11A4.800 4.800 0 0 1 12 7.200 4.800 4.800 0 0 1 20.500 10c0 5.800-8.500 11-8.500 11z"/></svg><b id="vLike"></b></button>
    <button class="act"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9" stroke-linejoin="round"><path d="M20.700 12a8.700 8.700 0 1 0-4.200 7.400l4.200 1.100-1.100-4.100A8.700 8.700 0 0 0 20.700 12z"/></svg><b id="vCmt"></b></button>
    <button class="act"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg><b id="vRep"></b></button>
    <button class="act"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9" stroke-linejoin="round"><path d="M21.500 3.200 2.800 10.400l6.900 2.700 2.800 7.500z"/><path d="m9.700 13.100 11.800-9.900"/></svg><b id="vShr"></b></button>
    <button class="act save"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9" stroke-linejoin="round"><path d="M5 3h14v18l-7-5.500L5 21z"/></svg></button>
  </div>
  <div class="meta">
    <div class="likedby" id="vLikedRow"><span class="minis" id="vMinis"></span><span id="vLiked"></span></div>
    <div class="cap" id="vCap"></div>
    <div class="ago" id="vDate"></div>
  </div>
</div>
      </div></div>
    </div>
  </section>
  <section class="ps-card ps-side">
    <div class="ps-lbl">Edit Panel</div>
    <h2>게시물 내용 수정</h2>
    <div class="ps-edwrap"><div class="editor">
      <div class="ps-pn" data-t="기본">
        <label>사용자 아이디<input id="iUser"></label>
        <label>게시물 본문 (#해시태그는 파란색, 줄바꿈 반영)<textarea id="iCap" rows="5"></textarea></label>
        <label>게시물 날짜<input id="iDate"></label>
      </div>
      <div class="ps-pn" data-t="이미지" hidden>
        <label>첨부 사진 장수<input id="iCount" type="number" min="1" max="20"></label>
        <div class="ps-pic"><div class="th"></div><div><b id="picTxt">사진 0장</b><span>미리보기에 반영됩니다</span></div></div>
        <label class="ps-addp">+ 사진 추가<input class="ps-sr" id="iPhotos" type="file" accept="image/*" multiple></label>
        <button class="ps-ghost" id="clearPhotos" type="button">첨부 사진 비우기</button>
        <label>프로필 사진<input id="iAvatar" type="file" accept="image/*"></label>
      </div>
      <div class="ps-pn" data-t="상호작용" hidden>
        <div class="row"><label>좋아요 수<input id="iLike"></label><label>댓글 수<input id="iCmt"></label></div>
        <div class="row"><label>리포스트 수<input id="iRep"></label><label>공유 수<input id="iShr"></label></div>
        <label>좋아요 누른 사람 아이디<input id="iLiker"></label>
        <label>좋아요 프로필 표시 개수 (1~3)<input id="iBubN" type="number" min="1" max="3"></label>
        <label>프로필 1<input id="iB0" type="file" accept="image/*"></label>
        <label>프로필 2<input id="iB1" type="file" accept="image/*"></label>
        <label>프로필 3<input id="iB2" type="file" accept="image/*"></label>
      </div>
      <div class="ps-pn" data-t="기타" hidden>
        <div class="ps-tg"><span>인증 배지</span><label class="sw"><input id="iBadge" type="checkbox"><i></i></label></div>
        <div class="ps-tg"><span>음악 표시</span><label class="sw"><input id="iMusicOn" type="checkbox"><i></i></label></div>
        <div class="row"><label>가수<input id="iArtist"></label><label>노래 제목<input id="iSong"></label></div>
      </div>
    </div></div>
    <div class="ps-acts"><button id="savePng" type="button">PNG 저장</button><button id="reset" type="button">초기화</button></div>
  </section>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="img.js?v=2"></script><script src="script.js?v=8"></script>
<script>
(function(){
  var tabs=document.querySelectorAll('#seg button'),pns=document.querySelectorAll('.ps-pn');
  tabs.forEach(function(b,i){b.onclick=function(){tabs.forEach(function(x,j){x.classList.toggle('on',i===j)});pns.forEach(function(p,j){p.hidden=i!==j})}});
  document.getElementById('pvBtn').onclick=function(){var on=document.body.classList.toggle('pvmode');this.textContent=on?'편집 모드':'미리보기 모드'};
  var pt=document.getElementById('picTxt');
  document.getElementById('iPhotos').addEventListener('change',function(){pt.textContent='사진 '+this.files.length+'장 선택됨'});
  document.getElementById('clearPhotos').addEventListener('click',function(){pt.textContent='사진 0장'});
})();
</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
