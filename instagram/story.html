<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Instagram 스토리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="story.css?v=3">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=1">
</head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>인스타그램 스토리</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div id="story">
  <div class="frame" id="frame">
    <div class="empty" id="empty"></div><img class="photo" id="photo" alt="" style="display:none">
    <div class="scrim"></div>
    <div class="bars" id="bars"></div>
    <div class="head">
      <div class="av" id="vAv"></div>
      <span class="nm" id="vNm"></span><svg class="verified" id="vBadge" width="16" height="16" viewBox="0 0 40 40"><path fill="#fff" d="M19.998 3.094 14.638 0l-2.972 5.15H5.432v6.354L0 14.64 3.094 20 0 25.359l5.432 3.137v5.905h5.975L14.638 40l5.36-3.094L25.359 40l3.232-5.6h6.162v-6.01L40 25.359 36.905 20 40 14.641l-5.248-3.03v-6.46h-6.419L25.359 0l-5.36 3.094Z"/><path d="M11.5 20.600l6 6 11-12.600" fill="none" stroke="#262626" stroke-width="3.200" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tm" id="vTm"></span>
      <span class="sp"></span>
      <svg width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round"><path d="M3 5h24M3 13h16"/></svg>
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round"><path d="M4 4l22 22M26 4 4 26"/></svg>
    </div>
  </div>
  <div class="foot">
    <div class="pill" id="vPh"></div>
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.900" stroke-linejoin="round"><path d="M12 21s-8.500-5.200-8.500-11A4.800 4.800 0 0 1 12 7.200 4.800 4.800 0 0 1 20.500 10c0 5.800-8.500 11-8.500 11z"/></svg>
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.900" stroke-linejoin="round"><path d="M22 3 2.500 10.300l7.300 3 3 7.200z"/><path d="m9.800 13.300 12.200-10.300"/></svg>
  </div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>스토리 내용 수정</h2><div class="ps-edwrap"><section class="editor">
  <h2>스토리 편집</h2>
  <label>사용자 아이디<input id="iUser"></label>
  <label>업로드 시간<input id="iTime"></label>
  <label>메시지 입력창 문구<input id="iPh"></label>
    <div class="row"><label>막대 개수<input id="iSeg" type="number" min="1" max="30"></label><label>현재 순서<input id="iCur" type="number" min="1" max="30"></label></div>
  <label>현재 막대 진행률 (%)<input id="iPct" type="number" min="0" max="100"></label>
  <div class="musicbox"><div class="trow"><span>파란딱지(인증 배지)</span><label class="sw"><input id="iBadge" type="checkbox"><i></i></label></div></div>
  <label>사진 확대/축소 (손가락 두 개·마우스 휠도 가능, 드래그로 이동)<input id="iZoom" type="range" min="20" max="500" value="100" style="padding:0"></label>
  <button class="ghost" id="posReset" type="button">사진 위치·크기 초기화</button>
  <p class="hint">사진 위에서 두 손가락을 벌리거나 모으고 비틀어 확대·축소 및 자유 회전할 수 있어요</p>
  <div class="row" style="margin-top:12px"><label class="file">프로필 사진<input id="iAv" type="file" accept="image/*"></label><label class="file">스토리 사진<input id="iPhoto" type="file" accept="image/*"></label></div>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG로 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="story.js?v=4"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
</body>
</html>
