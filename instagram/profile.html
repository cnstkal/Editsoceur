<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Instagram 프로필</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="story.css?v=3">
<link rel="stylesheet" href="profile.css?v=1">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=3">
<link rel="stylesheet" href="../ps-editor.css?v=7"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>인스타그램 프로필</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div id="prof">
  <div class="ph">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4-8 8 8 8"/></svg>
    <span class="un" id="vUn"></span><svg class="vb" id="vBadge" width="22" height="22" viewBox="0 0 40 40"><path fill="#0095f6" d="M19.998 3.094 14.638 0l-2.972 5.15H5.432v6.354L0 14.64 3.094 20 0 25.359l5.432 3.137v5.905h5.975L14.638 40l5.36-3.094L25.359 40l3.232-5.6h6.162v-6.01L40 25.359 36.905 20 40 14.641l-5.248-3.03v-6.46h-6.419L25.359 0l-5.36 3.094Z"/><path d="m11.5 20.600 6 6 11-12.600" fill="none" stroke="#fff" stroke-width="3.200" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="sp"></span>
  </div>
  <div class="top">
    <div class="av" id="vAv"></div>
    <div class="info">
      <div class="nm" id="vNm"></div>
      <div class="stats"><div><b id="vPo"></b><span>게시물</span></div><div><b id="vFr"></b><span>팔로워</span></div><div><b id="vFg"></b><span>팔로잉</span></div></div>
    </div>
  </div>
  <div class="bio" id="vBio"></div>
  <div class="mut" id="vMutBox"><div class="mav" id="vMav"></div><div class="mt" id="vMut"></div></div>
  <div class="btns"><div class="b"><span id="vF1"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 9 7 7 7-7"/></svg></div><div class="b"><span id="vF2"></span></div><div class="b sm"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="8" r="3.500"/><path d="M3.500 20c0-4 3-6 6.500-6M18 13v6M15 16h6"/></svg></div></div>
  <div class="tabs">
    <div class="t on"><svg width="30" height="30" viewBox="0 0 24 24" fill="#000"><rect x="3" y="3" width="4.500" height="4.500" rx=".8"/><rect x="9.800" y="3" width="4.500" height="4.500" rx=".8"/><rect x="16.500" y="3" width="4.500" height="4.500" rx=".8"/><rect x="3" y="9.800" width="4.500" height="4.500" rx=".8"/><rect x="9.800" y="9.800" width="4.500" height="4.500" rx=".8"/><rect x="16.500" y="9.800" width="4.500" height="4.500" rx=".8"/><rect x="3" y="16.500" width="4.500" height="4.500" rx=".8"/><rect x="9.800" y="16.500" width="4.500" height="4.500" rx=".8"/><rect x="16.500" y="16.500" width="4.500" height="4.500" rx=".8"/></svg></div>
    <div class="t"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.800" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m10 8.500 5.500 3.500-5.500 3.500z"/></svg></div>
    <div class="t"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.500h10a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-11a3 3 0 0 1 3-3z"/><circle cx="12" cy="10.500" r="3"/><path d="M6.500 20c.8-3 3-4.500 5.500-4.500s4.700 1.500 5.500 4.500"/></svg></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>프로필 내용 수정</h2><div class="ps-edwrap"><section class="editor">
  <div class="ps-pn" data-t="기본">
    <div class="pf-card"><h3>계정 정보</h3>
      <label>사용자 아이디<input id="iUn"></label><label>이름<input id="iNm"></label>
    </div>
    <div class="pf-card"><h3>프로필 통계</h3>
      <div class="row"><label>게시물<input id="iPo"></label><label>팔로워<input id="iFr"></label><label>팔로잉<input id="iFg"></label></div>
    </div>
    <div class="pf-card"><h3>소개</h3><label class="pf-full">소개<textarea id="iBio" rows="3"></textarea></label>
      <div class="trow"><span>팔로우 문구 표시</span><label class="sw"><input id="iMutOn" type="checkbox"><i></i></label></div>
      <div class="row"><label>아이디 1<input id="iM1"></label><label>아이디 2<input id="iM2"></label><label>추가 인원<input id="iMn" type="number" min="0"></label></div>
    </div>
    <div class="pf-card"><h3>프로필 버튼</h3><div class="row"><label>버튼 1<input id="iF1"></label><label>버튼 2<input id="iF2"></label></div></div>
    <div class="pf-card"><h3>프로필 꾸미기</h3>
      <div class="trow"><span>인증 배지</span><label class="sw"><input id="iBadge" type="checkbox"><i></i></label></div>
      <label class="file pf-full">프로필 사진<input id="iAv" type="file" accept="image/*"></label>
      <div class="pf-friends"><label class="file">친구 1 사진<input data-m="0" type="file" accept="image/*"></label><label class="file">친구 2 사진<input data-m="1" type="file" accept="image/*"></label><label class="file">친구 3 사진<input data-m="2" type="file" accept="image/*"></label></div>
    </div>
    <div class="pf-card"><h3>게시물 그리드</h3><label>게시물 칸 수<input id="iCnt" type="number" min="3" max="30"></label></div>
  </div>
  <div class="ps-pn" data-t="이미지" hidden>
    <div id="pInputs"></div>
  </div>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="profile.js?v=5"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
