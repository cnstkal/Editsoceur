<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Instagram DM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="story.css?v=3">
<link rel="stylesheet" href="dm.css?v=2">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=3">
<link rel="stylesheet" href="../ps-editor.css?v=10"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>인스타그램 DM</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div id="dm">
  <div class="dh">
    <div class="cb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4-8 8 8 8"/></svg></div>
    <div class="hav" id="vHav"></div>
    <div class="ht"><div class="hn"><span id="vNick"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></div><div class="hi" id="vId"></div></div>
    <span class="sp"></span>
    <div class="cb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M6.500 3h3l1.500 4.500-2 1.500a11 11 0 0 0 6 6l1.500-2 4.500 1.500v3A2.500 2.500 0 0 1 18 20C10 20 4 14 4 6a2.500 2.500 0 0 1 2.500-3z"/></svg></div>
    <div class="cb"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><rect x="2.500" y="6" width="13" height="12" rx="3"/><path d="m15.500 10.500 5.500-3v9l-5.500-3z"/></svg></div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="inp">
    <div class="cam"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.200" stroke-linejoin="round"><path d="M3 8.500A2.500 2.500 0 0 1 5.500 6h2L9 4h6l1.500 2h2A2.500 2.500 0 0 1 21 8.500v9a2.500 2.500 0 0 1-2.500 2.500h-13A2.500 2.500 0 0 1 3 17.500z"/><circle cx="12" cy="13" r="3.500"/></svg></div>
    <span class="ph" id="vPh"></span>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.900" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.500 11a6.500 6.500 0 0 0 13 0M12 17.500V21"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.900" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3.500"/><circle cx="9" cy="9" r="1.800"/><path d="m3.500 17 5.500-5 4 4 3-2.500 4.500 4"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.900" stroke-linecap="round" stroke-linejoin="round"><path d="M20.500 12.500V7a3.500 3.500 0 0 0-3.500-3.500H7A3.500 3.500 0 0 0 3.500 7v10A3.500 3.500 0 0 0 7 20.500h5.500z"/><path d="M20.500 12.500 12.500 20.500v-4a4 4 0 0 1 4-4zM8.500 9v1.500M14 9v1.500M8.500 13.500c1 1.200 3 1.200 4 0"/></svg>
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.900" stroke-linecap="round"><circle cx="12" cy="12" r="9.500"/><path d="M12 7.500v9M7.500 12h9"/></svg>
  </div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>DM 내용 수정</h2><div class="ps-edwrap"><section class="editor">
  <div class="ps-pn" data-t="기본">
    <label>상대 이름(닉네임·이모지)<input id="iNick"></label>
    <label>상대 아이디<input id="iId"></label>
    <label>입력창 문구<input id="iPh"></label>
    <label class="file">상대 프로필 사진<input id="iAv" type="file" accept="image/*"></label>
  </div>
  <div class="ps-pn" data-t="채팅" hidden>
    <div id="mlist"></div>
    <div class="row" style="margin-bottom:10px"><button class="ghost" id="addR" type="button">+ 상대 말</button><button class="ghost" id="addS" type="button">+ 나 말</button></div>
    <div class="row"><button class="ghost" id="addP" type="button">+ 사진</button><button class="ghost" id="addV" type="button">+ 릴스</button><button class="ghost" id="addD" type="button">+ 날짜</button></div>
  </div>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="dm.js?v=3"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
