<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Instagram 릴스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="story.css?v=3">
<link rel="stylesheet" href="reels.css?v=1">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style></head>
<body>
<div class="phone">
<div class="navbar" data-html2canvas-ignore><a href="index.html">‹ 선택화면</a></div>
<div id="rl">
  <div class="rlbg" id="rlBg"></div><div class="rlsc"></div>
  <div class="rltop" id="rlTop"><b>릴스</b><b class="dim">친구</b><div class="rlav"><i id="fa0"></i><i id="fa1"></i><i id="fa2"></i></div></div>
  <div class="rlact">
    <div><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.800" stroke-linejoin="round"><path d="M12 21s-8.500-5.200-8.500-11A4.800 4.800 0 0 1 12 7.200 4.800 4.800 0 0 1 20.500 10c0 5.800-8.500 11-8.500 11z"/></svg><span id="c0"></span></div>
    <div><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.800" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 4.500 16.800L21 21l-1.200-4.500A9 9 0 0 0 12 3z"/></svg><span id="c1"></span></div>
    <div><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2.500 3 3-3 3M4 11V9.500a4 4 0 0 1 4-4h12M7 21.500l-3-3 3-3M20 13v1.500a4 4 0 0 1-4 4H4"/></svg><span id="c2"></span></div>
    <div><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.800" stroke-linejoin="round"><path d="M22 3 2.500 10.300l7.300 3 3 7.200z"/><path d="m9.800 13.300 12.200-10.300"/></svg><span id="c3"></span></div>
    <div><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.800" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.500L6 21z"/></svg><span id="c4"></span></div>
    <div><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 8h16M4 15h11"/></svg></div>
  </div>
  <div class="rlbot">
    <div class="rlu"><div class="rlring" id="rlRing"><i id="vAv"></i></div><b id="vUn"></b><span class="rlfw" id="vFw"></span></div>
    <div class="rlcap" id="vCap"></div>
  </div>
  <div class="rlpg"><i id="vPg"></i></div>
  <div class="rlnav">
    <div class="ni"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.900" stroke-linejoin="round"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></div>
    <div class="ni on"><svg width="30" height="30" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="#fff"/><path d="m10 8.500 5.500 3.500-5.500 3.500z" fill="#000" stroke="#000" stroke-width="1.500" stroke-linejoin="round"/></svg></div>
    <div class="ni"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.900" stroke-linejoin="round"><path d="M22 3 2.500 10.300l7.300 3 3 7.200z"/><path d="m9.800 13.300 12.200-10.300"/></svg></div>
    <div class="ni"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.900" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-5-5"/></svg></div>
    <div class="ni"><i class="me" id="vMe"></i></div>
  </div>
</div>
<section class="editor">
  <h2>릴스 편집</h2>
  <label class="file">메인 사진 (비우면 그린스크린)<input id="iPhoto" type="file" accept="image/*"></label>
  <div class="musicbox"><div class="trow"><span>스토리 링 표시</span><label class="sw"><input id="iRing" type="checkbox"><i></i></label></div><div class="trow" style="margin:10px 0 0"><span>상단 릴스·친구 표시</span><label class="sw"><input id="iHd" type="checkbox"><i></i></label></div></div>
  <label>아이디<input id="iUn"></label>
  <div class="musicbox"><div class="trow"><span>팔로우 버튼 표시</span><label class="sw"><input id="iFwOn" type="checkbox"><i></i></label></div></div>
  <label>팔로우 버튼 문구<input id="iFw"></label>
  <label>캡션<input id="iCap"></label>
  <div class="row"><label>좋아요<input id="iC0"></label><label>댓글<input id="iC1"></label><label>리포스트<input id="iC2"></label></div>
  <div class="row"><label>공유<input id="iC3"></label><label>저장<input id="iC4"></label><label>진행률(%)<input id="iPg" type="number" min="0" max="100"></label></div>
  <label class="file">프로필 사진<input id="iAv" type="file" accept="image/*"></label>
  <div class="row" style="margin-top:12px"><label class="file">친구 1<input id="iF0" type="file" accept="image/*"></label><label class="file">친구 2<input id="iF1" type="file" accept="image/*"></label><label class="file">친구 3<input id="iF2" type="file" accept="image/*"></label></div>
  <label class="file">내 프로필(하단 메뉴)<input id="iMe" type="file" accept="image/*"></label>
</section>
</div>
<div class="bar"><button id="savePng" class="primary">PNG로 저장</button><button id="reset" class="secondary">초기화</button></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="reels.js?v=2"></script>
</body>
</html>
