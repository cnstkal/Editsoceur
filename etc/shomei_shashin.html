<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../nozoom.js?v=1"></script>
<title>ID Photo News</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../ps-base.css?v=1">
<link rel="stylesheet" href="../ps-editor.css?v=10">
<link rel="stylesheet" href="../ps-shell.css?v=1">
<link rel="stylesheet" href="shomei_shashin.css?v=2">
</head><body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a href="index.html">‹ Etc</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>ID Photo News</h2>
<p class="ps-sub">9:16 투명 PNG · 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="vp" id="vp">
    <div id="cv">
      <div class="top"><span class="ch"><i></i><b id="vCh"></b></span><span class="tm" id="vTime"></span></div>
      <div class="sheet" id="sheet">
        <div class="photos" id="photos"></div>
        <div class="side">
          <div class="txt">
            <div class="t" id="vTitle"></div>
            <div class="s" id="vSub"></div>
            <div class="n" id="vNote"></div>
          </div>
          <div class="rc"><u>領収書</u><span>年　　月　　日</span></div>
        </div>
      </div>
    </div>
  </div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>ID Photo News 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>채널명<input id="iCh" value="NEWS 24"></label>
<label>시각<input id="iTime" value="LIVE 21:00"></label>
<label>시트 제목<input id="iTitle" value="証明写真"></label>
<label>부제<input id="iSub" value="履歴書・その他証明用"></label>
<label>빨간 안내문<textarea id="iNote" rows="3">ご利用のサイズに合わせてカットしてご利用ください。</textarea></label>
</div>
<div class="ps-pn" data-t="이미지">
<label>사진 모드<select id="iMode"><option value="blue">기본 (파랑 그라데이션)</option><option value="green">그린스크린</option><option value="photo">사진</option></select></label>
<label>전체 적용<input id="iAll" type="file" accept="image/*"></label>
<div id="slots"></div>
</div>
</div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div>
</section>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="shomei_shashin.js?v=2"></script>
<script src="../ps-tabs.js?v=1"></script>
</body></html>
