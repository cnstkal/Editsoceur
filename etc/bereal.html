<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BeReal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="bereal.css">
</head>
<body>
<div class="wrap">
<section class="card main">
<div class="lbl">Live Preview</div>
<h2>BeReal</h2>
<div class="stage"><div id="snap">
<div class="tm" id="vT"></div>
<img class="big" id="vB">
<img class="sm" id="vS">
<svg class="ic" style="left:76px" width="14" height="18" viewBox="0 0 14 18" fill="none" stroke="#fff" stroke-width="1.400" stroke-linejoin="round"><path d="M8.500 1 2 10h4.500L5.500 17 12 8H7.500z"/></svg>
<div class="sh"></div>
<svg class="ic" style="left:181px" width="19" height="19" viewBox="0 0 19 19" fill="none" stroke="#fff" stroke-width="1.400" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8.500A6.800 6.800 0 0 0 3.500 6M3 2.500V6h3.500M3 10.500A6.800 6.800 0 0 0 15.500 13M16 16.500V13h-3.500"/></svg>
</div></div>
</section>
<section class="card side">
<div class="lbl">Edit Panel</div>
<h2>BeReal 수정</h2>
<label>시간<input id="iT"></label>
<label class="f">메인 사진<input id="iB" type="file" accept="image/*"></label>
<label class="f">작은 사진<input id="iS" type="file" accept="image/*"></label>
<div class="acts"><button id="reset" type="button">초기화</button><button id="save" type="button">PNG 저장</button></div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="bereal.js"></script>
</body>
</html>
