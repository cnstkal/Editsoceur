<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>위버스 DM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="weversedm.css?v=1">
</head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>위버스 DM</h2>
<p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="wd" id="wd">
 <div class="sb"><b id="vClock">12:04</b>
  <div class="st"><svg width="20" height="14" viewBox="0 0 20 14" fill="#fff"><rect x="0" y="9" width="3.500" height="5" rx="1"/><rect x="5.500" y="6" width="3.500" height="8" rx="1"/><rect x="11" y="3" width="3.500" height="11" rx="1"/><rect x="16.500" y="0" width="3.500" height="14" rx="1"/></svg><svg width="20" height="15" viewBox="0 0 20 15"><path d="M10 14 7 11a4.300 4.300 0 0 1 6 0zM3.500 7.500a9.500 9.500 0 0 1 13 0l-1.700 1.700a7 7 0 0 0-9.600 0zM.5 4.500a13.700 13.700 0 0 1 19 0l-1.800 1.800a11.200 11.200 0 0 0-15.400 0z" fill="#fff"/></svg><em class="bt"><span id="vBat">35</span></em></div>
 </div>
 <div class="ch" id="ch"></div>
</div>
</div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>위버스 DM 내용 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>상태바 시간<input id="iClock"></label>
<label>배터리 %<input id="iBat" type="number" min="1" max="100"></label>
<label>원문 가리기 문구<input id="iHide"></label>
</div>
<div class="ps-pn" data-t="메시지" hidden>
<label class="col">대화 내용<textarea id="iMsgs" rows="14"></textarea></label>
<p class="hint">@이름 #색상코드 → 새 그룹(프로필+이름) 시작 &nbsp;·&nbsp; 한 줄=말풍선 하나 &nbsp;·&nbsp; 내용 | 시간 (그룹 마지막 말풍선 옆에 표시) &nbsp;·&nbsp; 번역은 한국어 // 번역문</p>
</div>
<div class="ps-pn" data-t="이미지" hidden>
<label class="ps-addp">+ 프로필 사진<input class="ps-sr" id="iAvatar" type="file" accept="image/*"></label>
<button class="ps-ghost" id="clearImg" type="button">기본 프로필로</button>
</div>
<div class="ps-pn" data-t="꾸미기" hidden>
<label>기본 말풍선 색<input id="iColor" type="color" value="#c6eff5"></label>
<div class="ps-tg"><span>번역 줄 표시</span><label class="sw"><input id="iTr" type="checkbox" checked><i></i></label></div>
</div>
</div></div>
<div class="ps-acts"><button id="savePng" type="button">PNG 저장</button><button id="reset" type="button">초기화</button></div>
</section>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="weversedm.js?v=1"></script>
</body>
</html>
