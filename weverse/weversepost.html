<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>위버스 게시글</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="weversepost.css?v=2">
<link rel="stylesheet" href="../ps-editor.css?v=10"><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>위버스 게시글</h2>
<p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="wp" id="wp">
  <div class="hd">
  <svg class="bk" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg>
  <div class="ht"><b>포스트</b><span id="vSub"></span></div>
  <svg class="sh" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.500l7 6-7 6v-3.500c-5 0-8.500 1.500-11 5.500 .8-6.500 4.500-9.500 11-9.500z"/></svg>
 </div>
 <div class="sc"><div class="in" id="in"></div></div>
 </div>
</div></div>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>위버스 게시글 내용 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="기본">
<label>상태바 시간<input id="iClock"></label>
<label>배터리 %<input id="iBat" type="number" min="1" max="100"></label>
<label>상단 서브 문구<input id="iSub"></label>
<label>스크롤 위치(px)<input id="iScroll" type="number" min="0" value="0"></label>
</div>
<div class="ps-pn" data-t="게시글" hidden>
<label>작성자 이름<input id="iName"></label>
<label>작성 날짜<input id="iDate"></label>
<label class="col">본문 (#해시태그는 청록색)<textarea id="iBody" rows="5"></textarea></label>
<div class="row"><label>좋아요 수<input id="iLike"></label><label>댓글 수<input id="iCmt"></label></div>
<div class="ps-tg"><span>작성자 인증 배지</span><label class="sw"><input id="iVer" type="checkbox"><i></i></label></div>
<div class="ps-tg"><span>팔로우 버튼</span><label class="sw"><input id="iFol" type="checkbox" checked><i></i></label></div>
<div class="ps-tg"><span>번역 보기</span><label class="sw"><input id="iTrn" type="checkbox"><i></i></label></div>
</div>
<div class="ps-pn" data-t="댓글" hidden>
<div id="cmList"></div>
<button class="addc" id="addC" type="button">+ 댓글 추가</button>
<textarea id="iCms" hidden></textarea>
</div>
<div class="ps-pn" data-t="이미지" hidden>
<label class="ps-addp">+ 작성자 프로필<input class="ps-sr" id="iAvatar" type="file" accept="image/*"></label>
<label class="ps-addp">+ 아티스트 댓글 프로필<input class="ps-sr" id="iArtAv" type="file" accept="image/*"></label>
<label class="ps-addp">+ 게시글 사진 추가<input class="ps-sr" id="iPhotos" type="file" accept="image/*" multiple></label>
<button class="ps-ghost" id="clearImg" type="button">이미지 모두 비우기</button>
</div>
<div class="ps-pn" data-t="꾸미기" hidden>
<div class="ps-tg"><span>채팅만 저장 (배경 투명)</span><label class="sw"><input id="iChatOnly" type="checkbox"><i></i></label></div>
</div>
</div></div>
<div class="ps-acts"><button id="savePng" type="button">PNG 저장</button><button id="reset" type="button">초기화</button></div>
</section>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="weversepost.js?v=2"></script>
</body>
</html>
