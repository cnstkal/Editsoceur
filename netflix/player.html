<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style></head>

<div class="phone">
<div class="navbar" data-html2canvas-ignore><a href="index.html">‹ 선택화면</a></div>

<section class="editor">
<h2>재생화면 편집</h2>
<div class="row"><label>배경 사진(그린스크린)<input id="iBg" type="file" accept="image/*"></label><label class="xk"><input id="iClr" type="checkbox"> 초록 복원</label></div>
<div class="row"><label>제목<input id="iTi"></label><label>남은 시간<input id="iTm"></label></div>

<label>자막<input id="iSb"></label>
<div class="musicbox"><div class="trow"><span>재생 중(일시정지 아이콘)</span><label class="sw"><input id="iPl" type="checkbox"><i></i></label></div></div>
</section>
</div>
<div class="bar"><button id="savePng" class="primary">PNG로 저장</button><button id="reset" class="secondary">초기화</button></div>
