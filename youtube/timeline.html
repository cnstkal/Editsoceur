<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>유튜브 타임라인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="timeline.css?v=1">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=3">
<link rel="stylesheet" href="../ps-editor.css?v=10"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>유튜브 타임라인</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div id="yf">
<div class="ys">
<span class="yt" id="yTime"></span>
<svg class="ysig" width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="8" width="3.600" height="4" rx="1"/><rect x="5" y="5.500" width="3.600" height="6.500" rx="1"/><rect x="10" y="2.500" width="3.600" height="9.500" rx="1"/><rect x="15" y="0" width="3.600" height="12" rx="1"/></svg>
<svg class="ywf" width="18" height="13" viewBox="0 0 18 13"><path d="M1 4.200C5.400-.2 12.600-.2 17 4.200L15.600 5.600C12 2 6 2 2.400 5.600z"/><path d="M3.700 6.900C6.500 4.300 11.500 4.300 14.300 6.900L12.900 8.300C10.900 6.500 7.100 6.500 5.100 8.300z"/><path d="M9 12.500 6.700 9.900C7.900 8.800 10.100 8.800 11.300 9.900z"/></svg>
<div class="ybt"><i id="yBf"></i><b id="yBt"></b></div>
</div>
<div class="yh">
<svg class="ylg" width="102" height="21" viewBox="0 0 102 21"><rect width="29" height="20" rx="6" fill="#f00"/><path d="M11.800 5.600 19 10l-7.200 4.400z" fill="#fff"/><text x="32" y="19" font-size="24" font-weight="700" textLength="69" lengthAdjust="spacingAndGlyphs" fill="#0f0f0f" font-family="'Roboto Condensed',Roboto,sans-serif">YouTube</text></svg>
<svg class="ybell" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="2.300" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 0 0-12 0c0 6-2.500 7.500-2.500 7.500h17S18 15 18 9zM10 20a2 2 0 0 0 4 0"/></svg>

<svg class="yse" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="2.300" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="7"/><path d="m21 21-5.500-5.500"/></svg>
</div>
<div class="ytabs" id="yTabs"></div>
<div class="yl" id="yL"></div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>유튜브 타임라인 내용 수정</h2><div class="ps-edwrap"><section class="editor">
<div class="ps-pn" data-t="기본">
<div class="row"><label>선택된 탭<select id="iAct"></select></label></div>
<div class="row" style="align-items:center"><label class="file">내 프로필 사진<input id="iMy" type="file" accept="image/*"></label></div>
</div>
<div class="ps-pn" data-t="영상" hidden>
<div id="ylist"></div>
<button class="ghost" id="addV" type="button">+ 영상 추가</button>
</div>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="timeline.js?v=1"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
