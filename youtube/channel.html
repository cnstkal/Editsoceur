<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>유튜브 채널</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="channel.css?v=1">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style></head>
<body>
<div class="phone">
<div class="navbar" data-html2canvas-ignore><a href="index.html">‹ 선택화면</a></div>
<div id="cf">
<div class="cs" id="cS">
<svg class="cbk" width="14" height="20" viewBox="0 0 14 20" fill="none" stroke="#0f0f0f" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="M11.500 1.500 3 10l8.500 8.500"/></svg>
<svg class="cse" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="2.300" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="7"/><path d="m21 21-5.500-5.500"/></svg>
<svg class="cmo" width="6" height="16" viewBox="0 0 6 16" fill="#0f0f0f"><circle cx="3" cy="2.500" r="2.300"/><circle cx="3" cy="8" r="2.300"/><circle cx="3" cy="13.500" r="2.300"/></svg>
<div class="cbn" id="cBn"></div>
<i class="cav" id="cAv"></i>
<div class="cnm" id="cNm"></div>
<div class="chd" id="cHd"></div>
<div class="cmt"><span id="cSu"></span><i class="cdt"></i><span id="cVd"></span></div>
<div class="cds" id="cDs"></div>
<div class="clk"><svg width="17" height="10" viewBox="0 0 17 10" fill="none" stroke="#0f0f0f" stroke-width="1.800" stroke-linecap="round"><path d="M7 1.200H5a3.800 3.800 0 0 0 0 7.600h2M10 1.200h2a3.800 3.800 0 0 1 0 7.600h-2M5.500 5h6"/></svg><span id="cLk"></span></div>
<div class="csb" id="cSb"></div>
<div class="cfd" id="cFd"></div>
<div class="csh">동영상<svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="#0f0f0f" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M1.500 1.500 7.500 7.500l-6 6"/></svg></div>
<div class="cls" id="cL"></div>
</div>
<div class="ccv"></div>
<span class="ct" id="cTime"></span>
<svg class="csg" width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="8" width="3.600" height="4" rx="1"/><rect x="5" y="5.500" width="3.600" height="6.500" rx="1"/><rect x="10" y="2.500" width="3.600" height="9.500" rx="1"/><rect x="15" y="0" width="3.600" height="12" rx="1"/></svg>
<svg class="cwf" width="18" height="13" viewBox="0 0 18 13"><path d="M1 4.200C5.400-.2 12.600-.2 17 4.200L15.600 5.600C12 2 6 2 2.400 5.600z"/><path d="M3.700 6.900C6.500 4.300 11.500 4.300 14.300 6.900L12.900 8.300C10.900 6.500 7.100 6.500 5.100 8.300z"/><path d="M9 12.500 6.700 9.900C7.900 8.800 10.100 8.800 11.300 9.900z"/></svg>
<div class="cbt"><i id="cBf"></i><b id="cBt"></b><svg id="cBz" width="7" height="11" viewBox="0 0 7 11"><path d="M4.500 0 0 6.200h3L2.300 11 7 4.300H4z" fill="#fff"/></svg></div>
<div class="ctf" id="cTf"></div>
<div class="ctb" id="cTb"></div>

</div>
<section class="editor">
<h2>채널 편집</h2>
<h2 style="margin-top:14px">채널 정보</h2>
<div class="ec">
<label>채널 이름<input data-k="nm"></label>
<div class="row"><label>아이디<input data-k="hd"></label><label>구독 버튼<input data-k="sb"></label></div>
<div class="row"><label>구독자<input data-k="su"></label><label>동영상 수<input data-k="vd"></label></div>
<label>설명<input data-k="ds"></label>
<label>링크 문구<input data-k="lk"></label>
<div class="row"><label>선택된 탭<select id="iAct"></select></label><label class="file">배너<input type="file" accept="image/*" data-k="bn"></label><label class="file">프로필 사진<input type="file" accept="image/*" data-k="av"></label></div>
</div>
<h2>대표 영상</h2>
<div class="ec">
<label>제목<input data-k="f.n"></label>
<label>채널명 줄<input data-k="f.ch"></label>
<div class="row"><label>조회수<input data-k="f.vw"></label><label>시간<input data-k="f.time"></label><label>길이<input data-k="f.dur"></label></div>
<div class="row" style="align-items:center"><label class="file">썸네일<input type="file" accept="image/*" data-k="f.th"></label></div>
</div>
<h2>동영상 목록</h2>
<div id="clist"></div>
<button class="ghost" id="addV" type="button">+ 영상 추가</button>
</section>
</div>
<div class="bar"><button id="savePng" class="primary">PNG로 저장</button><button id="reset" class="secondary">초기화</button></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="channel.js?v=1"></script>
</body>
</html>
