<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>유튜브 댓글</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="comments.css?v=1">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style></head>
<body>
<div class="phone">
<div class="navbar" data-html2canvas-ignore><a href="index.html">‹ 선택화면</a></div>
<div id="mf">
<div class="mtop"></div>
<span class="mtm" id="mTime"></span>
<svg class="msg" width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="8" width="3.600" height="4" rx="1"/><rect x="5" y="5.500" width="3.600" height="6.500" rx="1"/><rect x="10" y="2.500" width="3.600" height="9.500" rx="1"/><rect x="15" y="0" width="3.600" height="12" rx="1"/></svg>
<svg class="mwf" width="18" height="13" viewBox="0 0 18 13"><path d="M1 4.200C5.400-.2 12.600-.2 17 4.200L15.600 5.600C12 2 6 2 2.400 5.600z"/><path d="M3.700 6.900C6.500 4.300 11.500 4.300 14.300 6.900L12.900 8.300C10.900 6.500 7.100 6.500 5.100 8.300z"/><path d="M9 12.500 6.700 9.900C7.900 8.800 10.100 8.800 11.300 9.900z"/></svg>
<div class="mbt"><i id="mBf"></i><b id="mBt"></b><svg id="mBz" width="7" height="11" viewBox="0 0 7 11"><path d="M4.500 0 0 6.200h3L2.300 11 7 4.300H4z" fill="#fff"/></svg></div>
<div class="mv" id="mV"><div class="mpg"><i id="mPi"></i></div></div>
<div class="msh"></div>
<i class="mhd"></i>
<div class="mti" id="mTi"></div>
<svg class="min" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="2.100"><circle cx="12" cy="12" r="10"/><text x="12" y="17" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="14" fill="#0f0f0f" stroke="none">i</text></svg>
<svg class="mcx" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#0f0f0f" stroke-width="2.600" stroke-linecap="round"><path d="M2 2l12 12M14 2 2 14"/></svg>
<div class="mc1" id="mC1"></div>
<div class="mc2" id="mC2"></div>
<div class="mln"></div>
<div class="ml" id="mL"></div>
<div class="mcb">
<div class="mip" id="mIp"></div>
<div class="mhb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.900" stroke-linejoin="round"><path d="M12 21.500C5 16.500 2.500 13 2.500 9.200A5 5 0 0 1 12 6.800a5 5 0 0 1 9.500 2.400c0 3.800-2.500 7.300-9.500 12.300z"/><circle cx="12" cy="11.500" r="4.600"/><text x="12" y="14" text-anchor="middle" font-family="Pretendard,sans-serif" font-weight="800" font-size="7" fill="#0f0f0f" stroke="none">$</text></svg></div>
</div>
</div>
<section class="editor">
<h2>댓글 편집</h2>
<div class="row"><label>시간<input data-k="time"></label><label>배터리 %<input data-k="bat"></label></div>
<div class="row" style="align-items:center"><label class="ek"><input type="checkbox" data-k="chg"> 충전 중</label><label class="file">영상 화면<input type="file" accept="image/*" data-k="th"></label></div>
<div class="row"><label>재생 진행률 %<input data-k="pg"></label><label>제목<input data-k="ti"></label></div>
<div class="row"><label>왼쪽 칩<input data-k="c1"></label><label>오른쪽 칩<input data-k="c2"></label><label>선택된 칩<select data-k="act"><option value="0">왼쪽</option><option value="1">오른쪽</option></select></label></div>
<label>입력창 문구<input data-k="ip"></label>
<h2 style="margin-top:14px">댓글</h2>
<div id="mlist"></div>
<button class="ghost" id="addC" type="button">+ 댓글 추가</button>
</section>
</div>
<div class="bar"><button id="savePng" class="primary">PNG로 저장</button><button id="reset" class="secondary">초기화</button></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="comments.js?v=1"></script>
</body>
</html>
