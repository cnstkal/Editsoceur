<div class="ps-pn" data-t="기본">
<h2>기본 설정</h2>
<div class="row"><label class="ek"><input type="checkbox" data-k="chg"> 충전 중</label></div>
<div class="row"><label>제목<input data-k="ti"></label></div>
<div class="row"><label>왼쪽 칩<input data-k="c1"></label><label>오른쪽 칩<input data-k="c2"></label></div>
<div class="row"><label>선택된 칩<select data-k="act"><option value="0">왼쪽</option><option value="1">오른쪽</option></select></label></div>
</div>
<div class="ps-pn" data-t="이미지">
<h2>영상 화면</h2>
<div class="row"><label class="file">영상 화면 사진<input type="file" accept="image/*" data-k="thRaw"></label></div>
<div class="row"><label class="ek"><input type="checkbox" data-k="gs"> 그린스크린 제거(초록 배경 투명)</label></div>

<div class="row"><label>재생 진행률 %<input data-k="pg"></label></div>
</div>
<div class="ps-pn" data-t="댓글">

<div class="row"><label class="ek"><input type="checkbox" data-k="showI"> 댓글 입력창 보이기</label></div>
<label>입력창 문구<input data-k="ip"></label>
<h2 style="margin-top:14px">댓글 목록</h2>
<div id="mlist"></div>
<button class="ghost" id="addC" type="button">+ 댓글 추가</button>
</div>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
