<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><script src="../nozoom.js?v=1"></script>
<title>YouTube PC 영상 상세</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="back.css?v=1">
<link rel="stylesheet" href="detail-pc.css?v=2">
<style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=3">
<style id="pc-mobile-lock">html,body{overflow-x:hidden;max-width:100vw}</style>
<link rel="stylesheet" href="../ps-editor.css?v=10"><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>YouTube PC 영상 상세</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="pw" id="pw"><div id="pf"></div></div>


</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>YouTube PC 영상 상세 내용 수정</h2><div class="ps-edwrap"><section class="editor">
<div class="ps-pn" data-t="기본">
  <label>썸네일 사진<input id="iTh" type="file" accept="image/*"></label>
  <label>제목<input id="iTi"></label>
  <label>채널 프로필 사진<input id="iPf" type="file" accept="image/*"></label>
  <label>칩 (쉼표로 구분, 선택은 앞에 *)<input id="iCh"></label>
  <div class="row"><label>채널 이름<input id="iCn"></label><label>구독자<input id="iSb"></label></div>
  <div class="row"><label>좋아요<input id="iLk"></label><label>조회수<input id="iVw"></label><label>올린 시기<input id="iAg"></label></div>
  <label>설명 (줄바꿈 가능)<textarea id="iDs" rows="4"></textarea></label>
</div>
<div class="ps-pn" data-t="댓글" hidden>
  <label>댓글 수<input id="iCm"></label>
  <div id="xc"></div><button class="ghost" id="addC" type="button">+ 댓글 추가</button>
</div>
<div class="ps-pn" data-t="추천 영상" hidden>
  <div id="xr"></div><button class="ghost" id="addR" type="button">+ 추천 영상 추가</button>
</div>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="detail-pc.js?v=2"></script>
<script src="back.js?v=1"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
