<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YouTube PC 채널</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="back.css?v=1">
<link rel="stylesheet" href="channel-pc.css?v=2">
<style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=2">
<style id="pc-mobile-lock">html,body{overflow-x:hidden;max-width:100vw}</style>
<link rel="stylesheet" href="../ps-editor.css?v=7"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>YouTube PC 채널</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="pw" id="pw"><div id="pf"></div></div>


</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>YouTube PC 채널 내용 수정</h2><div class="ps-edwrap"><section class="editor ed">
<div class="ps-pn" data-t="기본">
  <div class="row"><label>채널 이름<input id="iNm"></label><label>아이디<input id="iHd"></label></div>
  <div class="row"><label>구독자<input id="iSb"></label><label>동영상 수<input id="iCn"></label></div>
  <label>소개 문구<input id="iDs"></label>
  <div class="row"><label>링크 이름<input id="iLk"></label><label>링크 주소<input id="iLu" placeholder="https://"></label></div>
</div>
<div class="ps-pn" data-t="영상" hidden>
  <div class="row"><label>배너 사진<input id="iBn" type="file" accept="image/*"></label><label>프로필 사진<input id="iAv" type="file" accept="image/*"></label></div>
  <h2>대표 영상</h2>
  <div class="row"><label>제목<input id="iFt"></label><label>조회수 · 시기<input id="iFm"></label></div>
  <h2>동영상</h2><div id="xlist"></div>
  <button class="ghost" id="addV" type="button">+ 영상 추가</button>
</div>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="channel-pc.js?v=1"></script>
<script src="back.js?v=1"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
