<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><style id="ed-back">.ed-back{position:fixed;top:10px;left:10px;z-index:99999;display:flex;align-items:center;gap:2px;height:34px;padding:0 13px 0 9px;border-radius:17px;background:rgba(20,20,24,.55);color:#fff;font-weight:600;font-size:14px;text-decoration:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 8px rgba(0,0,0,.25)}</style><title>톡방 목업</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#a0b7cb;--bub:#fff;--fg:#111;--sub:#3b4a57;--pill:#8fa5b8;--bar:#fff;--inp:#efefef;--ph:#999;--time:#4a5a68}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2933;--bub:#32404d;--fg:#f2f4f6;--sub:#b5c0ca;--pill:#2b3844;--bar:#161d24;--inp:#2a3540;--ph:#7d8b97;--time:#9aa8b4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f2933;--bub:#32404d;--fg:#f2f4f6;--sub:#b5c0ca;--pill:#2b3844;--bar:#161d24;--inp:#2a3540;--ph:#7d8b97;--time:#9aa8b4;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#top{display:flex;justify-content:flex-end;padding-block:8px}
#tg{border:0;border-radius:14px;padding:7px 12px;font-size:13px;background:var(--pill);color:var(--fg);cursor:pointer}
#chat{flex:1;overflow-y:auto;min-height:0}
.d{text-align:center;margin:18px 0 14px}
.d span{display:inline-block;background:var(--pill);color:var(--sub);font-size:13px;padding:6px 16px;border-radius:16px}
.r{display:flex;gap:9px;margin-bottom:6px;align-items:flex-start}
.av{width:42px;height:42px;border-radius:16px;flex:none;background:#6b8f71}
.n{font-size:13px;color:var(--sub);margin:0 0 5px 2px}
.col{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.m{display:flex;align-items:flex-end;gap:5px}
.b{background:var(--bub);padding:10px 14px;border-radius:18px;font-size:16px;line-height:1.35;max-width:62vw;word-break:break-word}
.b.first{border-top-left-radius:4px}
.t{font-size:11px;color:var(--time);white-space:nowrap;display:none}
body.show .t{display:block}
.me{justify-content:flex-end}
.me .m{flex-direction:row-reverse}
.me .b{background:#fee500;color:#111;border-top-right-radius:4px}
#bar{display:flex;align-items:center;gap:8px;background:var(--bar);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px 14px}
#bar i{width:36px;height:36px;border-radius:50%;background:var(--inp);flex:none;display:grid;place-items:center;font-style:normal;font-size:22px;color:var(--fg)}
#in{flex:1;min-width:0;border:0;border-radius:20px;background:var(--inp);color:var(--fg);padding:11px 14px;font-size:16px;outline:none}
#in::placeholder{color:var(--ph)}
</style>
<div id="top"><button id="tg" type="button">시간 켜기</button></div>
<div id="chat"></div>
<form id="bar"><i>+</i><input id="in" placeholder="메시지 입력" autocomplete="off"><i>#</i></form>
<script>
const av='<svg viewBox="0 0 42 42" width="42" height="42"><rect width="42" height="42" fill="#6b8f71"/><circle cx="21" cy="17" r="8" fill="#e8d5c0"/><path d="M5 42c2-13 10-15 16-15s14 2 16 15z" fill="#2c3e50"/></svg>';
const data=[
['2026년 3월 25일 수요일',[['o','민수','오늘 치킨 먹을래?','오후 6:12'],['o','민수','저녁 먹지 말고 와','오후 6:13']]],
['2026년 3월 26일 목요일',[['o','민수','작업실 갈 거야','오후 2:40']]],
['2026년 4월 1일 수요일',[['o','민수','ㅇㅋ','오전 11:05']]],
['2026년 4월 9일 목요일',[['o','민수','이 영상 봤어?','오후 9:30'],['o','민수','진짜 웃기다','오후 9:31']]]
];
const c=document.getElementById('chat');
function row(k,name,txt,t){
 const f=!c.lastRow||c.lastRow.k!=k||c.lastRow.n!=name;
 if(k=='me'){c.insertAdjacentHTML('beforeend','<div class="r me"><div class="m"><span class="t">'+t+'</span><div class="b"></div></div></div>');c.lastElementChild.querySelector('.b').textContent=txt;}
 else{
  const h='<div class="r">'+(f?'<div class="av">'+av+'</div>':'<div class="av" style="visibility:hidden"></div>')+'<div class="col">'+(f?'<div class="n"></div>':'')+'<div class="m"><div class="b'+(f?' first':'')+'"></div><span class="t">'+t+'</span></div></div></div>';
  c.insertAdjacentHTML('beforeend',h);const e=c.lastElementChild;e.querySelector('.b').textContent=txt;if(f)e.querySelector('.n').textContent=name;
 }
 c.lastRow={k,n:name};
}
data.forEach(([d,ms])=>{c.insertAdjacentHTML('beforeend','<div class="d"><span>'+d+'</span></div>');c.lastRow=null;ms.forEach(([k,n,x,t])=>row(k=='o'?'o':'me',n,x,t))});
c.scrollTop=c.scrollHeight;
const tg=document.getElementById('tg');
tg.onclick=()=>{const s=document.body.classList.toggle('show');tg.textContent=s?'시간 끄기':'시간 켜기'};
document.getElementById('bar').onsubmit=e=>{e.preventDefault();const i=document.getElementById('in');if(!i.value.trim())return;
 const n=new Date(),h=n.getHours(),t=(h<12?'오전 ':'오후 ')+((h%12)||12)+':'+String(n.getMinutes()).padStart(2,'0');
 row('me','',i.value,t);i.value='';c.scrollTop=c.scrollHeight};
</script>
