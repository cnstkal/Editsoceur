<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>네이버 인물 프로필</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="naver.css?v=2">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=3">
<link rel="stylesheet" href="../ps-editor.css?v=10"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>네이버 인물 프로필</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div class="pb" id="pf">
  <div class="pq"><b class="nN" style="flex:none;background:#2ec45e">N</b><b id="pQ"></b><span class="x"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg></span>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2ec45e" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.500 11a6.500 6.500 0 0 0 13 0M12 17.500V21"/></svg></div>
  <div class="ph2"><h3 id="pT"></h3><i id="pCat"></i><div class="ptabs" id="pTabs"></div></div>
  <div class="pbody"><div class="pinfo"><div class="ptb" id="pRows"></div><div class="pph" id="pPh"></div></div><div class="pft" id="pFt"></div></div>
  <div class="pbr">
    <svg width="34" height="34" viewBox="0 0 24 24"><rect x="2.500" y="2.500" width="19" height="19" rx="5" fill="none" stroke="#111" stroke-width="2"/><text x="12" y="17" font-size="13" font-weight="900" text-anchor="middle" fill="#111">N</text></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="7"/><path d="m21 21-5.500-5.500"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.500-5.800M20 4v5h-5"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M4 15h16"/></svg>
  </div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>네이버 인물 프로필 내용 수정</h2><div class="ps-edwrap"><section class="editor">
<div class="ps-pn" data-t="기본">
<label>검색어 / 이름<input id="iQ"></label>
<label>탭 (쉼표로 구분)<input id="iTabs"></label>
<label>선택된 탭 번호(1부터)<input id="iAct" type="number" min="1"></label>
<label>하단 안내문구 (줄바꿈 가능)<textarea id="iFt" rows="3"></textarea></label>
<div class="musicbox"><div class="trow"><span>하단바 표시</span><label class="sw"><input id="iNav" type="checkbox"><i></i></label></div></div>
</div>
<div class="ps-pn" data-t="프로필" hidden>
<div class="row"><label>직업 (배우, 아이돌, 가수…)<input id="iCat"></label><label>테마색<input id="iTc" type="color" style="padding:2px;height:44px"></label></div>
<label class="file">인물 사진<input id="iPh" type="file" accept="image/*"></label>
<h2 style="margin-top:14px">정보 항목</h2><div id="el"></div>
<button class="ghost" id="addR" type="button">+ 항목 추가</button>
</div>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="profile.js?v=2"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
