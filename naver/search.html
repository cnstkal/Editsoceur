<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>네이버 검색기록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="naver.css?v=1">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=1">
</head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>네이버 검색기록</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div class="sb" id="sf">
  <div class="sin"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"/></svg><em id="sPh"></em><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#03c75a" stroke-width="2.200" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="7"/><path d="m21 21-5.500-5.500"/></svg></div>
  <div class="sh2"><b>최근 검색어</b><span>전체삭제</span></div>
  <div class="sl" id="sL"></div>
  <div class="sbt"><b>취소</b>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#03c75a" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.500 11a6.500 6.500 0 0 0 13 0M12 17.500V21"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#03c75a" stroke-width="2.400" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3" fill="#03c75a"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#03c75a" stroke-width="2.200" stroke-linejoin="round"><path d="M12 21.500S4.500 15.500 4.500 10a7.500 7.500 0 0 1 15 0c0 5.500-7.500 11.500-7.500 11.500z"/><circle cx="12" cy="10" r="2.500" fill="#03c75a"/></svg></div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>네이버 검색기록 내용 수정</h2><div class="ps-edwrap"><section class="editor">
  <h2>검색기록 편집</h2>
  <label>검색창 문구<input id="iPh"></label>
  <h2 style="margin-top:14px">최근 검색어</h2><div id="el"></div>
  <button class="ghost" id="addR" type="button">+ 검색어 추가</button>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG로 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="search.js?v=1"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
