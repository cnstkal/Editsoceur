<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../nozoom.js?v=1"></script><title>지식iN 신버전</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><link rel="stylesheet" href="../webtoon/kakaopage.css"><link rel="stylesheet" href="jisikin2.css"><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>지식iN 신버전</h2><p class="ps-sub">9:16 비율 · 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame" id="frame"><div class="kw" id="kw"><div class="ks j" id="ks"></div></div></div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>지식iN 신버전 내용 수정</h2>
<div class="ps-edwrap"><div class="editor">
<div class="ps-pn" data-t="질문">
<label>분류 뱃지<input id="iCh"></label>
<label>제목<input id="iT"></label>
<label>작성자<input id="iW"></label>
<label>조회수<input id="iV"></label>
<label>날짜<input id="iD"></label>
<label style="display:block">본문 (줄바꿈 그대로)<textarea id="iB"></textarea></label>
<label>태그<input id="iTg"></label>
</div>
<div class="ps-pn" data-t="답변" hidden>
<label>답변 개수 문구<input id="iCn"></label>
<label>답변자<input id="iAn"></label>
<label>답변 날짜<input id="iAd"></label>
<label style="display:block">답변 내용<textarea id="iAt" style="height:90px"></textarea></label>
<label>프로필 사진<input id="iAv" type="file" accept="image/*"></label>
<div class="ps-tg"><span>댓글 표시</span><label class="sw"><input id="iRp" type="checkbox"><i></i></label></div>
<label>댓글 작성자<input id="iRn"></label>
<label>댓글 시간<input id="iRt"></label>
<label>댓글 내용<input id="iRb"></label>
<div class="ps-tg"><span>채택 버튼 표시</span><label class="sw"><input id="iSel" type="checkbox"><i></i></label></div>
</div></div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div>
</section></div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="jisikin2.js"></script>
</body></html>
