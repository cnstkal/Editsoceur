<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../../nozoom.js?v=1"></script>
<title>Pop Art</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Comic+Neue:wght@700&display=swap">
<link rel="stylesheet" href="../../ps-base.css?v=4">
<link rel="stylesheet" href="../../ps-editor.css?v=10">
<link rel="stylesheet" href="../../ps-shell.css?v=2">
<link rel="stylesheet" href="pop.css?v=1">
</head><body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="../index.html" style="color:#0095f6;font-weight:600;font-size:15px;text-decoration:none">‹ 뒤로</a><a href="../../index.html">‹ 메인</a><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>Pop Art</h2>
<p class="ps-sub">사진을 워홀·만화 스타일 팝아트로 바꿔요</p>
<div class="ps-stage"><div id="cvWrap"><canvas id="out" width="1080" height="1080"></canvas></div></div>
<p class="info" id="info"></p>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>Pop Art 수정</h2>
<div class="ps-edwrap"><div class="editor">

<div class="ps-pn" data-t="사진">
<label>사진 올리기<input id="iImg" type="file" accept="image/*"></label>
<label>구도<select id="iLay"><option value="1">한 장</option><option value="2" selected>2×2 (워홀식)</option><option value="3">3×3</option></select></label>
<label>비율<select id="iRatio"><option value="1:1">1:1</option><option value="4:5">4:5</option><option value="3:4">3:4</option><option value="16:9">16:9</option><option value="9:16">9:16</option></select></label>
<label>확대<input id="iZoom" type="range" min="100" max="300" value="100"></label>
<label>가로 위치<input id="iPx" type="range" min="-100" max="100" value="0"></label>
<label>세로 위치<input id="iPy" type="range" min="-100" max="100" value="0"></label>
<label>밝기<input id="iBri" type="range" min="-100" max="100" value="0"></label>
<label>대비<input id="iCon" type="range" min="-100" max="100" value="15"></label>
</div>

<div class="ps-pn" data-t="스타일">
<label>스타일<select id="iSty">
 <option value="screen">실크스크린 (3톤)</option><option value="comic">만화 (윤곽선 + 색 단계)</option>
 <option value="duo">하프톤 2톤</option><option value="cmyk">하프톤 컬러 (CMYK 도트)</option></select></label>
<label>팔레트<select id="iPal"><option value="orig">원본 색 (만화 전용)</option><option value="0">핫핑크</option><option value="1">시안</option><option value="2">레드</option><option value="3">그린</option><option value="4">퍼플</option><option value="5">오렌지</option><option value="6">블루</option><option value="7">모노</option><option value="8">골드</option></select></label>
<label>색 단계<input id="iLv" type="range" min="2" max="6" value="4"></label>
<label>윤곽선 강도<input id="iEdge" type="range" min="0" max="100" value="55"></label>
<label>윤곽선 두께<input id="iThick" type="range" min="0" max="3" value="1"></label>
<label>도트 크기<input id="iDot" type="range" min="5" max="30" value="12"></label>
<label>프레임 색<input id="iFrC" type="color" value="#111111"></label>
<label>프레임 두께<input id="iFw" type="range" min="0" max="60" value="16"></label>
<label>칸 사이 간격<input id="iGap" type="range" min="0" max="40" value="12"></label>
</div>

<div class="ps-pn" data-t="말풍선·효과음">
<label>캡션 상자 (왼쪽 위)<input id="iCap" value=""></label>
<label>말풍선 글자<input id="iBub" value=""></label>
<label>말풍선 모양<select id="iBsh"><option value="speech">말풍선 (둥근)</option><option value="shout">외침 (뾰족)</option><option value="think">생각 (구름)</option><option value="box">네모 말풍선</option></select></label>
<label>말풍선 색<select id="iBf"><option value="#ffffff">흰색</option><option value="#fff3a0">노랑</option><option value="#ffc2dd">분홍</option><option value="#bdefff">하늘</option></select></label>
<label>말풍선 가로<input id="iBx" type="range" min="0" max="100" value="70"></label>
<label>말풍선 세로<input id="iBy" type="range" min="0" max="100" value="18"></label>
<label>말풍선 크기<input id="iBs" type="range" min="60" max="200" value="100"></label>
<label>꼬리 방향<select id="iTail"><option value="bl">↙ 왼쪽 아래</option><option value="br">↘ 오른쪽 아래</option><option value="tl">↖ 왼쪽 위</option><option value="tr">↗ 오른쪽 위</option></select></label>
<label>효과음 폭발<select id="iBurst"><option value="">없음</option><option>POW!</option><option>BAM!</option><option>ZAP!</option><option>WOW!</option><option>OMG!</option><option>BOOM!</option><option>LOL!</option><option value="custom">직접 입력</option></select></label>
<label id="lBT">효과음 글자<input id="iBT" value="POP!"></label>
<label>효과음 크기<input id="iBZ" type="range" min="60" max="260" value="150"></label>
<label>효과음 가로<input id="iBX" type="range" min="0" max="100" value="22"></label>
<label>효과음 세로<input id="iBY" type="range" min="0" max="100" value="80"></label>
<label>효과음 회전<input id="iBR" type="range" min="-45" max="45" value="-10"></label>
</div>

</div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="share" type="button">공유</button><button id="savePng" type="button">PNG 저장</button></div>
</section>
</div>
</div>
<script src="pop.js?v=1"></script>
<script src="../../ps-tabs.js?v=2"></script>
</body></html>
