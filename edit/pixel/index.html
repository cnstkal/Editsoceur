<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../../nozoom.js?v=1"></script>
<title>Pixel Art</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../../ps-base.css?v=4">
<link rel="stylesheet" href="../../ps-editor.css?v=10">
<link rel="stylesheet" href="../../ps-shell.css?v=2">
<link rel="stylesheet" href="pixel.css?v=1">
</head><body class="studio">
<div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="../index.html" style="color:#0095f6;font-weight:600;font-size:15px;text-decoration:none">‹ 뒤로</a><a href="../../index.html">‹ 메인</a><button class="ps-pvbtn" id="pvBtn" type="button" hidden>미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main">
<div class="ps-lbl">Live Preview</div>
<h2>Pixel Art</h2>
<p class="ps-sub">사진을 레트로 도트 이미지로 바꿔요</p>
<div class="ps-stage"><div id="cvWrap"><canvas id="out" width="960" height="640"></canvas></div></div>
<p class="info" id="info"></p>
</section>
<section class="ps-card ps-side">
<div class="ps-lbl">Edit Panel</div>
<h2>Pixel Art 수정</h2>
<div class="ps-edwrap"><div class="editor">

<div class="ps-pn" data-t="사진">
<label>사진 올리기<input id="iImg" type="file" accept="image/*"></label>
<label>가로 도트 수<input id="iRes" type="range" min="16" max="256" value="96"></label>
<label>밝기<input id="iBri" type="range" min="-100" max="100" value="0"></label>
<label>대비<input id="iCon" type="range" min="-100" max="100" value="10"></label>
<label>채도<input id="iSat" type="range" min="0" max="250" value="110"></label>
<label>확대<input id="iZoom" type="range" min="100" max="300" value="100"></label>
<label>가로 위치<input id="iPx" type="range" min="-100" max="100" value="0"></label>
<label>세로 위치<input id="iPy" type="range" min="-100" max="100" value="0"></label>
<label>비율<select id="iRatio"><option value="0">원본 비율</option><option value="1">1:1</option><option value="0.8">4:5</option><option value="1.7778">16:9</option><option value="0.5625">9:16</option></select></label>
</div>

<div class="ps-pn" data-t="스타일">
<label>팔레트<select id="iPal">
 <option value="gameboy">게임보이 (초록 4색)</option><option value="pico8">PICO-8 (16색)</option><option value="bw">1비트 흑백</option>
 <option value="cga">CGA (4색)</option><option value="sepia">세피아 (4색)</option><option value="vapor">베이퍼웨이브 (5색)</option>
 <option value="amber">앰버 모니터 (4색)</option><option value="orig">원본 색 (단계 줄이기)</option></select></label>
<label id="lLv">색 단계 (원본 색)<input id="iLv" type="range" min="2" max="8" value="4"></label>
<label>디더링<select id="iDit"><option value="fs">Floyd–Steinberg (부드러움)</option><option value="bayer">Bayer (격자무늬)</option><option value="none">없음 (딱딱함)</option></select></label>
<label>격자선<input id="iGrid" type="checkbox"></label>
<label>CRT 효과 (스캔라인)<input id="iCrt" type="checkbox"></label>
<label>색 반전<input id="iInv" type="checkbox"></label>
</div>

</div></div>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="share" type="button">공유</button><button id="savePng" type="button">PNG 저장</button></div>
</section>
</div>
</div>
<script src="pixel.js?v=1"></script>
<script src="../../ps-tabs.js?v=2"></script>
</body></html>
