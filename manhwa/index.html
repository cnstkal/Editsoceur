<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../nozoom.js?v=1"></script>
<title>만화칸</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f3f5;color:#111;font-family:Pretendard,-apple-system,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
.back{color:#00b050;font-weight:600;text-decoration:none}
h1{font-size:28px;margin:8px 0 16px}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,1fr);gap:16px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:20px;padding:18px}
.page{background:#fff;border:2px solid #111;padding:8px;display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px;margin:0 auto}
.row{display:flex;gap:8px}
.pn{position:relative;border:3px solid #111;background:#eee center/cover no-repeat;cursor:pointer;min-width:0;overflow:hidden}
.pn.sel{outline:3px solid #00b050;outline-offset:2px}
.pn.gs{background-color:#00b140}
.pn .no{position:absolute;left:6px;top:4px;font-size:12px;font-weight:700;color:#0006}
.pn.gs .no{color:#fff9}
.lbl{font-size:12px;color:#8a8f98;margin:14px 0 6px;letter-spacing:.08em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
button,.fileb{height:40px;padding:0 14px;border:1px solid #ddd;border-radius:12px;background:#fff;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center}
button.on{background:#e6f8ee;border-color:#00b050;color:#008a3e;font-weight:700}
.cnt{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700}
.cnt button{width:40px;padding:0;justify-content:center;font-size:20px}
.hint{font-size:13px;color:#8a8f98;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">‹ 메인</a>
  <h1>만화칸</h1>
  <div class="grid">
    <div class="card"><div class="page" id="page"></div></div>
    <div class="card">
      <div class="lbl">만화칸 개수</div>
      <div class="cnt"><button id="mn">−</button><span id="n">5</span><button id="pl">+</button><button id="sh" style="margin-left:auto;font-size:14px;width:auto;padding:0 14px">랜덤</button></div>
      <div class="lbl">선택한 칸 비율</div>
      <div class="seg" id="rs"><button data-r="9/16">9:16</button><button data-r="16/9">16:9</button><button data-r="4/3">4:3</button></div>
      <div class="lbl">칸 내용</div>
      <div class="seg">
        <label class="fileb">이미지 추가<input type="file" id="f" accept="image/*" hidden></label>
        <button id="gs">그린스크린</button>
        <button id="cl">비우기</button>
      </div>
      <p class="hint" style="margin-top:14px">왼쪽에서 칸을 눌러 선택하세요. 칸마다 비율이 달라 크기·모양이 자동으로 다양해져요.</p>
    </div>
  </div>
</div>
<script>
var RS=['9/16','16/9','4/3'],P=[],sel=0,seed=0;
function num(r){var a=r.split('/');return a[0]/a[1]}
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
function split(n){ // 행별 칸 수 분배 (1~3칸/행)
  var rows=[],left=n;
  while(left>0){var k=Math.min(left,1+Math.floor(rnd()*3));
    if(left-k===1&&left>2)k=left-2; rows.push(k);left-=k}
  return rows}
var layout=[];
function resize(n){
  while(P.length<n)P.push({r:RS[Math.floor(Math.random()*3)],img:'',gs:false});
  P.length=n; if(sel>=n)sel=n-1;
  layout=split(n);render()}
function render(){
  var pg=document.getElementById('page');pg.innerHTML='';var i=0;
  layout.forEach(function(k){
    var row=document.createElement('div');row.className='row';
    var items=P.slice(i,i+k);
    items.forEach(function(p,j){
      var d=document.createElement('div');d.className='pn'+(i+j===sel?' sel':'')+(p.gs?' gs':'');
      d.style.flex=num(p.r)+' 1 0';d.style.aspectRatio='auto';
      d.style.height='auto';
      var q=document.createElement('div');q.style.paddingTop=(100/num(p.r))+'%'; /* 비율 유지 */
      d.appendChild(q);
      if(p.img&&!p.gs)d.style.backgroundImage='url('+p.img+')';
      var no=document.createElement('span');no.className='no';no.textContent=i+j+1;d.appendChild(no);
      d.onclick=(function(x){return function(){sel=x;render()}})(i+j);
      row.appendChild(d)});
    i+=k;pg.appendChild(row)});
  document.getElementById('n').textContent=P.length;
  [].forEach.call(document.querySelectorAll('#rs button'),function(b){b.classList.toggle('on',P[sel]&&b.dataset.r===P[sel].r)});
  document.getElementById('gs').classList.toggle('on',!!(P[sel]&&P[sel].gs))}
document.getElementById('mn').onclick=function(){if(P.length>1)resize(P.length-1)};
document.getElementById('pl').onclick=function(){if(P.length<12)resize(P.length+1)};
document.getElementById('sh').onclick=function(){
  layout=split(P.length);
  P.forEach(function(p){p.r=RS[Math.floor(Math.random()*3)]});
  render()};
[].forEach.call(document.querySelectorAll('#rs button'),function(b){b.onclick=function(){P[sel].r=b.dataset.r;render()}});
document.getElementById('gs').onclick=function(){P[sel].gs=!P[sel].gs;render()};
document.getElementById('cl').onclick=function(){P[sel].img='';P[sel].gs=false;render()};
document.getElementById('f').onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){P[sel].img=r.result;P[sel].gs=false;render()};r.readAsDataURL(f);e.target.value=''};
seed=7;resize(5);
</script>
</body>
</html>
