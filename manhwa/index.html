<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../nozoom.js?v=1"></script>
<title>만화칸</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f3f5;color:#111;font-family:Pretendard,-apple-system,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
.back{color:#00b050;font-weight:600;text-decoration:none}
h1{font-size:28px;margin:8px 0 16px}
.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:16px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:20px;padding:18px}
.stage{display:flex;justify-content:center;background:#e9eaed;border-radius:12px;padding:12px}
#svg{background:#fff;display:block;box-shadow:0 1px 6px #0002;cursor:pointer}
.lbl{font-size:12px;color:#8a8f98;margin:16px 0 6px;letter-spacing:.08em}
.lbl:first-child{margin-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,.fileb{height:40px;padding:0 14px;border:1px solid #ddd;border-radius:12px;background:#fff;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center}
button.on{background:#e6f8ee;border-color:#00b050;color:#008a3e;font-weight:700}
.cnt{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700}
.cnt button{width:40px;padding:0;justify-content:center;font-size:20px}
input[type=range]{flex:1;accent-color:#00b050}
.hint{font-size:13px;color:#8a8f98;margin:14px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">‹ 메인</a>
  <h1>만화칸</h1>
  <div class="grid">
    <div class="card"><div class="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg></div></div>
    <div class="card">
      <div class="lbl">전체 비율 (고정)</div>
      <div class="seg" id="rs"><button data-r="9/16">9:16</button><button data-r="16/9">16:9</button><button data-r="4/3">4:3</button><button data-r="3/4">3:4</button><button data-r="1/1">1:1</button><button data-r="2/3">2:3</button><button data-r="3/2">3:2</button><button data-r="4/5">4:5</button><button data-r="5/4">5:4</button><button data-r="21/9">21:9</button><button data-r="1/2">1:2</button><button data-r="1/3">1:3</button></div>
      <div class="lbl">만화칸 개수</div>
      <div class="cnt"><button id="mn">−</button><span id="n">5</span><button id="pl">+</button></div>
      <div class="lbl">칸 모양</div>
      <div class="seg" id="md"><button data-m="rect">직사각형만</button><button data-m="trap">사다리꼴만</button><button data-m="any">혼합</button><button id="sh">🎲 랜덤</button></div>
      <div class="lbl">선 두께 <span id="lwv"></span></div>
      <div class="seg"><input type="range" id="lw" min="0" max="10" step="0.5" value="1.5"></div>
      <div class="lbl">선택한 칸 내용</div>
      <div class="seg">
        <button id="fb">이미지 추가</button><input type="file" id="f" accept="image/*" style="display:none">
        <button id="gs">그린스크린</button>
        <button id="cl">비우기</button>
      </div>
      <p class="hint" id="hint">칸을 여러 개 눌러 선택할 수 있어요 (다시 누르면 해제). 랜덤은 칸 모양·배치만 바꾸고 전체 비율은 그대로예요.</p>
    </div>
  </div>
</div>
<script>
var W=1000,RATIO='16/9',H=562,N=5,LW=1.5,GAP=14,MARGIN=14;
var MODE='any',sels=[];
var content=[]; // 칸별 {img,gs}
var panels=[];  // 칸 다각형 목록
var NS='http://www.w3.org/2000/svg';

function area(p){var s=0;for(var i=0;i<p.length;i++){var a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1]}return Math.abs(s)/2}
function bbox(p){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;p.forEach(function(q){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1])});return [x0,y0,x1,y1]}
// 볼록 다각형을 반평면 nx*x+ny*y<=c 로 자름
function clip(poly,nx,ny,c){
  var out=[];
  for(var i=0;i<poly.length;i++){
    var a=poly[i],b=poly[(i+1)%poly.length];
    var da=nx*a[0]+ny*a[1]-c,db=nx*b[0]+ny*b[1]-c;
    if(da<=0)out.push(a);
    if((da<0&&db>0)||(da>0&&db<0)){var t=da/(da-db);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}
  }
  return out;
}
function split(poly){
  var b=bbox(poly),w=b[2]-b[0],h=b[3]-b[1];
  var vertical=Math.random()<(w/(w+h))*1.3+(w>h?0.1:-0.1); // 세로선(좌우 분할)
  var t=0.35+Math.random()*0.3;
  var th=(MODE==='trap'||(MODE==='any'&&Math.random()<0.6))?(Math.random()<0.5?-1:1)*(0.05+Math.random()*0.17):0; // 사선
  var px=b[0]+w*t,py=b[1]+h*t,nx,ny;
  if(vertical){nx=Math.cos(th);ny=-Math.sin(th)}else{nx=-Math.sin(th);ny=Math.cos(th)}
  var d=nx*px+ny*py;
  var A=clip(poly,nx,ny,d-GAP/2),B=clip(poly,-nx,-ny,-d-GAP/2);
  if(A.length<3||B.length<3||area(A)<4000||area(B)<4000)return null;
  return [A,B];
}
function generate(){
  var rr=RATIO.split('/');H=Math.round(W*rr[1]/rr[0]);
  var m=MARGIN;
  var list=[[[m,m],[W-m,m],[W-m,H-m],[m,H-m]]],guard=0;
  while(list.length<N&&guard++<400){
    list.sort(function(a,b){return area(b)-area(a)});
    var cand=Math.random()<0.7?0:Math.floor(Math.random()*Math.min(2,list.length)); // 큰 칸 위주로 분할
    var r=split(list[cand]);
    if(r){list.splice(cand,1);list.push(r[0],r[1])}
  }
  // 읽는 순서: 위→아래, 왼→오
  list.sort(function(a,b){var A=bbox(a),B=bbox(b);return Math.abs(A[1]-B[1])>H*0.12?A[1]-B[1]:A[0]-B[0]});
  panels=list;
  while(content.length<N)content.push({img:'',gs:false});
  content.length=N;
  sels=sels.filter(function(i){return i<N});
  render();
}
function render(){
  var svg=document.getElementById('svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  var ar=W/H,maxH=Math.max(320,window.innerHeight*0.78);
  svg.style.aspectRatio=W+'/'+H;
  svg.style.width='min(100%,'+Math.round(maxH*ar)+'px)';
  var s='<defs>';
  panels.forEach(function(p,i){s+='<clipPath id="c'+i+'"><polygon points="'+p.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ')+'"/></clipPath>'});
  s+='</defs><rect width="'+W+'" height="'+H+'" fill="#fff"/>';
  panels.forEach(function(p,i){
    var pts=p.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ');
    var b=bbox(p),c=content[i],fill=c.gs?'#00b140':'#f4f4f5';
    s+='<g data-i="'+i+'"><polygon points="'+pts+'" fill="'+fill+'"/>';
    if(c.img&&!c.gs)s+='<image href="'+c.img+'" xlink:href="'+c.img+'" x="'+b[0]+'" y="'+b[1]+'" width="'+(b[2]-b[0])+'" height="'+(b[3]-b[1])+'" preserveAspectRatio="xMidYMid slice" clip-path="url(#c'+i+')"/>';
    s+='<text x="'+(b[0]+14)+'" y="'+(b[1]+34)+'" font-size="26" font-weight="700" fill="'+(c.gs?'#fff':'#0004')+'" style="pointer-events:none">'+(i+1)+'</text>';
    if(LW>0)s+='<polygon points="'+pts+'" fill="none" stroke="#111" stroke-width="'+LW+'" stroke-linejoin="miter" style="pointer-events:none"/>';
    s+='</g>';
  });
  sels.forEach(function(si){var sp=panels[si];
  if(sp)s+='<polygon points="'+sp.map(function(q){return q[0]+','+q[1]}).join(' ')+'" fill="none" stroke="#00b050" stroke-width="5" stroke-dasharray="14 8" style="pointer-events:none"/>';});
  svg.innerHTML=s;
  document.getElementById('n').textContent=N;
  document.getElementById('lwv').textContent=LW;
  [].forEach.call(document.querySelectorAll('#rs button'),function(b){b.classList.toggle('on',b.dataset.r===RATIO)});
  [].forEach.call(document.querySelectorAll('#md button[data-m]'),function(b){b.classList.toggle('on',b.dataset.m===MODE)});
  document.getElementById('gs').classList.toggle('on',!!(content[sels[0]]&&content[sels[0]].gs));
}
document.getElementById('svg').addEventListener('click',function(e){
  var g=e.target.closest('g[data-i]');if(g){var gi=+g.dataset.i,k=sels.indexOf(gi);if(k>=0)sels.splice(k,1);else sels.push(gi);render()}});
document.getElementById('mn').onclick=function(){if(N>1){N--;generate()}};
document.getElementById('pl').onclick=function(){if(N<12){N++;generate()}};
document.getElementById('sh').onclick=generate;
[].forEach.call(document.querySelectorAll('#rs button'),function(b){b.onclick=function(){RATIO=b.dataset.r;generate()}});
document.getElementById('lw').oninput=function(){LW=+this.value;render()};
function need(){if(sels.length)return 1;var h=document.getElementById('hint');h.style.color='#e11';h.textContent='먼저 칸을 눌러 선택하세요!';setTimeout(function(){h.style.color='';h.textContent='칸을 여러 개 눌러 선택할 수 있어요 (다시 누르면 해제).'},2000)}
document.getElementById('fb').onclick=function(){if(need())document.getElementById('f').click()};
document.getElementById('gs').onclick=function(){if(!need())return;var v=!((content[sels[0]]||{}).gs);sels.forEach(function(i){content[i].gs=v});render()};
document.getElementById('cl').onclick=function(){if(!need())return;sels.forEach(function(i){content[i]={img:'',gs:false}});render()};
document.getElementById('f').onchange=function(e){
  var f=e.target.files[0];if(!f||!sels.length)return;var r=new FileReader();var tg=sels.slice();
  r.onload=function(){tg.forEach(function(i){content[i].img=r.result;content[i].gs=false});render()};r.readAsDataURL(f);e.target.value=''};
[].forEach.call(document.querySelectorAll('#md button[data-m]'),function(b){b.onclick=function(){MODE=b.dataset.m;generate()}});
window.addEventListener('resize',render);
generate();
</script>
</body>
</html>
