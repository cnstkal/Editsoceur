<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>뉴스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="../webtoon/webtoon.css?v=1">
<link rel="stylesheet" href="news.css?v=2">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=2">
<link rel="stylesheet" href="../ps-editor.css?v=5"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>뉴스</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div id="nf" class="wt d nz">
  <div class="scr" id="nScr">
    <div style="height:calc(505*var(--u))" id="nSp"></div><div class="gap"></div>
    <div class="src"><i></i><span id="nOut"></span><s>샘플</s></div>
    <div class="ar" id="nTi"></div>
    <div class="rp"><i></i><b id="nRp"></b><span id="nDt"></span><u id="nOr">기사원문</u></div>
    <div class="rx"><div class="em"><i>😊</i><i>❗</i></div><span id="nRe"></span><svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3C6.800 3 3 6.400 3 10.800c0 2.300 1 4.200 2.700 5.600L5 21l4.300-2.300c.9.200 1.800.3 2.700.3 5.200 0 9-3.400 9-7.800S17.200 3 12 3z"/><circle cx="8" cy="11" r=".8" fill="#333"/><circle cx="12" cy="11" r=".8" fill="#333"/><circle cx="16" cy="11" r=".8" fill="#333"/></svg><span id="nCc"></span>
      <div class="rt"><span>요약</span><svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4zM16 9c1.500 1.500 1.500 4.500 0 6"/></svg><span style="color:#777">가가</span><svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l7 6-7 6V12c-5 0-8 2-10 6 0-6 3-10 10-10z"/></svg></div></div>
    <div class="sbt" id="nSb"></div>
    <div class="bd" id="nBd"></div>
    <div class="em2" id="nEm"></div>
    <div class="cp" id="nCp"></div>
    <div class="in2">ⓘ 이 기사는 언론사에서 <em>세계</em> 섹션으로 분류했습니다.</div>
    <div style="height:calc(90*var(--u))" ></div><div class="gap"></div>
    <div class="pol" id="nPol"></div>
    <div class="ct" id="nCt"></div>
    <div class="cs" id="nCs"></div>
    <div class="ci"><span>댓글을 입력해주세요</span><b>등록</b></div>
    <div class="sr"><span>최신순</span></div>
    <div id="nCm"></div>
    
  </div>
  <div class="hd2" id="nHd"></div>
  <div class="sb"><b id="nTime"></b></div><div class="isl"></div>
  <div class="tp2" id="nTop"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M5 11l7-7 7 7"/></svg></div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>뉴스 내용 수정</h2><div class="ps-edwrap"><section class="editor">
  <h2>뉴스 화면 편집</h2>
  <div class="row"><label>시간<input id="iTime"></label></div>
  <div class="row"><label>주소<input id="iUrl"></label><label>매체 이름(가상)<input id="iOut"></label></div>
  <label>탭 (쉼표 구분)<input id="iTabs"></label>
  <label>선택된 탭 번호(1부터)<input id="iAct" type="number" min="1"></label>
  <label>기사 제목<textarea id="iTi" rows="2"></textarea></label>
  <div class="row"><label>기자<input id="iRp"></label><label>입력 시각<input id="iDt"></label></div>
  <div class="row"><label>공감 수<input id="iRe"></label><label>댓글 수<input id="iCc"></label></div>
  <label>소제목<textarea id="iSb" rows="2"></textarea></label>
  <label>본문<textarea id="iBd" rows="10"></textarea></label>
  <div class="row"><label>기자 이메일 줄<input id="iEm"></label><label>저작권 문구<input id="iCp"></label></div>
  <div class="row"><label>현재 댓글<input id="iC1"></label><label>작성자 삭제<input id="iC2"></label><label>규정 미준수<input id="iC3"></label></div>
  <h2 style="margin-top:14px">댓글</h2><div id="el"></div>
  <button class="ghost" id="addE" type="button">+ 댓글 추가</button>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="../webtoon/common.js?v=1"></script>
<script src="news.js?v=2"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script>(function(){function fit(){var f=document.querySelector('.ps-frame'),p=document.querySelector('.phone');if(!f||!p)return;if(innerWidth>=1100){p.style.transform='';p.style.width='';p.style.height='';f.style.height='';return}var k=f.clientWidth/430;p.style.width='430px';p.style.transformOrigin='top left';p.style.transform='scale('+k+')';p.style.height='auto';f.style.height=(p.offsetHeight*k)+'px';f.style.overflow='hidden'}addEventListener('resize',fit);addEventListener('load',fit);setTimeout(fit,300)})();</script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
