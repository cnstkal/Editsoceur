<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>뉴스 표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="news-table.css?v=1">
</head><body>
<main class="wrap">
<section class="card pv"><div class="lbl">Live Preview · 9:16 투명 PNG</div>
<div class="view" id="view"><div class="chk"><div id="stage">
<div id="grp"><div class="tag"><i id="vChip"></i><b id="vName"></b><span id="vSub"></span></div>
<div class="bar"><p id="vTxt"></p></div></div>
<div class="tick" id="tick"><div id="vTick"></div></div>
</div></div></div></section>
<section class="card ed"><div class="lbl">Edit Panel</div><h2>뉴스 표 수정</h2>
<label>이름<input id="iName"></label>
<label>부제(직함)<input id="iSub"></label>
<label>속보 칩 (비우면 숨김)<input id="iChip"></label>
<label>본문 (강조: [[텍스트]], 줄바꿈 반영)<textarea id="iTxt" rows="4"></textarea></label>
<label>하단 티커 (※로 구분)<textarea id="iTick" rows="2"></textarea></label>
<div class="row"><label>바 색<input id="iBar" type="color"></label><label>강조색<input id="iHi" type="color"></label><label>포인트색<input id="iAc" type="color"></label></div>
<label>세로 위치 <span id="pY"></span><input id="iY" type="range" min="10" max="85"></label>
<label>글자 크기 <span id="pS"></span><input id="iS" type="range" min="36" max="80"></label>
<label class="tg"><input id="iT" type="checkbox"> 하단 티커 표시</label>
<div class="acts"><button id="save">PNG 저장</button><button id="reset" class="g">초기화</button></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="news-table.js?v=1"></script>
</body></html>
