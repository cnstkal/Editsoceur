<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>아이메시지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="message.css?v=1">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=1">
</head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>아이메시지</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div id="mf">
<div class="mh">
<div class="mback"><svg viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill="none" stroke="#000" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></svg><b id="mCnt"></b></div>
<i class="mav" id="mAv"></i>
<div class="mnm"><b id="mNm"></b><svg viewBox="0 0 8 14"><path d="M1.500 1.500 6.500 7l-5 5.500" fill="none" stroke="#b0b0b5" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</div>
<div class="mm" id="mL"></div>
<i class="msb"></i>
<div class="min">
<span class="mplus"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18" fill="none" stroke="#000" stroke-width="2.200" stroke-linecap="round"/></svg></span>
<span class="mfd"><em id="mPh"></em><svg viewBox="0 0 22 22"><path d="M3 9v4M7 6v10M11 3v16M15 6v10M19 9v4" fill="none" stroke="#8e8e93" stroke-width="2" stroke-linecap="round"/></svg></span>
</div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>아이메시지 내용 수정</h2><div class="ps-edwrap"><section class="editor">
<h2>메시지 화면 편집</h2>
<div class="row"><label>상대 이름<input id="iNm"></label><label>뒤로가기 숫자<input id="iCnt"></label></div>
<div class="row"><label>화면 비율<select id="iRatio"><option value="phone">기본 (휴대폰)</option><option value="16:9">16:9</option><option value="4:3">4:3</option></select></label></div>
<div class="row"><label>상대 기기<select id="iMode"><option value="android">안드로이드 (초록)</option><option value="ios">아이폰 (파랑)</option></select></label><label>읽음 문구(비우면 숨김)<input id="iRead"></label></div>
<div class="row"><label class="file">프로필 사진<input type="file" accept="image/*" id="iAv"></label></div>
<h2 style="margin-top:14px">메시지</h2>
<div id="mlist"></div>
<button class="ghost" id="addM" type="button">+ 메시지 추가</button>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG로 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="message.js?v=2"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
</body>
</html>
