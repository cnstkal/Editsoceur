<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><script src="../nozoom.js?v=1"></script>
<title>커뮤니티 게시글</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="post.css?v=1">
<link rel="stylesheet" href="back.css?v=1">
<link rel="stylesheet" href="studio.css?v=1">
<link rel="stylesheet" href="../ps-editor.css?v=10">
<style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><style id="pa">body{animation:paIn .28s ease both}body.pa-out{animation:paOut .18s ease forwards}@keyframes paIn{from{opacity:0}to{opacity:1}}@keyframes paOut{to{opacity:0}}@media (prefers-reduced-motion:reduce){body,body.pa-out{animation:none}}</style><script id="pa-js">(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute("download"))return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript:|mailto:|tel:)/.test(h))return;var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;e.preventDefault();document.body.classList.add("pa-out");setTimeout(function(){location.href=u.href},180)},true)})();</script></head>
<body class="studio">
<div class="ps-wrap"><header class="ps-top"><a class="ps-back" href="index.html" style="color:#0095f6;font-weight:600;font-size:15px;text-decoration:none">‹ 뒤로</a><span></span></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>커뮤니티 게시글</h2><p class="ps-sub">화면을 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="cm-frame"><div id="cap" class="phone"></div></div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Editor</div><h2>내용 수정</h2>
<div class="ps-edwrap"><div class="ed">
<div class="ps-pn" data-t="기본">
    <h2>기본</h2>
    <label>갤러리 이름<input id="gal"></label>
</div>
<div class="ps-pn" data-t="게시글" hidden>
    <h2>상단 탭</h2>
    <div class="row"><label>탭1<input id="t0"></label><label>탭2(선택)<input id="t1"></label></div>
    <div class="row"><label>탭3<input id="t2"></label><label>탭4<input id="t3"></label></div>
    <h2>게시글</h2>
    <label>닉네임<input id="nick"></label>
    <label>제목<input id="title"></label>
    <label>작성일시<input id="date"></label>
    <div class="row"><label>조회수<input id="view"></label><label>추천<input id="rec"></label><label>댓글<input id="cmt"></label></div>
    <label>본문 (줄바꿈 가능)<textarea id="body" rows="5"></textarea></label>
    <label>강조 문구(비우면 숨김)<input id="note"></label>
    <div class="upl"><div class="upl-th"><img alt=""><span>없음</span></div><div class="upl-body"><span class="upl-label">사진</span><b class="upl-name">선택된 파일 없음</b><label class="upl-btn">변경<input id="img" type="file" accept="image/*"></label><button class="upl-del" id="img_del" type="button">삭제</button></div></div>
    <div class="ps-tg"><span>사진 영역 표시</span><label class="sw"><input id="showImg" type="checkbox"><i></i></label></div>
</div>
</div></div>
<script>(function(){var ed=document.querySelector('.ed'),g=[].slice.call(ed.querySelectorAll('.ps-pn')),bar=document.createElement('div');bar.className='ps-seg';
g.forEach(function(p,i){var b=document.createElement('button');b.type='button';b.textContent=p.getAttribute('data-t');if(!i)b.className='on';
b.onclick=function(){g.forEach(function(x,j){x.hidden=j!==i});[].forEach.call(bar.children,function(c,j){c.classList.toggle('on',j===i)})};bar.appendChild(b)});
ed.parentNode.insertBefore(bar,ed)})();</script>
<div class="ps-acts"><button id="reset" type="button">초기화</button><button id="savePng" type="button">PNG 저장</button></div></section>
</div></div>
<a class="tback" href="index.html" aria-label="선택 화면으로">‹</a>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="post.js?v=1"></script>
<script src="back.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script><script src="../upl.js?v=1" defer></script></body>
</html>
