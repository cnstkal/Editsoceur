<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>커뮤니티</title>
<link rel="stylesheet" href="instiz.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"></div>
    <div class="icons" id="topIcons"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <section class="board"><h2>연예 <span class="star">★</span></h2></section>
  <article>
    <h1 id="title"></h1>
    <div class="meta"><span id="meta"></span><span class="more" id="moreTop"></span></div>
    <div class="ad"></div>
    <div class="body" id="body"></div>
    <div class="acts" id="acts"></div>
  </article>
  <section id="comments"></section>
  <div class="fab">
    <button class="hot"><span id="flame"></span>인기글</button>
    <button class="gray" id="dots"></button>
  </div>
</div>
<script src="instiz.js"></script>
</body>
</html>
