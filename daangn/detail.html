<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>당근 상세 내용 수정</h2><div class="ps-edwrap"><section class="editor">

  <div class="row"><label>가격<input id="iPc"></label><label>페이 표시<select id="iPay"><option value="1">표시</option><option value="0">숨김</option></select></label></div>
  <div class="row"><label>카테고리<input id="iCat"></label><label>올린 시간<input id="iWh"></label></div>
  <div class="row"><label>관심 수<input id="iLk"></label><label>조회 수<input id="iVw"></label></div>
