</div>

</div>
<script>(function(){var c=document.getElementById('iWrOn'),h=document.getElementById('iWr');function sync(){c.checked=!!h.value}setTimeout(sync,80);c.onchange=function(){h.value=c.checked?'+ 글쓰기':'';h.dispatchEvent(new Event('input',{bubbles:true}))};var n=document.getElementById('iNvOn'),nh=document.getElementById('iNv');setTimeout(function(){n.checked=nh.value!=='0'},80);n.onchange=function(){nh.value=n.checked?'1':'0';nh.dispatchEvent(new Event('input',{bubbles:true}))}})();</script>
