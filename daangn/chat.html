<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="../nozoom.js?v=1"></script>
<title>당근 채팅</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../instagram/story.css?v=3">
<link rel="stylesheet" href="../webtoon/webtoon.css?v=1">
<link rel="stylesheet" href="daangn.css?v=1">
<style data-hide-status>:is(span,b)[id$="Time"],#eTm,.isl,.ys,.ysig,.ywf,.ybt,.dsg,.dwf,#df .dbt,.msg,.mwf,.mbt,.ewf,.ebt,.nwf,.nbt,.sb:has([id$="Time"])>svg:not(.lc),.sb:has([id$="Time"])+.bt,.sb:has([id$="Time"]) .bt{display:none!important}</style><style id="ed-font">html,body,body *{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif!important;letter-spacing:-.02em!important}</style><link rel="stylesheet" href="studio.css?v=2">
<link rel="stylesheet" href="../ps-editor.css?v=10"></head>
<body class="studio"><div class="ps-wrap">
<header class="ps-top"><a class="ps-back" href="index.html">‹ 뒤로</a><button class="ps-pvbtn" id="pvBtn" type="button">미리보기 모드</button></header>
<div class="ps-grid">
<section class="ps-card ps-main"><div class="ps-lbl">Live Preview</div><h2>당근 채팅</h2><p class="ps-sub">실제 앱 화면 비율로 확인하고, 오른쪽에서 바로 수정해요</p>
<div class="ps-stage"><div class="ps-frame">
<div class="phone">
<div id="cf" class="wt d ch">
  <div class="sb"><b id="cTime"></b></div>
  <svg class="ic" style="left:calc(46*var(--u))" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.900" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4-8 8 8 8"/></svg>
  <svg class="ic" style="left:calc(932*var(--u))" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h4l2 5-2.500 1.500a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>
  <svg class="ic" style="left:calc(1082*var(--u))" viewBox="0 0 24 24" fill="#111"><circle cx="12" cy="5" r="1.800"/><circle cx="12" cy="12" r="1.800"/><circle cx="12" cy="19" r="1.800"/></svg>
  <div class="nm"><span id="cNm"></span><i id="cTp"></i></div>
  <div class="sub" id="cSub"></div>
  <div class="pd"><i class="th"><i class="cv" id="cTh"></i></i><div class="pt"><div class="l1"><b id="cSt"></b><span id="cPt"></span></div><div class="l2" id="cPr"></div></div></div>
  <div class="ms" id="cMs"></div>
  <div class="dn"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M5 13l7 7 7-7"/></svg></div>
  <div class="in"><svg class="pl" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.600" stroke-linecap="round"><path d="M12 2v20M2 12h20"/></svg><div class="bx">메시지 보내기</div>
    <svg class="sm" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="1.800" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M7.500 14a5 5 0 0 0 9 0"/><circle cx="9" cy="9.500" r="1" fill="#777"/><circle cx="15" cy="9.500" r="1" fill="#777"/></svg>
    <svg class="sd" viewBox="0 0 24 24" fill="#c9ccd1"><path d="M2 3 22 12 2 21l3-9z"/></svg></div>
</div>

</div>

</div></div></section>
<section class="ps-card ps-side"><div class="ps-lbl">Edit Panel</div><h2>당근 채팅 내용 수정</h2><div class="ps-edwrap"><section class="editor">
  <h2>당근 채팅 편집</h2>
  <div class="row"><label>시간<input id="iTime"></label><label>상대 이름<input id="iNm"></label></div>
  <div class="row"><label>매너온도<input id="iTp"></label><label>부제<input id="iSub"></label></div>
  <label>상품 사진<input id="iTh" type="file" accept="image/*"></label>
  <div class="row"><label>거래 상태<input id="iSt"></label><label>가격<input id="iPr"></label></div>
  <label>상품 제목<input id="iPt"></label>
  <h2 style="margin-top:14px">메시지</h2><div id="el"></div>
  <button class="ghost" id="addE" type="button">+ 메시지 추가</button>
</section></div><div class="ps-acts"><button id="savePng" class="primary">PNG 저장</button><button id="reset" class="secondary">초기화</button></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="../webtoon/common.js?v=1"></script>
<script src="chat.js?v=1"></script>
<script>(function(){var b=document.getElementById("pvBtn");b.onclick=function(){var on=document.body.classList.toggle("pvmode");this.textContent=on?"편집 모드":"미리보기 모드"}})();</script>
<script src="studio.js?v=1"></script>
<script src="../back-anim.js?v=1" defer></script></body>
</html>
